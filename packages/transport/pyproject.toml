# Общий низ конвейера пакетом: транспорт к площадке и обрезка вывода.
#
# ПОЧЕМУ ЗДЕСЬ, А НЕ В СВОЁМ РЕПОЗИТОРИИ. Пакет живёт рядом с эталонным
# конвейером, и потребители прибиваются к ТЕГУ ВЫПУСКА этого репозитория, а не к
# его общей ветке — того же требует договор связи от них самих. Второй
# репозиторий означал бы второй конвейер и второе число версии рядом с версией
# контракта; решение и отвергнутые варианты — docs/decisions/023.
#
# У ПАКЕТА СВОЯ ВЕРСИЯ, И ЭТО НЕ НЕДОСМОТР. Версия контракта механизмов
# (CONTRACT_VERSION в корне) говорит о поверхности конвейера — именах джобов,
# входах, форме ответа; версия этого пакета — о поверхности Python. Числа разные,
# потому что версионируют разное (164), и у каждого один источник: здесь это файл
# VERSION рядом, его же читает сборка.
#
# ПОТРЕБИТЕЛЬ ПРИБИВАЕТСЯ К ТЕГУ РЕПОЗИТОРИЯ, а не к этому числу:
#   pip install "engineering-pipeline-transport @ git+https://github.com/ArtVsMark/Engineering-Pipeline-Mechanisms@v1.1.0#subdirectory=packages/transport"
# Тег — то, что проект выпускает и о чём объявляет; число ниже отвечает на другой
# вопрос: менялась ли поверхность самого транспорта.
#
# ЧЕГО ЗДЕСЬ ЕЩЁ НЕТ И ЭТО НАЗВАНО (046): правил эволюции этой версии. Пока
# транспорт двигают правкой, число двигают вместе с ней рукой; механизм появится
# вместе с первым внешним потребителем — до него правило было бы выдумано.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-pipeline-transport"
description = "Транспорт к площадке и обрезка вывода — общий низ конвейера семьи"
requires-python = ">=3.12"
dependencies = []
dynamic = ["version"]

[tool.setuptools]
py-modules = ["ghrest", "report"]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
