# Семейный значок «family │ gives │ family │ pairs │ ext │ EIP · EPM» у
# потребителя — составным действием механизмов (#1563, решение владельца
# 22.10.2026: переехало из каталога вместе со сверкой семьи).
#
# СЕМЬЮ СПРОСИЛИ ПЕРВОЙ (162): действие взято у каталога вместе со сверкой
# семьи — у каталога оно было готовым действием семейного значка, и приём
# перенесён сюда переездом. У соседей по семье своей сверки нет: они звали
# действие каталога.
#
# Свой код — из выкачки действия по тегу из `uses:` (`github.action_path`), а
# не из дерева потребителя. Сверяется дерево ПРОЕКТА с опубликованной сводкой
# семьи. Python ставит вызывающий джоб — чужих `uses:` здесь нет (#1387).
#
# Действие только РИСУЕТ картинку и кладёт рядом разбор `family-check.json`.
# Цвет — данные, а не исход шага: красный значок рисуется, а не роняет прогон
# (004). Код выхода 2 — сводка семьи не прочитана; прежний значок публикацией
# лучше не трогать.
name: family-badge
description: >-
  Сверяет, что проект отдаёт и что берёт у семьи, со свежими версиями из сводки
  семьи и рисует значок по сегментам gives · family · pairs · ext и блок
  издателей EIP · EPM; серый — не сверялось.
inputs:
  out:
    description: Куда положить SVG, относительно корня проекта; разбор family-check.json — рядом.
    default: .github/badges/family.svg
  family:
    description: Адрес или путь сводки семьи; пусто — сводка, которую публикует каталог.
    default: ""
runs:
  using: composite
  steps:
    - name: поставить транспорт из выкачки действия
      shell: bash
      run: python -m pip install --quiet "pyyaml>=6,<7" "$GITHUB_ACTION_PATH/../../../packages/transport"
    - name: нарисовать семейный значок
      shell: bash
      env:
        MECHANISMS: ${{ github.action_path }}/../../..
        OUT: ${{ inputs.out }}
        FAMILY: ${{ inputs.family }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # Имя проекта — от площадки, а не умолчание скрипта: умолчание —
        # механизмы, и сосед сверялся бы как издатель EPM.
        args=(--root "$GITHUB_WORKSPACE" --repo "$REPO" --out "$GITHUB_WORKSPACE/$OUT")
        [ -n "$FAMILY" ] && args+=(--family "$FAMILY")
        python "$MECHANISMS/scripts/family_check.py" ${args[@]+"${args[@]}"}
