# Сводный гейт — СОСТАВНЫМ ДЕЙСТВИЕМ, а не копией прогона (#1385, решение
# владельца 15.10.2026, путь А2).
#
# ОТДАЁТСЯ НАРУЖУ: потребитель зовёт это действие шагом своего джоба
# `ci-complete` адресом с версией, к которой он прибит (157), а не копией тела.
#
# ПОЧЕМУ ДЕЙСТВИЕ, А НЕ ПЕРЕИСПОЛЬЗУЕМЫЙ ШАГ, КАК У ДВАДЦАТИ ПРОЧИХ. Запись
# переиспользуемого прогона площадка зовёт составным именем «вызывающий /
# вызванный», а имя `ci-complete` — единственное в защите ветки у нас и у
# каждого потребителя. Шаг переименовал бы его в `ci-complete / ci-complete` и
# потребовал бы правки защиты везде. Действие исполняется ВНУТРИ джоба
# потребителя `ci-complete`, и имя записи не меняется ни у кого.
#
# СВОЙ КОД ДЕЙСТВИЕ БЕРЁТ ИЗ СВОЕЙ ЖЕ ВЫКАЧКИ, а не из дерева потребителя:
# площадка кладёт репозиторий действия по тегу из `uses:` целиком, и
# `github.action_path` указывает в него. Прежняя копия звала
# `scripts/ci_complete.py` из дерева потребителя, где его нет, — и сводный гейт
# у потребителя не работал вовсе.
#
# СОСЕД НАЗВАН (195): будильник гейта `ci-complete-wake.yml` — пока копия и
# зовёт `scripts/ci_complete_wake.py` из дерева потребителя, где его нет. У
# потребителя он не работает; его вынос — следующий в #1385.
#
# ЧУЖИХ `uses:` ЗДЕСЬ НЕТ НАМЕРЕННО. Python ставит вызывающий джоб: так
# закреплённые версии живут в каталоге прогонов, где их поднимает перехват
# Dependabot (#1387), а тег самого действия в `uses:` вызывающего — тоже.
name: ci-complete
description: Сводный гейт — опрашивает обязательные проверки на голове по классам из .pipeline.yml проекта
inputs:
  policy:
    description: ответ проекта по классам проверок
    default: .pipeline.yml
  self-name:
    description: собственное имя записи — себя гейт не ждёт; оно же имя в защите ветки
    default: ci-complete
  token:
    description: токен опроса записей проверок
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: поставить транспорт из выкачки действия
      shell: bash
      run: python -m pip install --quiet "pyyaml>=6,<7" "$GITHUB_ACTION_PATH/../../../packages/transport"
    - name: опросить проверки на голове
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        POLICY: ${{ inputs.policy }}
        SELF_NAME: ${{ inputs.self-name }}
        MECHANISMS: ${{ github.action_path }}/../../..
      # СВОДИМЫЙ ПРОГОН ИЩЕТСЯ ПО ГОЛОВЕ, А НЕ БЕРЁТСЯ ИЗ ОКРУЖЕНИЯ. Пока
      # гейт был джобом внутри `ci`, `GITHUB_RUN_ID` и был номером сводимого
      # прогона. Здесь он номер ЭТОГО прогона и не принадлежит ни одному
      # соседу — а на нём держались оба различия разбора гонки: предпочтение
      # записей сводимого прогона и «джоб ждёт `needs`, а не не стартовал».
      # Имя сводимого — умолчание `--summarises`, и оно же `ci`.
      #
      # НАПОЛНЕНИЕ ОПРОСА ПРИХОДИТ ИЗ ДАННЫХ, А НЕ ИЗ ЭТОГО ФАЙЛА. Класс
      # каждой проверки объявлен в `.pipeline.yml`: обязательная держит
      # слияние, совещательная нет. Список именами здесь означал бы, что
      # класс проверки — свойство механизма, а он свойство проекта (174).
      #
      # ВЫВОД УХОДИТ В АННОТАЦИЮ И СВОДКУ, А НЕ ТОЛЬКО В ЛОГ. Лог прогона
      # читается не из всякого окна — облачному хранилище закрыто, — и от
      # красного там остаётся код возврата, по которому не разобрать ничего.
      # Наружу REST отдаёт АННОТАЦИЮ: замер 13.09.2026 на изменении #290 —
      # `annotations_count: 1` при пустом `output.summary`. Сводка джоба
      # остаётся для человека в окне площадки, и разбор гонки задним числом
      # держится на аннотации (#261).
      run: |
        set -uo pipefail
        rc=0
        python "$MECHANISMS/scripts/ci_complete.py" \
          --policy "$POLICY" \
          --self-name "$SELF_NAME" > "${RUNNER_TEMP}/verdict.txt" 2>&1 || rc=$?
        cat "${RUNNER_TEMP}/verdict.txt"
        # ТЕЛО ПОДАЁТСЯ ОТСТУПОМ, А НЕ ЗАБОРОМ ИЗ КАВЫЧЕК: в вердикт попадают
        # имена проверок и тексты отказов, а три кавычки подряд закрыли бы
        # забор раньше времени. Отступ в четыре пробела ломать нечем.
        {
          echo "### ci-complete: вердикт ${rc}"
          echo
          sed 's/^/    /' "${RUNNER_TEMP}/verdict.txt"
        } >> "${GITHUB_STEP_SUMMARY}"
        # Аннотация одной строкой: переводы строк в ней экранируются, иначе
        # площадка обрежет сообщение первой же из них.
        #
        # ПОРЯДОК ЗАМЕН ОБЯЗАТЕЛЕН: сперва сам знак процента, потом всё
        # остальное. Обратный порядок превращает подставленный `%0A` в
        # `%250A`, а знак процента, пришедший из вывода, обрезал бы
        # сообщение. Нашёл внешний взгляд на #265.
        said="$(sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' "${RUNNER_TEMP}/verdict.txt")"
        # ЗЕЛЁНЫМИ СЧИТАЮТСЯ ТОЛЬКО ОБЪЯВЛЕННЫЕ КОДЫ (068): необработанный
        # сбой Python отдаёт единицу, и «красным считаем перечисленное»
        # прочитало бы её как объявленное состояние.
        case "$rc" in
          0) echo "все объявленные проверки на голове пройдены" ;;
          1) echo "::error::сводный гейт: красно%0A${said}" ;;
          2) echo "::error::сводный гейт: опрос не отработал%0A${said}" ;;
          *) echo "::error::сводный гейт: код ${rc} не объявлен — разбирать нечем%0A${said}"
             rc=2 ;;
        esac
        exit "${rc}"
