# Метки этого репозитория.
#
# Правило 064: метка — вход механизма, а не украшение. Отсюда критерий, по
# которому метка сюда попадает: её кто-то читает — прогон или человек при
# разборе. Метку, которую не читает никто, файл не объявляет, и причина этому
# записана ниже, а не подразумевается (154).
#
# Список разрешительный (068): метка, которой здесь нет, не влияет ни на что.
# Появление новой метки — правка этого файла, а не действие в интерфейсе.
#
# Применяется прогоном .github/workflows/labels-sync.yml на правку файла и по
# кнопке. Руками: python scripts/sync_labels.py --dry-run посмотреть, без ключа
# применить.
#
# Метка, которой здесь нет, НЕ удаляется прогоном: удаление снимает её со всех
# задач разом, и это решение человека, а не побочный эффект синхронизации.

# --- зоны: ставит автор ------------------------------------------------------
#
# `paths` — не комментарий: по нему гейт разметки выводит зону изменения из
# тронутых файлов и сверяет с тем, что на нём стоит. Поле есть только у тех
# зон, чьи файлы уже существуют. У остальных его нет намеренно: правило 075
# требует, чтобы проверка, не нашедшая предмета, падала, — а зона, все пути
# которой указывают в будущее, давала бы ровно молчаливый пропуск.

- name: "area/docs"
  color: "5319E7"
  description: "Зона: договор, свод, витрина"
  paths: ["docs/**", "README.md", "AGENTS.md", "CLAUDE.md"]

- name: "area/gates"
  color: "5319E7"
  description: "Зона: прогоны, проверки, скрипты"
  paths:
    - ".github/workflows/**"
    - ".github/labels.yml"
    - ".github/authors.txt"
    - "scripts/**"
    - "tests/**"
    - "pyproject.toml"

# Пути этой зоны появились вместе с файлами: ответ каталогу, источник версии и
# фрагменты журнала — то, что видит потребитель. Пока их не было, поля не было
# тоже: зона, все пути которой указывают в будущее, давала бы молчаливый
# пропуск вместо проверки (075).
- name: "area/core"
  color: "5319E7"
  description: "Зона: ядро механизмов и контракт с потребителем"
  paths: [".rules/**", "CONTRACT_VERSION", "changelog.d/**", "docs/release.md"]
# У зоны слияния пути появились вместе с механизмом: шаг 8 написан, и выводить
# зону из тронутых файлов теперь есть откуда.
- name: "area/merge"
  color: "5319E7"
  description: "Зона: очередь и слияние (решение #3)"
  paths: ["scripts/automerge.py", ".github/workflows/automerge.yml"]
# У зоны ниже путей нет: её механизмов не существует до шагов 9-11. До тех пор
# зона ставится руками при разборе, и человек — её единственный читатель.
- name: "area/health"
  color: "5319E7"
  description: "Зона: здоровье общей ветки — тревога, заморозка, разморозка"

# --- очередь мержа ------------------------------------------------------------
#
# Читает их scripts/automerge.py. До шага 8 их здесь не было ровно потому, что
# читателя не существовало, — метка без читателя есть украшение (064).
#
# СОГЛАСИЕ СТАВИТ МЕХАНИЗМ, ОСТАЛЬНЫЕ ТРИ — ЧЕЛОВЕК. Ветка с приставкой
# конвейера и есть заявленное согласие: окно резало её под задачу, а не для
# того, чтобы изменение стояло зелёным и ждало метки. Приём взят у соседа по
# семье, где обкатан: согласие ставится сразу при открытии, и метка работает
# не только включателем, но и следом — по ней видно, что изменение отдано
# автоматике.

- name: "automerge"
  color: "0e8a16"
  description: "Отдано очереди: ставит шаг открытия, снимает hold. Сольётся, как позеленеет"
- name: "hold"
  color: "d93f0b"
  description: "Стоп человека: не сливать и снять согласие, сколько бы зелёного ни было"
- name: "blocker"
  color: "b60205"
  description: "Слово владельца: источник 4 контура 1, идёт в очереди раньше плана и правил"
- name: "fix-main"
  color: "b60205"
  description: "Чинит красную общую ветку: идёт первым и не замораживается"

# --- источник работы: ставит очередь, читает человек --------------------------
#
# ЭТО СЛЕД, А НЕ ВХОД. Очередь решает по ВЫЧИСЛЕННОМУ источнику, а не по метке:
# устаревшая метка увела бы слияние не туда, и поймать это было бы нечем.
# Метка отвечает на другой вопрос — «какой источник очередь мне присвоила» — и
# отвечает на списке изменений, без открытия лога.
#
# Ступень очереди есть номер источника работы контура 1 (docs/behaviour.md):
# словарь один на оба контура, а не второй порядок для слияния.
#
# ИСТОЧНИКИ 1 И 2 ОТСТАЮТ, И ЭТО НАЗВАНО. Красноту заход спрашивает у каждого
# кандидата — источник 2 появляется вовремя. Конфликт живёт в состоянии
# слияния, а его площадка считает лениво: спрашивать у всех запрещает правило
# 052, поэтому `source/1` появляется только у головы очереди.
#
# Метки нет вовсе у того, кого в очереди нет: черновик, остановленное меткой
# hold, изменение в чужую базу. Отсутствие здесь — состояние, а не пропуск.

- name: "source/0"
  color: "b60205"
  description: "Источник 0: чинит красную общую ветку — голова очереди"
- name: "source/1"
  color: "fbca04"
  description: "Источник 1: конфликт слияния (виден только у головы очереди)"
- name: "source/2"
  color: "fbca04"
  description: "Источник 2: красная проверка на своём изменении"
- name: "source/3"
  color: "0e8a16"
  description: "Источник 3: снимает находку внешнего взгляда, пережившую слияние"
- name: "source/4"
  color: "0e8a16"
  description: "Источник 4: слово владельца"
- name: "source/5"
  color: "c5def5"
  description: "Источник 5: долг по правилам каталога"
- name: "source/6"
  color: "c5def5"
  description: "Источник 6: план"

# --- род задачи: ставит автор ------------------------------------------------
- name: "epic"
  color: "8B5CF6"
  description: "Сводная задача: состав дочерними, сама работой не является"
- name: "bug"
  color: "d73a4a"
  description: "Дефект: поведение расходится с обещанным"
- name: "enhancement"
  color: "0e8a16"
  description: "Новое поведение"
- name: "documentation"
  color: "0075ca"
  description: "Текст, а не механизм: договор, свод, витрина"
- name: "tech-debt"
  color: "fbca04"
  description: "Долг: работает, но мешает менять"

# --- сложность: ставит автор -------------------------------------------------
#
# Стоят на всех живых задачах проекта. Снять их значило бы потерять разметку
# ради чистоты файла, поэтому они объявлены тем, чем являются: подсказкой
# разбирающему, а не входом механизма. Читатель — человек, и он назван.
- name: "difficulty/easy"
  color: "c2e0c6"
  description: "Разбор: работа на один заход"
- name: "difficulty/medium"
  color: "fef2c0"
  description: "Разбор: работа с развилками"
- name: "difficulty/hard"
  color: "f9d0c4"
  description: "Разбор: требует решения до работы"

# --- ставит площадка ---------------------------------------------------------
#
# Единственное умолчание площадки, которое читает машина: закрытие задачи с
# причиной `duplicate` вешает метку само. Метка, которую вешает механизм, —
# не украшение, и это ровно критерий 064.
- name: "duplicate"
  color: "cfd3d7"
  description: "Повтор: закрыто со ссылкой на первое (ставит площадка)"

# --- чего здесь нет намеренно -------------------------------------------------
#
# needs-rebase — единственная из меток конвейера, которая так и не заведена:
#   её предмет читает сама площадка (mergeable_state), и шаг 8 спрашивает
#   состояние у неё, а не у метки. Дублировать машинное состояние меткой,
#   которую ставит человек, значит завести второй источник того же (022).
#
#   Отдельно про hold, заведённую выше: правило 147 требует у отменяющего
#   переключателя адресата отмены — поставленный и забытый hold обязан кого-то
#   будить. Шаг 8 печатает остановленное на каждом заходе, но настоящим
#   адресатом станет шаг 11 (застрявшие изменения), которого ещё нет. Пробел
#   назван в AGENTS.md, а не выровнен молчанием (046).
#
# question · invalid · wontfix · help wanted · good first issue — умолчания
#   площадки. Заведены в репозитории и файлом не объявлены: их не читает ни
#   один механизм, а внешних участников у проекта пока нет. Синхронизатор
#   назовёт их находкой, а не удалит: снятие метки трогает все задачи разом и
#   решается человеком.
#
# blocked · accessibility — заведены в репозитории руками и умолчанием
#   площадки не являются. Найдены прогоном синхронизатора, а не чтением файла:
#   расхождение между объявленным составом и площадкой видно только оттуда.
#   Не объявлены, потому что читателя у них нет. `blocked` не объявлена и
#   после решения #3: её смысл занят меткой `hold`, которую читает очередь, и
#   две метки про одно — это ровно тот разнобой, ради которого заведён проект.
#   Снятие `blocked` с площадки — решение человека, а не побочный эффект
#   синхронизации.
