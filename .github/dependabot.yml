# Dependabot здесь — ДАТЧИК, а не исполнитель (#1387, решение владельца
# 15.10.2026). Его изменение — сигнал «вышла версия»: прогон
# `deps-intercept.yml` делает подъём сам, веткой `agent/`, и закрывает сигнал.
#
# Группы не заводятся: перехват разбирает заголовок «Bump <действие> from … to …»
# (приставка `build(deps): ` и строчная `bump` допускаются, #1751), а групповой
# заголовок не называет ни действия, ни версии.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    # ВЫДЕРЖКА ПОСЛЕ ВЫПУСКА — ТОЛЬКО ДЛЯ ЧУЖИХ (решение владельца 22.10.2026).
    # Умолчание площадки — три дня: свежий чужой выпуск мог оказаться сломанным
    # или вредным, и выдержка даёт ему проявиться. Своя семья (`ArtVsMark/*` —
    # каталог правил и механизмы) из неё изъята: её выпуск мы выпускаем сами, и
    # три дня ожидания только задерживали бы подъём, который перехват и так
    # проводит изменением через весь конвейер. Замер 22.10.2026: v2.1.0
    # каталога вышла в 08:08Z, заход Dependabot в 08:19Z написал «Days since
    # release : 0 (cooldown days 3)» и подъёма не предложил.
    cooldown:
      default-days: 3
      exclude:
        - "ArtVsMark/*"
    open-pull-requests-limit: 10
