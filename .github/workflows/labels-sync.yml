# Метки репозитория из `.github/labels.yml`.
#
# Правило 064: метка — вход механизма, а не украшение. Значит её состав живёт
# файлом в дереве и применяется прогоном, а не заводится в интерфейсе.
#
# Токен нужен обычный: метка не несёт личности человека, и правила 131 и 135
# здесь ни при чём.
name: labels-sync

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - "scripts/sync_labels.py"
      - ".github/workflows/labels-sync.yml"
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  # Голова названа в группе, а не только имя прогона (правило 179): иначе
  # последнее слово останется за прогоном на устаревшем коммите.
  group: labels-sync-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: поставить разбор состава
        # Версия закреплена с верхней границей (правило 073): без неё
        # несовместимая версия применяется молча.
        run: python -m pip install --quiet "pyyaml>=6,<7"

      - name: применить объявленный состав
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          # `-e` приходит из умолчания площадки — она зовёт `bash -e {0}`, и
          # `set -uo pipefail` его НЕ снимает. Без `|| rc=$?` оболочка умирает
          # на ненулевом коде раньше, чем `rc` присвоится: три объявленных
          # исхода превращаются в два, и находка для человека краснеет как
          # поломка.
          rc=0
          python scripts/sync_labels.py || rc=$?

          # Исход 2 — механизм не отработал: нет токена, площадка отказала,
          # состав не разбирается. Только это красное.
          if [ "$rc" -eq 2 ]; then exit 1; fi

          # Исход 1 — находка для человека: в репозитории есть метки, которых
          # файл не объявляет. Синхронизатор их не удаляет намеренно — снятие
          # метки трогает все задачи разом.
          if [ "$rc" -eq 1 ]; then
            echo "::warning::В репозитории есть метки, которых .github/labels.yml не объявляет. Либо вписать их с причиной, либо снять в репозитории — смотрите вывод шага."
          fi
          exit 0
