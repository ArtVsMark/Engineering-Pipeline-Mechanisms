# ПЕРЕИСПОЛЬЗУЕМЫЙ ПРОГОН: шаг конвейера, который зовут, а не запускают.
#
# Тело переехало из `ci.yml` ЦЕЛИКОМ и без правок — менялся адрес, а не
# поведение: иначе перевод и починку нельзя было бы отличить друг от друга.
#
# ОТДАЁТСЯ НАРУЖУ: потребитель зовёт этот файл адресом с версией, к которой он
# прибит (157), а не копией у себя. Копия — ровно та беда, из-за которой этап 4
# и заведён: замер по пяти проектам нашёл десять повторяющихся имён прогонов, и
# ни одна пара копий не совпала.
#
# ИМЯ ЗАПИСИ ПРОВЕРКИ У ВЫЗВАННОГО ДЖОБА СОСТАВНОЕ — «<имя вызывающего> / <имя
# вызванного>». Замер прогоном на живой площадке (изменение #549), а не по
# документации: из окна она недоступна (139).
#
# ДУБЛЬ ЭТОЙ ШАПКИ НАМЕРЕННЫЙ, И ЭТО СКАЗАНО, А НЕ УМОЛЧАНО (071). Площадка
# требует от переиспользуемого прогона ОТДЕЛЬНОГО ФАЙЛА: вынести пояснение в
# общее место нечем — комментарий не подключается, а сам прогон зовут по адресу
# файла. Цена названа: правка пояснения идёт по всем файлам разом, и расходятся
# они молча. Держит их от расхождения не внимание, а прогон
# `tests/test_reusable_steps.py`.
name: step-pr-meta

on:
  workflow_call:

# Потолок прав: большего шаг не получит, даже если вызывающий даст больше.
permissions:
  contents: read
  checks: read
  pull-requests: read
  issues: read

jobs:
  pr-meta:
    name: pr-meta
    # На общей ветке шаг не идёт: предмет — разметка изменения, а не общей ветки.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "pyyaml>=6,<7" ./packages/transport
      - name: тронутые файлы
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE"
          base_sha="$(git merge-base "origin/$BASE" HEAD)"
          # `-z` обязателен: без него git экранирует имена с пробелами и
          # не-ASCII, и такой путь молча выпадает из отбора зон (165). Список
          # передаётся ФАЙЛОМ, а не подстановкой: оболочка вырезает NUL.
          git diff --name-only -z "$base_sha...HEAD" > /tmp/changed.txt
          echo "тронуто файлов: $(tr -cd '\0' < /tmp/changed.txt | wc -c)"
      - name: метки и связь с задачей
        # ТОКЕН ЗДЕСЬ НЕ УКРАШЕНИЕ. Гейт перечитывает состояние изменения у
        # площадки, потому что снимок события — это состояние на момент
        # срабатывания: метки проставляет шаг открытия долями секунды позже, и
        # на снимке их нет. Без токена перечитать нечем, и гейт молча
        # возвращается к снимку — то есть выносит вердикт по прошлому (049).
        # Замер 09.09: изменение #55 отвергнуто за «тронуты файлы зон, которых
        # нет на изменении», когда все четыре зоны на нём уже стояли.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/check_pr_meta.py --files-from /tmp/changed.txt
