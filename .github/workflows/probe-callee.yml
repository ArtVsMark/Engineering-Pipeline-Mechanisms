# ЗАМЕР, А НЕ ШАГ КОНВЕЙЕРА. Этот прогон существует ровно для одного вопроса:
# как площадка НАЗЫВАЕТ запись проверки у джоба, вызванного через
# `workflow_call`. От ответа зависит, можно ли переводить шаги конвейера на
# переиспользуемые прогоны, не переименовав при этом все наши проверки и не
# сломав защиту ветки — тот самый класс, которым у соседа по семье перестало
# мержиться всё (168).
#
# Документация площадки из окна недоступна: прокси закрывает docs.github.com.
# Поэтому ответ берётся прогоном, а не памятью (139).
#
# ИЗМЕНЕНИЕ С ЭТИМИ ФАЙЛАМИ НЕ СЛИВАЕТСЯ. На нём стоит стоп-метка `hold`,
# и снимается оно после чтения имён.
name: probe-callee

on:
  workflow_call:

permissions:
  contents: read

jobs:
  inner:
    name: inner
    runs-on: ubuntu-latest
    steps:
      - name: сказать своё имя
        run: echo "джоб вызванного прогона отработал"
