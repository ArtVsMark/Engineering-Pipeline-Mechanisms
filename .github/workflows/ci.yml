# Гейты изменения: шаги 2–7 скелета (docs/pipeline.md).
#
# ОДИН ШАГ — ОДИН ДЖОБ. Не шаг внутри джоба: контекст проверки носит имя
# джоба, и по красному контексту должно быть видно, что сломалось, без
# открытия лога. У соседей 57 и 36 шагов сидят в одном джобе с именем вроде
# `catalogue`, и причину иначе как из лога не узнать.
#
# СВОДНЫЙ ГЕЙТ СОБРАН ОПРОСОМ, А НЕ ЧЕРЕЗ `needs` (правило 168). Агрегатор на
# зависимостях при падении соседа не краснеет, а ПРОПУСКАЕТСЯ, — а пропущенную
# запись защита ветки засчитывает за пройденную (187). В норме он зелёный и
# ничего не решает, в аварии — разрешает слияние ровно тогда, когда обязан
# запретить. Поэтому `ci-complete` ни от кого не зависит и сам спрашивает у
# площадки проверки на голове.
#
# В ЗАЩИТЕ ВЕТКИ РОВНО ОДНО ИМЯ — `ci-complete`. Список, перечисляющий
# матрицу, ломается при добавлении версии. Совпадение имени с настройкой
# держит scripts/check_required_context.py: настройка живёт вне дерева, её не
# видит ни ревью, ни прогон.
#
# ИЗВЕСТНАЯ ЦЕНА, НАЗВАННАЯ, А НЕ ОБОЙДЁННАЯ (046). Договор требует, чтобы
# гейты разметки перезапускались от навешивания метки, а тяжёлые — нет. Здесь
# все шаги в одном прогоне, как и велит таблица договора, поэтому метка
# перезапускает и тесты. Разделение шага по прогонам — предмет выноса
# механизмов наружу (#2), а не молчаливая правка договора на ходу.
name: ci

on:
  # ОБЩАЯ ВЕТКА ПРОВЕРЯЕТСЯ ТОЖЕ. Два изменения, зелёных по отдельности, после
  # слияния дают красное — и до этой строки узнать об этом было неоткуда: на
  # `main` не шло ни одной проверки, кроме публикации фактов. Контур 2 договора
  # («красная общая ветка») не мог сработать: краснеть было нечему, а источник 0
  # порядка работ остался без сигнала.
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` обязательны: разметка — вход механизма, и её правка
    # обязана менять вердикт гейта. `edited` — потому что связь с задачей живёт
    # в теле изменения.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read
  # Живая задача-адресат находок читается шагом `debt`; писать в неё он не умеет.
  issues: read

concurrency:
  # Группа называет ГОЛОВУ, а не только номер изменения (правило 179): иначе
  # последнее слово остаётся за прогоном на устаревшем коммите.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: поставить проверки
        # Верхние границы обязательны (правило 073): без них несовместимая
        # версия применяется молча.
        run: python -m pip install --quiet "ruff>=0.6,<1" "mypy>=1.11,<2" "pyyaml>=6,<7"
      - name: линтер
        run: ruff check scripts/ tests/
      - name: формат
        run: ruff format --check scripts/ tests/
      - name: типы
        run: mypy scripts/ tests/

  # МАТРИЦА ВЕРСИЙ ДЕРЖИТ ОБЕЩАНИЕ, А НЕ ПОВТОРЯЕТ ПРОГОН. `pyproject.toml`
  # объявляет `requires-python = ">=3.12"` — то есть проект утверждает, что
  # работает и на 3.13, и на 3.14. Пока проверялась одна 3.12, это утверждение
  # держалось ничем: синтаксис, убранный в следующей версии, нашёл бы не набор,
  # а сосед (002).
  #
  # ЯЧЕЙКА НЕ ЯВЛЯЕТСЯ ОБЯЗАТЕЛЬНЫМ ИМЕНЕМ, И ЭТО НЕ МЕЛОЧЬ. Имя контекста у
  # матричного джоба несёт версию: `test-matrix (3.13)`. Объяви такое имя
  # обязательным — и добавление версии в матрицу меняет договор молча, а
  # удаление оставляет защиту ветки требовать несуществующий контекст. Поэтому
  # обязательное имя выдаёт АГРЕГАТ `test`, а матрица остаётся совещательной:
  # её вердикт доезжает до него через `needs`.
  test-matrix:
    name: test-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Одна упавшая версия не отменяет остальных: узнать надо про все, а не
      # про первую попавшуюся.
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Тесты гейтов ходят по истории — нужна вся.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: поставить проверки
        run: python -m pip install --quiet "pytest>=8,<10" "pyyaml>=6,<7"
      - name: тесты
        # Прогон без единого теста — ошибка входа, а не «чисто» (075). Ключ
        # ниже делает пустой сбор красным, а не зелёным.
        run: pytest --strict-markers -p no:cacheprovider

  # АГРЕГАТ, А НЕ ВТОРОЙ ПРОГОН ТЕСТОВ. Он ничего не проверяет сам — он несёт
  # ОДНО имя, которое можно объявить обязательным, и краснеет ровно тогда, когда
  # красна хотя бы одна обязательная версия. `always()` обязателен: без него
  # пропуск матрицы сделал бы агрегат пропущенным, а пропущенный обязательный
  # контекст защита ветки засчитывает за пройденный (040).
  test:
    name: test
    needs: test-matrix
    # `always()` обязателен: без него КРАСНАЯ матрица делала бы агрегат
    # пропущенным, а пропущенный обязательный контекст защита ветки
    # засчитывает за пройденный (040).
    #
    # ОТМЕНА — НЕ ОТКАЗ, И ЭТО ИСКЛЮЧЕНИЕ НАЗВАНО. Погашенный группой отмены
    # прогон отменяет матрицу, но агрегат при `always()` остаётся жив и честно
    # краснеет — оставляя на голове красную запись МЁРТВОГО прогона. Пока
    # новый прогон не дойдёт до агрегата (а он ждёт всю матрицу), очередь
    # видит эту запись и считает изменение красным. Замер 10.09.2026: #105
    # получил метку источника 2 при идущих зелёных проверках.
    #
    # Вердикта у отменённого прогона нет, и выдавать за вердикт нечего.
    if: always() && needs.test-matrix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: вердикт матрицы
        run: |
          set -euo pipefail
          result="${{ needs.test-matrix.result }}"
          echo "матрица обязательных версий: $result"
          # Список РАЗРЕШЁННОГО (068): зелёным считается только `success`.
          # Пропуск и отмена пройденными не считаются — у них просто нет
          # вердикта, и выдавать его отсутствие за успех значит зеленеть на
          # том, чего не было.
          [ "$result" = "success" ]

  # ПРЕДРЕЛИЗНАЯ ВЕРСИЯ — СОВЕЩАТЕЛЬНЫЙ КАНАЛ, И ЭТО ОБЪЯВЛЕНО ДАННЫМИ.
  # Её красное слияния не держит: обещания работать на невышедшей версии проект
  # не давал. Но и теряться оно не должно — на общей ветке его записывает шаг 9
  # в источник 3, перед правилами и планом. Починка такого бывает величиной с
  # переезд проекта на другую версию языка.
  #
  # Версии может ещё не быть у площадки вовсе — тогда красное означает именно
  # это, и разбирается оно так же: причина видна в логе шага, а не додумывается.
  test-next:
    name: test-next
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: поставить проверки
        run: python -m pip install --quiet "pytest>=8,<10" "pyyaml>=6,<7"
      - name: тесты на предрелизной
        run: pytest --strict-markers -p no:cacheprovider

  pr-meta:
    name: pr-meta
    # На общей ветке шаг не идёт: предмет — разметка изменения, а не общей ветки.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "pyyaml>=6,<7"
      - name: тронутые файлы
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE"
          base_sha="$(git merge-base "origin/$BASE" HEAD)"
          # `-z` обязателен: без него git экранирует имена с пробелами и
          # не-ASCII, и такой путь молча выпадает из отбора зон (165). Список
          # передаётся ФАЙЛОМ, а не подстановкой: оболочка вырезает NUL.
          git diff --name-only -z "$base_sha...HEAD" > /tmp/changed.txt
          echo "тронуто файлов: $(tr -cd '\0' < /tmp/changed.txt | wc -c)"
      - name: метки и связь с задачей
        # ТОКЕН ЗДЕСЬ НЕ УКРАШЕНИЕ. Гейт перечитывает состояние изменения у
        # площадки, потому что снимок события — это состояние на момент
        # срабатывания: метки проставляет шаг открытия долями секунды позже, и
        # на снимке их нет. Без токена перечитать нечем, и гейт молча
        # возвращается к снимку — то есть выносит вердикт по прошлому (049).
        # Замер 09.09: изменение #55 отвергнуто за «тронуты файлы зон, которых
        # нет на изменении», когда все четыре зоны на нём уже стояли.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/check_pr_meta.py --files-from /tmp/changed.txt

  journal:
    name: journal
    # На общей ветке шаг не идёт: предмет — фрагмент, приехавший с изменением.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # БАЗА ПОДТЯГИВАЕТСЯ ОТДЕЛЬНЫМ ШАГОМ, а не внутри блока проверки. Свой
      # прогон перед толчком берёт команды блоками целиком и блок с `git fetch`
      # запустить не может: локально это не проверка, а правка чужого дерева.
      # Пока фетч жил внутри, гейт журнала был виден только площадке — и ловил
      # то, что видно на дереве, уже после толчка.
      - name: подтянуть базу
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "$base:refs/remotes/origin/$base"
      - name: фрагмент журнала
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python scripts/check_journal.py
      # Собранный журнал здесь НЕ сверяется: он собирается при выпуске (030).
      # Общий файл, который трогает каждая ветка, даёт конфликт на каждом
      # втором изменении — ровно тот инцидент, из-за которого правило и есть.
      - name: фрагменты журнала разбираются
        env:
          # База нужна: шаг разбирает то, что принесло ИЗМЕНЕНИЕ, а не всё
          # состояние каталога. Иначе он валится третьим исходом сразу после
          # выпуска, когда фрагменты уехали в `released/` и каталог пуст.
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python scripts/build_changelog.py --fragments
      - name: версия не правлена руками
        run: python scripts/check_version.py
      # Полнота истории — предмет прогона, а не проверок. Две проверки версии
      # идут по живому дереву и на обрезанном чекауте пропускаются (у них там
      # нет предмета); чтобы пропуск не стал молчаливой дырой, здесь стоит
      # гейт: тегов не пришло — третий исход вслух (045).
      - name: история пришла целиком
        run: python scripts/version.py --check
      # СВОЁ ИМЯ БЕРЁТСЯ У ПЛОЩАДКИ, А НЕ ИЗ ПАМЯТИ ДЕРЕВА (172). Токен нужен:
      # переименованное ловится ответом площадки, а не сравнением имён — старое
      # имя не похоже на новое, и площадка держит по нему редирект.
      - name: имена репозиториев не устарели
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_own_name.py
      # Ссылками на правила проект обосновывает решения, и битая ссылка
      # обесценивает довод: проверить его нельзя. Имена берутся у каталога, а
      # не из памяти — по памяти их и написали 29 раз.
      - name: ссылки на правила разрешаются
        run: python scripts/check_rule_links.py
      # Решение пересматривают НОВОЙ записью, а не правкой старой: переписанное
      # задним числом решение выдаёт сегодняшний выбор за вчерашний, и следа от
      # этого не остаётся. Предмет — что ИЗМЕНЕНИЕ делает с принятой записью,
      # поэтому прошлое гейт не судит: его правкой изменения не починить (051).
      - name: принятое решение не переписано задним числом
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python scripts/check_decisions_edit.py
      # Ссылка на производное — значок, картинку, отчёт — не уезжает в общую
      # ветку раньше, чем прогон его нарисовал. Проверкой «файл есть в дереве»
      # это не лечится: производного в дереве и не должно быть, — спрашивается
      # площадка.
      - name: ссылка на производное не раньше самого производного
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python scripts/check_derived_refs.py

  attribution:
    name: attribution
    # На общей ветке шаг не идёт: предмет — коммиты изменения относительно базы.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Гейт не переписан здесь: каталог отдаёт его действием, и подключение
      # идёт ссылкой на версию, а не копией (правило 090). Копия разъехалась бы
      # с оригиналом на первой же правке — и разъехались бы при этом гейты.
      - name: сверить атрибуцию
        uses: ArtVsMark/Engineering-Incidents-Playbook/.github/actions/attribution@v1.2.0
        with:
          authors: .github/authors.txt
          # Отметка, с которой атрибуция обязательна. Решение и отвергнутые
          # варианты — docs/decisions/001-attribution-of-merged-1.md.
          #
          # Отпечаток ЦЕЛИКОМ, а не короткий: короткий однажды перестаёт быть
          # однозначным, и отметка тогда указывает не туда. Соседний прогон
          # `attribution-history.yml` требует того же от своей отметки, а здесь
          # семь знаков жили с первого дня — одно правило, два прочтения (090).
          # Нашёл внешний взгляд на #147.
          baseline: cb26ec48dd6a53c0b47af7dd0ec7cda2e07a748b
          require-declared-author: "true"
          require-coauthor: "true"
          range: origin/${{ github.event.pull_request.base.ref || 'main' }}..HEAD
          catalogue-ref: v1.2.0

  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "pyyaml>=6,<7"
      - name: ответ по классам проверок полон и сходится с деревом
        run: python scripts/check_pipeline.py

  debt:
    # СОВЕЩАТЕЛЬНЫЙ ШАГ, А НЕ ГЕЙТ. Долг бывает больше одного изменения, и
    # красное здесь стало бы проверкой, которую приучаются обходить (051).
    # Его дело — не пускать долг в невидимое: находки и неотвеченные правила
    # идут перед планом, и это должно быть видно, а не вспоминаться.
    name: debt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Счёт по пунктам спрашивает, КОГДА имя появилось в истории. В мелком
          # клоне она обрезана до одного коммита, и все файлы выглядят
          # добавленными в нём — признак срабатывал бы на каждом названном.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Шаг читает краснотy общей ветки через `main_red`, а тот — ответ по
      # классам проверок, и разбирает его YAML. Без этой строки шаг падал бы
      # на импорте, ДО входа в скрипт: свой третий исход выдать он не мог бы,
      # и прогон читал бы сбой как отказ механизма.
      - name: поставить разбор состава
        run: python -m pip install --quiet "pyyaml>=6,<7"
      - name: остаток долга — находки и неотвеченные правила
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Коды разбираются списком РАЗРЕШЁННОГО (068): объявленные исходы — 0
          # и 3, всё прочее отказ. Третий здесь означает «часть источников не
          # прочитана», и он не зеленит шаг молча.
          set +e
          python scripts/debt.py
          code=$?
          set -e
          case "$code" in
            0) ;;
            3) echo "::warning::часть источников долга не прочитана — см. вывод шага" ;;
            *) exit "$code" ;;
          esac

  # ГЛАВНЫЙ ГЕЙТ СВЯЗИ С ПОТРЕБИТЕЛЕМ (#15). Имена джобов уезжают в чужую
  # защиту ветки ДОСЛОВНО и вне дерева, входы кнопки — в чужие вызовы, классы
  # проверок — в чужой ответ. Правка этого, прошедшая молча, ломает потребителя,
  # и узнаётся об этом от него, а не отсюда.
  #
  # На общей ветке шаг не идёт: предмет — что ИЗМЕНЕНИЕ делает с поверхностью
  # относительно базы, а на `main` сравнивать не с чем.
  contract:
    name: contract
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Снимок «до» берётся из дерева базы целиком: поверхность собирается
          # из всех прогонов разом, и по одному файлу её не восстановить.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "pyyaml>=6,<7"
      - name: поверхность контракта не тронута молча
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "$base:refs/remotes/origin/$base"
          python scripts/check_contract.py

  ci-complete:
    # ЕДИНСТВЕННЫЙ ОБЯЗАТЕЛЬНЫЙ КОНТЕКСТ. Имя джоба и есть имя контекста,
    # поэтому `name:` совпадает с идентификатором намеренно: расхождение между
    # ними оставило бы в защите имя, которого никто не выдаёт.
    #
    # На общей ветке шаг не идёт: он сводит вердикт по изменению, а на `main`
    # сводить нечего.
    if: github.event_name != 'push'
    name: ci-complete
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `needs` здесь НЕТ намеренно — см. шапку файла и правило 168.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "pyyaml>=6,<7"
      - name: опросить проверки на голове
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # НАПОЛНЕНИЕ ОПРОСА ПРИХОДИТ ИЗ ДАННЫХ, А НЕ ИЗ ЭТОГО ФАЙЛА. Класс
        # каждой проверки объявлен в `.pipeline.yml`: обязательная держит
        # слияние, совещательная нет. Список именами здесь означал бы, что
        # класс проверки — свойство механизма, а он свойство проекта (174).
        run: |
          python scripts/ci_complete.py \
            --policy .pipeline.yml \
            --self-name "ci-complete"
