# Гейты изменения: шаги 2–7 скелета (docs/use/pipeline.md).
#
# ОДИН ШАГ — ОДИН ДЖОБ. Не шаг внутри джоба: контекст проверки носит имя
# джоба, и по красному контексту должно быть видно, что сломалось, без
# открытия лога. У соседей 57 и 36 шагов сидят в одном джобе с именем вроде
# `catalogue`, и причину иначе как из лога не узнать.
#
# СВОДНОГО ГЕЙТА ЗДЕСЬ НЕТ: он уехал в `.github/workflows/ci-complete.yml`.
# Причина переезда — группа отмены: она гасит ВЕСЬ прогон целиком, и вместе с
# ним гас сводный гейт, оставляя на голове `cancelled` там, где защита ветки
# ждёт вердикт. Устройство самого гейта (опрос вместо `needs`, правила 168 и
# 187) описано в том файле — здесь остаётся только адрес, чтобы читатель `ci`
# не искал джоб, которого в нём нет.
#
# В ЗАЩИТЕ ВЕТКИ РОВНО ОДНО ИМЯ — `ci-complete`, и оно выдаётся ТЕМ файлом.
# Список, перечисляющий матрицу, ломался бы при добавлении версии. Совпадение
# имени с настройкой держит scripts/check_required_context.py: настройка живёт
# вне дерева, её не видит ни ревью, ни прогон.
#
# ИЗВЕСТНАЯ ЦЕНА, НАЗВАННАЯ, А НЕ ОБОЙДЁННАЯ (046). Договор требует, чтобы
# гейты разметки перезапускались от навешивания метки, а тяжёлые — нет. Здесь
# все шаги в одном прогоне, как и велит таблица договора, поэтому метка
# перезапускает и тесты. Разделение шага по прогонам — предмет выноса
# механизмов наружу (#2), а не молчаливая правка договора на ходу.
name: ci

on:
  # ОБЩАЯ ВЕТКА ПРОВЕРЯЕТСЯ ТОЖЕ. Два изменения, зелёных по отдельности, после
  # слияния дают красное — и до этой строки узнать об этом было неоткуда: на
  # `main` не шло ни одной проверки, кроме публикации фактов. Контур 2 договора
  # («красная общая ветка») не мог сработать: краснеть было нечему, а источник 0
  # порядка работ остался без сигнала.
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` обязательны: разметка — вход механизма, и её правка
    # обязана менять вердикт гейта. `edited` — потому что связь с задачей живёт
    # в теле изменения.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read
  # Живая задача-адресат находок читается шагом `debt`; писать в неё он не умеет.
  issues: read

concurrency:
  # Группа называет ГОЛОВУ, а не только номер изменения (правило 179): иначе
  # последнее слово остаётся за прогоном на устаревшем коммите.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    uses: ./.github/workflows/step-lint.yml
    permissions:
      contents: read
      checks: read
      pull-requests: read
      issues: read


  # МАТРИЦА ВЕРСИЙ ДЕРЖИТ ОБЕЩАНИЕ, А НЕ ПОВТОРЯЕТ ПРОГОН. `pyproject.toml`
  # объявляет `requires-python`, и каждая версия, на которой проект обещает
  # работать, стоит здесь ячейкой. Число планки здесь не повторяется: его
  # источник — `requires-python`. С ним сверяет `tests/test_declared_versions.py`:
  # одиночные шаги — равенством планке, матрицу — по нижней ячейке, которая
  # обязана планке равняться (#1038). Ячейки — все стабильные ветки, которые
  # проект обещает (их перечень — сама матрица ниже, здесь он не повторяется:
  # пересказ отставал, 005); предрелизная проверяется отдельным
  # прогоном `python-next.yml` (#1018), а не здесь. Пока обещание не проверялось ничем,
  # синтаксис, убранный в следующей версии, нашёл бы не набор, а сосед (002).
  #
  # ЯЧЕЙКА НЕ ЯВЛЯЕТСЯ ОБЯЗАТЕЛЬНЫМ ИМЕНЕМ, И ЭТО НЕ МЕЛОЧЬ. Имя контекста у
  # матричного джоба несёт версию: `test-matrix (3.N)`. Объяви такое имя
  # обязательным — и добавление версии в матрицу меняет договор молча, а
  # удаление оставляет защиту ветки требовать несуществующий контекст. Поэтому
  # обязательное имя выдаёт АГРЕГАТ `test`, а матрица остаётся совещательной:
  # её вердикт доезжает до него через `needs`.
  # ПРЕДЕЛ — ОТ ДЛИНЫ НАБОРА С ЗАПАСОМ, А НЕ ОТ ЛУЧШЕГО ПРОГОНА (100). На
  # одном дереве ячейка 3.14 шла 5:36 (#1691) и не уложилась в 10:00 на 99%
  # набора (#1692): раннер медленнее вдвое — предел обязан это пережить.
  # Зависание ловит и 15, а медленный прогон больше не красит `main`.
  test-matrix:
    name: test-matrix
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      # Ячеек две — обе стабильные ветки: 3.15.0 вышла 09.10.2026 (PEP 790,
      # раздел «Actual»; дрейф #193 заметил её 12.10), и `fail-fast: false`
      # говорит про обе, а не про первую упавшую.
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Тесты гейтов ходят по истории — нужна вся.
          fetch-depth: 0
      # ВЕРСИЯ — ВЫРАЖЕНИЕМ МАТРИЦЫ, ОДНИМ ШАГОМ. Действие каталога
      # `project-badge` с v2.1.0 раскрывает `${{ matrix.python }}` в ячейки
      # `strategy.matrix.python` (каталог #926, #928); до того оно читало только
      # число буквой, и 3.15 стояла на значке «проектом не проверяется» (#1527) —
      # здесь стоял шаг на ячейку. Форму держит
      # `tests/test_declared_versions.py::test_a_matrix_job_sets_its_version_from_the_matrix`.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: поставить проверки
        run: python -m pip install --quiet "pytest>=8,<10" "pyyaml>=6,<7" "pytest-randomly>=3,<4" "ruff>=0.6,<1" ./packages/transport
      - name: тесты
        # Прогон без единого теста — ошибка входа, а не «чисто» (075). Ключ
        # ниже делает пустой сбор красным, а не зелёным. ИСКЛЮЧЕНИЕ НАЗВАНО:
        # пустой ВЫБОР на изменении — не пустой сбор, а вердикт классификатора
        # «судить нечего»; pytest тогда не зовётся вовсе, и шаг говорит это
        # словами (#1599). Пустой сбор при непустом выборе — по-прежнему красный.
        #
        # ПОРЯДОК СБОРА СЛУЧАЕН, А ЗЕРНО — НОМЕР ПРОГОНА. Связанность тестов
        # ловится только другим порядком, и прежде набор ходил единственным,
        # прямым: связанность нашлась бы снова замером руками (пункт 2.3 #243).
        # Зерно берётся у номера прогона, а не у часов: логи прогонов из части
        # окон не читаются вовсе, и напечатанное в них зерно пропало бы вместе с
        # логом. Номер прогона виден в его адресе — то есть порядок
        # воспроизводим снаружи (139).
        #
        # НА ИЗМЕНЕНИИ — ТЕСТЫ ПО ЗАДЕТОМУ (#1598, эпик #1596). Классификатор
        # `scope.py` выводит граф из кода и называет тест-файлы, которые изменение
        # задело; на общей ветке набор полный всегда — он ловит, что выбор
        # пропустил. Отказ классификатора — полный набор, а не «судить нечего»:
        # ошибка в сторону «больше» стоит минут, в сторону «меньше» — красного.
        # База — `origin/<база>` из полной истории checkout (`fetch-depth: 0`).
        env:
          RANDOM_SEED: ${{ github.run_id }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          # Метка `scope/*` шире ответа классификатора расширяет выбор (#1599).
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          # Повторный толчок судится от последней зелёной головы (#1602): её
          # спрашивают у площадки по номеру изменения, токеном прогона на чтение.
          # Токен — только вызову классификатора, не тестам (взгляд на #1605):
          # тест, читающий токен без подмены, в CI и у окна вёл бы себя по-разному.
          # ПРЕДЕЛ НАЗВАН (046): это развязка от случайности, а не от головы.
          # `scope.py` берётся из изменения и мог бы передать токен тестам через
          # файл; держит это только право токена — на чтение.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_token="${GH_TOKEN:-}"
          unset GH_TOKEN
          selected=()
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            rc=0
            said="$(GH_TOKEN="$pr_token" python scripts/scope.py --tests --labels "${PR_LABELS:-}" --pr "${PR_NUMBER:-0}")" || rc=$?
            if [ "$rc" != 0 ]; then
              echo "::warning::выбор тестов не отработал (код $rc) — гоним полный набор вместо выбора по задетому"
            elif [ -z "$said" ]; then
              echo "судить нечего: изменение не задело ни одного теста"
              exit 0
            elif [ "$said" != "ALL" ]; then
              mapfile -t selected <<<"$said"
            fi
            GH_TOKEN="$pr_token" python scripts/scope.py --labels "${PR_LABELS:-}" --pr "${PR_NUMBER:-0}" || true
          fi
          # ПОЛНЫЙ ПРОГОН ОБЩЕЙ ВЕТКИ НАЗЫВАЕТ, ЧТО ВЫБОР ПРОПУСТИЛ (#1598). Слитое
          # изменение гнало выбор, общая ветка — весь набор; упавший тест вне
          # выбора — находка о графе, а не мигание. Исход прогона прежний: красен
          # pytest, а `--missed` только говорит, почему изменение было зелёным.
          report=()
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            report=("--junitxml=${RUNNER_TEMP:-/tmp}/tests.xml")
          fi
          rc=0
          pytest --strict-markers -p no:cacheprovider ${RANDOM_SEED:+--randomly-seed=$RANDOM_SEED} ${report[@]+"${report[@]}"} ${selected[@]+"${selected[@]}"} || rc=$?
          if [ "$rc" != 0 ] && [ "${#report[@]}" -gt 0 ]; then
            python scripts/scope.py --base HEAD^ --missed "${RUNNER_TEMP:-/tmp}/tests.xml" || true
          fi
          exit "$rc"

  # АГРЕГАТ, А НЕ ВТОРОЙ ПРОГОН ТЕСТОВ. Он ничего не проверяет сам — он несёт
  # ОДНО имя, которое можно объявить обязательным, и краснеет ровно тогда, когда
  # красна хотя бы одна обязательная версия. `always()` обязателен: без него
  # пропуск матрицы сделал бы агрегат пропущенным, а пропущенный обязательный
  # контекст защита ветки засчитывает за пройденный (040).
  test:
    name: test
    needs: test-matrix
    # `always()` обязателен: без него КРАСНАЯ матрица делала бы агрегат
    # пропущенным, а пропущенный обязательный контекст защита ветки
    # засчитывает за пройденный (040).
    #
    # ОТМЕНА — НЕ ОТКАЗ, И ЭТО ИСКЛЮЧЕНИЕ НАЗВАНО. Погашенный группой отмены
    # прогон отменяет матрицу, но агрегат при `always()` остаётся жив и честно
    # краснеет — оставляя на голове красную запись МЁРТВОГО прогона. Пока
    # новый прогон не дойдёт до агрегата (а он ждёт всю матрицу), очередь
    # видит эту запись и считает изменение красным. Замер 10.09.2026: #105
    # получил метку источника 2 при идущих зелёных проверках.
    #
    # Вердикта у отменённого прогона нет, и выдавать за вердикт нечего.
    if: always() && needs.test-matrix.result != 'cancelled'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: вердикт матрицы
        run: |
          set -euo pipefail
          result="${{ needs.test-matrix.result }}"
          echo "матрица обязательных версий: $result"
          # Список РАЗРЕШЁННОГО (068): зелёным считается только `success`.
          # Пропуск и отмена пройденными не считаются — у них просто нет
          # вердикта, и выдавать его отсутствие за успех значит зеленеть на
          # том, чего не было.
          [ "$result" = "success" ]

  # ИЗМЕНЕНИЕ ИЗ НЕСКОЛЬКИХ ЧАСТЕЙ — ПРЕДУПРЕЖДЕНИЕ, А НЕ КРАСНОЕ (133, #860).
  # Граница изменения задаётся пересечением файлов. Красный гейт отвергнут
  # замером: из 25 слитых распались 6, и решение 008 разрешает хвост мелких
  # правок одним изменением. Но от сигнала не отказывались (051): число частей
  # видно на каждом изменении, а решение остаётся за автором. Свой джоб, а не
  # шаг общего `step-*.yml`: наружу граница изменения не отдана — общий шаг
  # берёт код конвейера своим checkout (#990), а этот джоб в него не вынесен.
  parts:
    name: parts
    # Только на изменении: у ручного прогона нет базы (`pull_request.base.ref`
    # пуст), и счёт давал бы ложное «не сосчитаны».
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Счёт частей зовёт git общим вызовом `gitcall`, а тот режет вывод
      # `report.cut` из пакета транспорта: без установки шаг падал бы импортом.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet ./packages/transport
      - name: на сколько частей распадается изменение
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail
          git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE"
          rc=0
          python3 scripts/change_parts.py --base "origin/$BASE" --warn || rc=$?
          case "$rc" in
            0|3) ;;
            *) echo "::warning::части изменения не сосчитаны (код $rc) — граница по 133 не проверена" ;;
          esac

  # СВЕРКА ФАКТОВ С ВЫПУСКОМ ВИТРИНЫ ПРОВЕРЯЕТСЯ ДО СЛИЯНИЯ (#1380). Шаг
  # `step-facts.yml` исполняет чужой `check_facts.py` по тегу и хешу, а набор
  # гоняет его только на подделках: тестам сеть нельзя. Здесь шаг исполняется
  # настоящим — на годных фактах и с одним расхождением, — и мёртвая сверка
  # или устаревший хеш краснят изменение, а не публикацию на `main`. Идёт
  # только когда тронут шаг или сборка фактов: сеть на каждое изменение
  # не оплачивается. Свой джоб, а не шаг общего `step-*.yml`: потребитель шаг
  # фактов зовёт по тегу, и сверять его выпуск — дело поставщика.
  #
  # НА ОБЩЕЙ ВЕТКЕ НЕ ИДЁТ, как и прочие джобы, читающие изменение: базы
  # там нет. На ручном прогоне базы тоже нет — шаг это называет, а не сверяет.
  facts-contract:
    name: facts-contract
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet ./packages/transport "pyyaml>=6,<7"
      - name: сверка фактов с выпуском витрины жива
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail
          if [ -z "$BASE" ]; then
            echo "не изменение — базы нет, сверка проверяется на изменениях"
            exit 0
          fi
          git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE"
          rc=0
          python scripts/check_facts_contract.py --base "origin/$BASE" || rc=$?
          case "$rc" in
            0) ;;
            # ВЫПУСК ВИТРИНЫ НЕ ОТВЕТИЛ — отказ канала, а не находка о дереве:
            # не красит, но и не молчит (084, 045).
            4) echo "::warning::Выпуск витрины не скачан — сверка фактов не проверена. Это отказ канала; если повторяется, смотреть выпуск витрины." ;;
            *) exit "$rc" ;;
          esac

  # ФОРМУ ОТВЕТА КАТАЛОГУ ПРОВЕРЯЕТ ТОТ, КТО ЕЁ ЗАДАЁТ (129, #1274). Каталог
  # отдаёт проверку действием, и подключение идёт ссылкой на версию, а не
  # копией (090): своя копия разъехалась бы с формой на первом же подъёме
  # контракта. Действие же прогоняет по дереву пробы `refuted_by` ответов «не
  # применимо» — находка значит, что предмет в дереве появился и ответ надо
  # перечитать. Почему тег, а не SHA, — в `step-attribution.yml`. Свой джоб,
  # а не шаг общего `step-*.yml`: потребитель зовёт действие каталога сам, и
  # передавать его через нас незачем.
  answer:
    name: answer
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ответ каталогу по форме и пробы «не применимо»
        uses: ArtVsMark/Engineering-Incidents-Playbook/.github/actions/answer@v2.2.0

  pr-meta:
    name: pr-meta
    if: github.event_name != 'push'
    uses: ./.github/workflows/step-pr-meta.yml
    permissions:
      contents: read
      checks: read
      pull-requests: read
      issues: read


  journal:
    name: journal
    if: github.event_name != 'push'
    uses: ./.github/workflows/step-journal.yml
    permissions:
      contents: read
      checks: read
      pull-requests: read
      issues: read


  attribution:
    name: attribution
    if: github.event_name != 'push'
    uses: ./.github/workflows/step-attribution.yml
    with:
      # Отметка, с которой атрибуция обязательна. Решение и отвергнутые
      # варианты — docs/decisions/001-attribution-of-merged-1.md.
      #
      # Отпечаток ЦЕЛИКОМ, а не короткий: короткий однажды перестаёт быть
      # однозначным, и отметка тогда указывает не туда. Соседний прогон
      # `attribution-history.yml` требует того же от своей отметки, а здесь
      # семь знаков жили с первого дня — одно правило, два прочтения (090).
      # Нашёл внешний взгляд на #147.
      baseline: cb26ec48dd6a53c0b47af7dd0ec7cda2e07a748b
    permissions:
      contents: read
      checks: read
      pull-requests: read
      issues: read


  pipeline:
    name: pipeline
    uses: ./.github/workflows/step-pipeline.yml
    # У себя мета-гейты строгие и видят все источники: `paths.SOURCES` и хуки окна.
    with:
      mechanism-paths: scripts packages/transport .claude/hooks
      mechanism-gates-enforce: true
    permissions:
      contents: read
      checks: read
      pull-requests: read
      issues: read


  # ПЕРВЫЙ ШАГ, ВЫНЕСЕННЫЙ В ПЕРЕИСПОЛЬЗУЕМЫЙ ПРОГОН (этап 4, #547). Тело
  # шага уехало в `step-debt.yml` целиком и без правок; здесь остался ВЫЗОВ.
  # Потребитель напишет ровно такую же строку — только адресом с версией, а не
  # локальным `./`.
  #
  # ИМЯ ПРОВЕРКИ ОТ ЭТОГО МЕНЯЕТСЯ, И ЭТО ЗАМЕРЕНО, А НЕ ДОПУЩЕНО: площадка
  # называет запись «<имя вызывающего> / <имя вызванного>» (замер прогоном,
  # изменение #549). Здесь оба — `debt`, поэтому запись зовётся «debt / debt»,
  # и ровно так она названа в `.pipeline.yml`.
  debt:
    name: debt
    uses: ./.github/workflows/step-debt.yml
    permissions:
      contents: read
      issues: read

  contract:
    name: contract
    if: github.event_name != 'push'
    uses: ./.github/workflows/step-contract.yml
    permissions:
      contents: read
      checks: read
      pull-requests: read
      issues: read


  window-lifetime:
    name: window-lifetime
    if: github.event_name != 'push'
    uses: ./.github/workflows/step-window-lifetime.yml
    permissions:
      contents: read
      checks: read
      pull-requests: read
      issues: read


  rulebook-fresh:
    name: rulebook-fresh
    if: github.event_name != 'push'
    uses: ./.github/workflows/step-rulebook-fresh.yml
    permissions:
      contents: read
      checks: read
      pull-requests: read
      issues: read

