# Шаг 1 скелета: изменение из ветки агентского окна открывает КОНВЕЙЕР, а не
# окно.
#
# Правило 131: операция, несущая личность человека, из агентского окна не
# выполняется — прокси подменяет учётные данные на записи, и автором в общей
# ветке становится приложение. Цена того, что шага не было, записана в
# docs/decisions/001-attribution-of-merged-1.md: изменения #1 и #6 открыты
# приложением, первое слито уплотнением, и подпись задним числом не переписать.
#
# ИМЯ ВЕТКИ ЗДЕСЬ — ПЕРЕКЛЮЧАТЕЛЬ (003), и приставка ОДНА: `agent/**` — общая
# договорённость семьи. Вторая, `claude/**`, стояла здесь как переходная
# заглушка: облачному окну имя ветки назначает платформа, и своих веток оно не
# резало. Заглушка снята, когда новый путь подтверждён прогонами (139), а не
# когда был написан: слой совместимости, оставленный «на время», превращает
# один канонический путь в два и живёт дольше самой миграции
# (094 — https://github.com/ArtVsMark/Engineering-Incidents-Playbook/blob/main/rules/ru/094-a-compatibility-shim-makes-migration-permanent.md).
#
# ТОКЕН — ВЛАДЕЛЬЦА. На github.token шаг не переходит молча: это дало бы ту же
# подмену авторства.
#
# ИМЯ СЕКРЕТА ВЗЯТО У СОСЕДЕЙ. В грейдере и каталоге тот же токен зовётся
# MERGE_QUEUE_TOKEN, и третье имя для одного предмета — ровно тот разнобой,
# ради которого заведён этот проект: человек между проектами не переучивается
# (162). Именем секрета шаг станет параметризовать, когда механизм поедет
# наружу (#15).
#
# У ТОКЕНА ЕСТЬ СРОК. Истёкший даёт не «не настроено», а отказ площадки, и
# скрипт называет это отдельно (#16): иначе «PR перестали открываться» пойдут
# искать в скрипте, а искать надо в сроке секрета.
name: agent-pr

on:
  push:
    branches:
      - "agent/**"
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Голова названа в группе (179): иначе последнее слово останется за прогоном
  # на устаревшем коммите, и он откроет второе изменение.
  group: agent-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Заголовок и тело собираются из коммитов ветки — нужна история.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Шаг читает состав меток, а тот разбирает YAML. Без этой строки шаг
      # падал на импорте — ДО входа в скрипт, поэтому свой третий исход он
      # выдать не мог, и прогон читал сбой как «секрет не задан».
      - name: поставить разбор состава
        run: python -m pip install --quiet "pyyaml>=6,<7"

      - name: открыть изменение от лица владельца
        env:
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          # `-e` приходит из умолчания площадки и без `|| rc=$?` убил бы
          # оболочку раньше разбора кода: три исхода стали бы двумя.
          rc=0
          python scripts/agent_pr.py || rc=$?

          # Коды разбираются СПИСКОМ РАЗРЕШЁННОГО (068): зелёными считаются
          # только объявленные, всё прочее — отказ. Обратный порядок уже стоил
          # зелёного прогона на сломанном шаге: ImportError отдал единицу,
          # которая тогда значила «не настроено».
          case "$rc" in
            0) ;;
            3)
              # Ненастроенная возможность, а не поломка изменения (051): без
              # секрета краснела бы каждая ветка ни за что.
              echo "::warning::MERGE_QUEUE_TOKEN не задан — изменение не открыто. Нужен токен владельца с правами contents:write и pull-requests:write; иначе изменение открывается руками, и автором станет тот, кто открыл."
              ;;
            *)
              echo "::error::Шаг открытия изменения не отработал (код $rc) — смотрите вывод выше."
              exit 1
              ;;
          esac
          exit 0
