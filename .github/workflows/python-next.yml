# Предрелизная версия языка — отдельным прогоном, а не джобом внутри `ci`.
#
# ЗАЧЕМ ОТДЕЛЬНЫЙ ФАЙЛ (решение владельца 01.10.2026, #1018). Значок
# `workflow/status` показывает исход ВСЕГО прогона. Джоб 3.15 внутри `ci.yml`
# шёл без `continue-on-error`, и его красное красило значок `ci` целиком: два
# ответа — «цела ли общая ветка» и «заработает ли на следующей версии» —
# сливались в один цвет, хотя слияния предрелизная не держит. Здесь исход прогона и есть второй ответ,
# отдельно от первого: красное честное, без `continue-on-error`.
#
# ЗЕЛЁНОЕ — ДВА ИСХОДА, И ЭТО НАЗВАНО (взгляд на #1329, `42c9dda`). С
# 14.10.2026 зелёный значок значит либо «тесты на ветке прошли», либо «сборки
# ветки под раннер у площадки ещё нет, тесты не шли» — второе различает только
# предупреждение в прогоне. Витрина и факты (`python.experimental`) называют
# ветку из матрицы — ту, на которой проект ПРОБУЕТ работать, а не ту, на
# которой тесты уже прошли. Разделить два зелёных значок `workflow/status` не
# умеет: исход у прогона один.
#
# НА ИЗМЕНЕНИИ НЕ ПРОСЫПАЕТСЯ. Обещания работать на невышедшей версии проект не
# давал, и необязательный канал слияния не держит (084). Толчок в общую ветку,
# раз в неделю и кнопка — этого хватает, чтобы узнать о несовместимости до
# выпуска языка, а не после.
#
# КРАСНОЕ НЕ ТЕРЯЕТСЯ. Слияния оно не держит, но на общей ветке его
# записывает дежурный (`scripts/main_red.py`) в источник 3 плана: завершение
# этого прогона его будит (`main-red.yml`). Версии может ещё не быть у
# площадки вовсе — это не красное, а названный исход: прогон зелёный с
# предупреждением, тесты не идут (решение владельца 14.10.2026, #193; шаг
# «есть ли сборка ветки у площадки» ниже).
#
# ИМЯ ДЖОБА ПРЕЖНЕЕ — `test-next`, и это не забывчивость. Запись проверки
# по-прежнему `test-next (<версия>)`: её знают ответ по классам (`.pipeline.yml`),
# список перезапуска (`.rules/rerun.json`) и дежурный (`job_of`). Сменилось
# место, а не имя: переименование тронуло бы трёх читателей ради украшения.
name: python-next

on:
  push:
    branches: [main]
  schedule:
    # Раз в неделю, в понедельник: предрелиз меняется медленно, а каждый заход
    # платит общей квотой (058).
    - cron: "37 5 * * 1"
  # У события всегда есть ручная кнопка: события теряются (104).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Голова в имени группы: заход на свежем коммите не должен гаситься заходом
  # на устаревшем (179).
  group: python-next-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test-next:
    name: test-next
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # МАТРИЦА ИЗ ОДНОЙ ВЕРСИИ — РАДИ ИМЕНИ. Площадка приписывает значения
    # матрицы к имени джоба: запись называется `test-next (3.16)`, и по списку
    # проверок видно, НА ЧЁМ прогнали (046). Дрейф (`scripts/drift.py`,
    # `declared_versions`) и факты витрины (`scripts/build_facts.py`,
    # `python_facts`) читают версию из матрицы.
    strategy:
      # Ячейка одна, но `fail-fast` объявлен: добавят вторую предрелизную ветку —
      # и узнать надо про обе, а не про первую упавшую.
      fail-fast: false
      matrix:
        python: ["3.16"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # СБОРКИ ВЕТКИ У ПЛОЩАДКИ МОЖЕТ ЕЩЁ НЕ БЫТЬ — ЭТО ИСХОД, А НЕ КРАСНОЕ
      # (решение владельца 14.10.2026, #193). Ветку сюда наводят раньше, чем
      # выходит её первая альфа: так было с 3.16 после выхода 3.15, и
      # `setup-python` отказывал. Дежурный клал красное долгом в план, и долг
      # загораживал работу до выхода альфы. Теперь манифест спрашивается
      # заранее — тем же разбором, что у дрейфа (`drift.py --published`), на
      # стабильной ветке, — и при отсутствии сборки тесты не идут, а прогон
      # зелёный с предупреждением. Нечитаемый манифест — красное: это отказ
      # канала, а не «версии нет» (045).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: есть ли сборка ветки у площадки
        id: version
        env:
          WANTED: ${{ matrix.python }}
          # Манифест токена не просит, но `drift.py` ходит к площадке общим
          # транспортом, и шаг без токена гейт отвергает (`test_steps_get_their_token`).
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python -m pip install --quiet "pyyaml>=6,<7" ./packages/transport
          rc=0
          # Сборка — файл под систему раннера, а не номер (`b1aea69`): версия
          # системы берётся у самого раннера, а не второй записью `runs-on`.
          system="$(. /etc/os-release && echo "${VERSION_ID:-}")"
          # Пустая версия молча отключила бы сверку системы (взгляд на #1333):
          # не прочитали — шаг не отработал, а не «сверять не надо» (045).
          if [ -z "$system" ]; then
            echo "::error::версия системы раннера не прочитана из /etc/os-release — сборку сверить не с чем"
            exit 1
          fi
          python scripts/drift.py --published "$WANTED" --platform-version "$system" || rc=$?
          case "$rc" in
            0) echo "present=true" >>"$GITHUB_OUTPUT" ;;
            4)
              echo "present=false" >>"$GITHUB_OUTPUT"
              echo "::warning::Сборки ${WANTED} под ${system} у площадки ещё нет — тесты на ней не шли; прогон зелёный и говорит именно это."
              ;;
            *) exit 1 ;;
          esac
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.version.outputs.present == 'true'
        with:
          # ЧИСЛО БУКВОЙ, А НЕ `${{ matrix.python }}` — ради единого значка
          # семьи. Действие каталога `project-badge` (его верхняя строка —
          # расчёт `python-badge`) находит предрелизную версию по
          # `python-version: "X.Y"` рядом с `allow-prereleases: true`, а
          # выражение матрицы не читает: с ним 3.15 с значка пропадала (решение
          # владельца 03.10.2026). Число здесь — копия ячейки матрицы выше, и
          # расходиться им не даёт `tests/test_declared_versions.py`
          # (`test_a_preview_step_names_its_matrix_cell`), а не внимание (071).
          python-version: "3.16"
          # Без него setup-python предрелиз не ставит.
          allow-prereleases: true
      - name: поставить проверки
        if: steps.version.outputs.present == 'true'
        run: python -m pip install --quiet "pytest>=8,<10" "pyyaml>=6,<7" "pytest-randomly>=3,<4" ./packages/transport
      - name: тесты на предрелизной
        if: steps.version.outputs.present == 'true'
        env:
          RANDOM_SEED: ${{ github.run_id }}
        run: |
          set -euo pipefail
          pytest --strict-markers -p no:cacheprovider ${RANDOM_SEED:+--randomly-seed=$RANDOM_SEED}
