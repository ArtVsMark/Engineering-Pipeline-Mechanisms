# Дрейф: внешний вход сдвинулся, а дерево не менялось.
#
# ЧТО ЭТОТ ПРОГОН ДЕЛАЕТ, ЧЕГО НЕ ДЕЛАЕТ НИ ОДИН ДРУГОЙ. Проверки на изменении
# смотрят дерево и диф — и этого хватает, пока красное приходит от НАШЕЙ
# правки. Часть входов лежит снаружи: каталог правил движется, его выгрузка
# меняет схему, сводка семьи стареет, действие выпускает новую версию. Такое
# расхождение не приходит красным никогда — не потому, что его нет, а потому,
# что никто не спрашивает.
#
# ПОЧЕМУ НЕ «ВСЕ ГЕЙТЫ ПО РАСПИСАНИЮ». Гейт, читающий только дерево,
# детерминирован: заход по расписанию даст тот же ответ, что и час назад. Это
# холостая работа — замер соседа, из-за которого очередь двигает только голову:
# 21 холостой прогон против 12 полезных. Здесь спрашивается ровно то, чей вход
# СНАРУЖИ, и каждая проверка называет, откуда её вход.
#
# ПОЧЕМУ СОВЕЩАТЕЛЬНЫЙ. Дрейф — источник работы, а не здоровье общей ветки:
# каталог, выпустивший новое правило, ничего у нас не сломал. Держать слияние
# за движение соседа значило бы заморозить работу по чужому расписанию (084).
# Критичное станет обязательным поимённо и ВНУТРИ сводного гейта, а не новым
# именем в защите ветки: каждое лишнее имя там однажды даёт вечное ожидание.
#
# АДРЕСАТ У ЗАПИСИ ЕСТЬ, И ОН ПЕРЕЖИВАЕТ ЗАХОД (142). Красное по расписанию без
# адресата — шум, который учат пролистывать. Записи идут в живую задачу тем же
# механизмом, что и находки внешнего взгляда.
name: drift

on:
  schedule:
    # После ночного прогона входящих (6:17): его результат — один из входов
    # этого захода, и спрашивать раньше значило бы читать вчерашнее.
    - cron: "43 7 * * *"
  # У события всегда есть ручная кнопка: события теряются (104).
  workflow_dispatch:

permissions:
  contents: read
  # Записи дрейфа живут в задаче: адресат обязан пережить заход.
  issues: write
  # Предупреждения площадки лежат в аннотациях проверок головы общей ветки:
  # без этого права источник «предупреждения площадки» слеп (#665).
  checks: read

concurrency:
  # Голова здесь не нужна: предмет — состояние внешних источников, а не
  # коммит; последний заход обязан быть последним словом (179).
  group: drift
  cancel-in-progress: true

jobs:
  # ТОНКИЙ ВЫЗОВ (#993): заход — общим шагом `step-drift.yml`, здесь только то,
  # что решает проект, — когда спрашивать и один ли заход. Код конвейера шаг
  # берёт своим checkout на коммите вызова (#990), поэтому потребитель зовёт
  # его адресом с тегом, а не копирует.
  drift:
    uses: ./.github/workflows/step-drift.yml
    # СЕКРЕТ ПЕРЕДАЁТСЯ ПО ИМЕНИ, А НЕ `secrets: inherit` (108): шаг получает
    # ровно тот секрет, которым работает, — и внутри шага его получает один
    # запрос настроек слияния, а не весь заход.
    # УСЛОВИЕ НА ВЕТКУ — ОТ СЛУЧАЙНОГО НАЖАТИЯ, А НЕ ОТ ПИШУЩЕГО. Кнопка
    # принимает любую ветку и исполняет её код; с условием кнопка на ветке
    # `agent/*` секрета не выдаст, и источник промолчит третьим исходом —
    # вслух, а не «сошлось» (поздний взгляд на #972). Но файл прогона берётся
    # с той же ветки, и ветка может снять условие у себя (взгляд на #974).
    # Держать это по-настоящему могло бы только `environment:` с ограничением
    # веток; решение владельца 30.09.2026 — не заводить его: у кого есть
    # запись, тот и так прочтёт любой секрет своим прогоном. Тот же принятый
    # риск у каждого прогона с кнопкой и этим секретом, и условия у них нет:
    # `git grep -l MERGE_QUEUE_TOKEN .github/workflows/`.
    secrets:
      MERGE_QUEUE_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.MERGE_QUEUE_TOKEN || '' }}
