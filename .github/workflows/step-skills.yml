# ПЕРЕИСПОЛЬЗУЕМЫЙ ПРОГОН: общий шаг, который зовут, а не запускают.
#
# Тело переехало из прогона, который его исполнял, ЦЕЛИКОМ — у шагов конвейера
# из `ci.yml`, у управляющих механизмов из их собственного прогона, — и при
# переезде менялся адрес, а не поведение: иначе перевод и починку нельзя было
# бы отличить друг от друга. Код конвейера шаг с тех пор берёт своим checkout
# (#990) — это сказано в его блоке кода, а не здесь.
#
# ОТДАЁТСЯ НАРУЖУ: потребитель зовёт этот файл адресом с версией, к которой он
# прибит (157), а не копией у себя. Почему копия — беда, с замером копий по
# проектам семьи, — в договоре, docs/use/pipeline.md (022).
#
# ИМЯ ЗАПИСИ ПРОВЕРКИ У ВЫЗВАННОГО ДЖОБА СОСТАВНОЕ — «<имя вызывающего> / <имя
# вызванного>». Замер прогоном на живой площадке (изменение #549), а не по
# документации: из окна она недоступна (139).
#
# ДУБЛЬ ЭТОЙ ШАПКИ НАМЕРЕННЫЙ, И ЭТО СКАЗАНО, А НЕ УМОЛЧАНО (071). Площадка
# требует от переиспользуемого прогона ОТДЕЛЬНОГО ФАЙЛА: вынести пояснение в
# общее место нечем — комментарий не подключается, а сам прогон зовут по адресу
# файла. Цена названа: правка пояснения идёт по всем файлам разом, и расходятся
# они молча. Держит их от расхождения не внимание, а прогон
# `tests/test_reusable_steps.py`.
name: step-skills

on:
  workflow_call:
    inputs:
      # ВХОД ТОЛЬКО ДЛЯ ПРОБЫ ПЕРЕНОСА (#990) — то же имя, что у всех шагов.
      strip-ours:
        description: проба переноса — стереть наш код из дерева вызывающего
        type: boolean
        default: false
      commit:
        description: слитый коммит общей ветки, о котором запись; пусто — голова прогона
        type: string
        default: ""
      digest:
        description: свести недельный ряд в задачу-аналитику вместо записи
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# Сырые записи применения навыков и их недельная сводка — общий шаг (#1694).
#
# ЗАПИСЬ НА СЛИТОЕ ИЗМЕНЕНИЕ (`record`): какие навыки изменение ждало — по
# признакам в шапке каждого `SKILL.md` дерева ВЫЗЫВАЮЩЕГО (признаки едут с
# навыками), — и какие названы строкой `Навык:` тела слитого коммита. Запись
# дописывается в `.github/badges/skills.json` ветки `badges` ВЫЗЫВАЮЩЕГО: факты о
# проекте публикует сам проект (174). Совещательный канал: не дописалась —
# предупреждение, слияние уже состоялось (084).
#
# СВОДКА РАЗ В НЕДЕЛЮ (`digest`): записи свои и соседей по семье — в блок одной
# живой задачи-аналитики; ниже блока — вопросы человека, их механизм не трогает.
#
# Права объявляет вызывающий; здесь — потолок: запись толкает ветку `badges`
# (`contents: write`), сводка пишет задачу (`issues: write`).
#
# СПЕРВА СПРОСИЛИ СЕМЬЮ (162) — 26.10.2026, чтением прогонов соседей и
# каталога, без запуска: записи о применении навыков на слитое изменение нет ни
# у кого. У соседа Glossary-Python навык зовёт прогон проверки карточек, у
# каталога прогон сверяет форму навыков — о вызове навыка окном не спрашивает
# ни один. Строим своё; хранение взято у нашего же архива находок на `badges`.
jobs:
  # ОДИН ДЖОБ — ДВА ЗАХОДА ВХОДОМ `digest` (#1694): тело вызова у общего шага
  # одно (`pipeline_checks.resolved_job`), поэтому запись и сводка — шагами
  # одного джоба с условием, а не двумя джобами.
  skills:
    name: skills
    runs-on: ubuntu-26.04
    # Предел выше бюджета попыток толчка (`skill_record.BUDGET`, 20 мин) на
    # выкладку и установку (100): толчок с повтором не обрывается пределом
    # джоба. Сводка — до 25 вызовов площадки (`.rules/schedules.json`) с
    # дедлайном транспорта 30 с каждый: худший случай 12,5 мин — тоже внутри.
    timeout-minutes: 25
    steps:
      # Глубина — полная: запись читает уплотнённый коммит и его родителя, а
      # толчок на `badges` выбирает ветку поверх. Учётные данные нужны толчку.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # запись толкает ветку badges (skill_record.py)
          fetch-depth: 0
      # КОД КОНВЕЙЕРА — СВОИМ CHECKOUT, А НЕ ИЗ ДЕРЕВА ВЫЗЫВАЮЩЕГО (#990). У
      # потребителя нашего `scripts/` нет: дерево вызывающего — ЕГО, и в нём
      # только данные. Репозиторий и коммит — того файла, который позвали
      # (`job.workflow_repository`, `job.workflow_sha`), поэтому прибивка
      # вызова к тегу прибивает и код, а адрес поставщика буквами не пишется.
      # Замер прогоном 01.10.2026 (#997): `github.job_workflow_sha` у
      # вызванного шага пуст, `job.workflow_sha` — коммит вызванного файла.
      # Пустой коммит не подменяется веткой по умолчанию молча (045).
      # ДУБЛЬ ЭТОГО БЛОКА НАМЕРЕННЫЙ (071): площадка не подключает шаги внутрь
      # шага, и блок стоит в каждом общем шаге, зовущем наш код. Совпадение
      # блоков держит `tests/test_reusable_steps.py::test_the_code_block_is_one_in_every_step`.
      - name: коммит и репозиторий вызова названы
        env:
          AT: ${{ job.workflow_sha }}
          FROM: ${{ job.workflow_repository }}
        run: |
          if [ -z "$AT" ]; then
            echo "::error::коммит вызова шага не назван — код конвейера не взят (045)"
            exit 1
          fi
          # Пустой репозиторий checkout молча заменил бы деревом вызывающего.
          if [ -z "$FROM" ]; then
            echo "::error::репозиторий вызова шага не назван — checkout взял бы дерево вызывающего (045)"
            exit 1
          fi
      - name: код конвейера — на коммите вызова
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-mechanisms
          persist-credentials: false
      # Из рабочего дерева код уносится: обходы по дереву потребителя видят
      # только его файлы, а не наши.
      - name: унести код конвейера из дерева потребителя
        env:
          STRIP_OURS: ${{ inputs.strip-ours }}
          FROM: ${{ job.workflow_repository }}
          CALLER: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          mv .pipeline-mechanisms "$RUNNER_TEMP/mechanisms"
          # ПРОБА ПЕРЕНОСА (#990, решение владельца 04.10.2026): со входом
          # `strip-ours` дерево вызывающего лишается нашего кода, и шаг обязан
          # завестись тем, что взял своим checkout. СТИРАЕТСЯ ПО ИМЕНАМ ПАПОК,
          # и у соседа под ними лежит его собственный код. Поэтому стирание
          # идёт, только когда вызывающий прогон — проба передачи
          # `handover-probe.yml` (ответ `ours`: у потребителя её нет) и шаг взят
          # из того же репозитория. Сверки репозиториев одной мало: копию шага
          # у потребителя (`uses: ./…`) площадка тоже считает «своей»
          # (взгляды на #1113, #1118). Форк поставщика с той же пробой — его
          # законный случай: у форка под этими папками наш же код.
          if [ "$STRIP_OURS" = "true" ]; then
            case "$CALLER" in
              */.github/workflows/handover-probe.yml@*) ;;
              *)
                echo "::error::Вход strip-ours — только для пробы передачи handover-probe.yml; здесь зовёт ${CALLER}, и стирать своё нельзя"
                exit 1
                ;;
            esac
            if [ "${GITHUB_REPOSITORY,,}" != "${FROM,,}" ]; then
              echo "::error::Вход strip-ours — только для пробы в репозитории поставщика ${FROM}; здесь ${GITHUB_REPOSITORY}, и стирать нечего своего"
              exit 1
            fi
            rm -rf scripts packages tests
          fi
          echo "MECHANISMS=$RUNNER_TEMP/mechanisms" >>"$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: поставить общий низ
        run: python -m pip install --quiet "pyyaml>=6,<7" $MECHANISMS/packages/transport
      # Коммит — окружением, а не подстановкой в текст команды (085); пусто —
      # голова прогона. Не дописалось — предупреждение с кодом: канал
      # необязательный, а слияние уже состоялось (084, 045).
      - name: дописать запись о слитом изменении
        if: ${{ !inputs.digest }}
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -uo pipefail
          rc=0
          python $MECHANISMS/scripts/skill_record.py --commit "${COMMIT:-$GITHUB_SHA}" \
            --root . --workdir "$RUNNER_TEMP/skills" || rc=$?
          case "$rc" in
            0) ;;
            *) echo "::warning::запись применения навыков не дописана (код $rc) — ряд без этого изменения" ;;
          esac

      # СВОДКА СЕМЬИ БЕРЁТСЯ У КАТАЛОГА, А НЕ СОБИРАЕТСЯ ЗАНОВО — тем же адресом,
      # что у прогона значков. Не скачалась — сводка только своя, и это сказано.
      - name: взять сводку семьи у каталога
        if: ${{ inputs.digest }}
        continue-on-error: true
        run: |
          set -uo pipefail
          curl -sSfL -o "$RUNNER_TEMP/where.json" \
            https://raw.githubusercontent.com/ArtVsMark/Engineering-Incidents-Playbook/badges/export/where.json \
            || echo "::warning::Сводка семьи не скачалась — записи соседей в сводку навыков не войдут."
      - name: свести ряд навыков в задачу-аналитику
        if: ${{ inputs.digest }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          summary=()
          if [ -s "$RUNNER_TEMP/where.json" ]; then summary=(--summary "$RUNNER_TEMP/where.json"); fi
          rc=0
          python $MECHANISMS/scripts/skill_digest.py --repo "$GITHUB_REPOSITORY" --apply \
            ${summary[@]+"${summary[@]}"} || rc=$?
          case "$rc" in
            0) ;;
            *) echo "::warning::сводка применения навыков не записана (код $rc) — записи на ветке badges на месте" ;;
          esac
