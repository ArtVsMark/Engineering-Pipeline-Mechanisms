# ПЕРЕИСПОЛЬЗУЕМЫЙ ПРОГОН: шаг конвейера, который зовут, а не запускают.
#
# Тело переехало из `ci.yml` ЦЕЛИКОМ и без правок — менялся адрес, а не
# поведение: иначе перевод и починку нельзя было бы отличить друг от друга.
#
# ОТДАЁТСЯ НАРУЖУ: потребитель зовёт этот файл адресом с версией, к которой он
# прибит (157), а не копией у себя. Копия — ровно та беда, из-за которой этап 4
# и заведён: замер по пяти проектам нашёл десять повторяющихся имён прогонов, и
# ни одна пара копий не совпала.
#
# ИМЯ ЗАПИСИ ПРОВЕРКИ У ВЫЗВАННОГО ДЖОБА СОСТАВНОЕ — «<имя вызывающего> / <имя
# вызванного>». Замер прогоном на живой площадке (изменение #549), а не по
# документации: из окна она недоступна (139).
#
# ДУБЛЬ ЭТОЙ ШАПКИ НАМЕРЕННЫЙ, И ЭТО СКАЗАНО, А НЕ УМОЛЧАНО (071). Площадка
# требует от переиспользуемого прогона ОТДЕЛЬНОГО ФАЙЛА: вынести пояснение в
# общее место нечем — комментарий не подключается, а сам прогон зовут по адресу
# файла. Цена названа: правка пояснения идёт по всем файлам разом, и расходятся
# они молча. Держит их от расхождения не внимание, а прогон
# `tests/test_reusable_steps.py`.
name: step-window-lifetime

on:
  workflow_call:

# Потолок прав: большего шаг не получит, даже если вызывающий даст больше.
permissions:
  contents: read
  checks: read
  pull-requests: read
  issues: read

jobs:
  # СРОК ЖИЗНИ ОКНА — ВЕЛИЧИНА, А НЕ ПАМЯТЬ ЧЕЛОВЕКА. Правило 006 держалось у
  # нас документом, и причиной стоял замер, утверждавший, что следа окна в дереве
  # нет вовсе. Дерево этого не подтверждает: трейлер `Claude-Session` несёт номер
  # окна, и срок его жизни из истории читается. Разбор — находка `51a6454` (#23).
  #
  # ШАГ НЕ РЕШАЕТ ЗА ЧЕЛОВЕКА. Свод говорит прямо: срок держится строкой и
  # решает его человек. Поэтому проверка называет величину, а не отменяет работу,
  # и класс её в `.pipeline.yml` — `unreviewed`: слияния она не держит. Сделать
  # её обязательной значило бы гнать окно чинить неисправимое — красное, которое
  # правкой изменения не чинится, идёт источником 2 (051).
  #
  # На общей ветке шаг не идёт: предмет — коммиты ИЗМЕНЕНИЯ относительно базы.
  window-lifetime:
    name: window-lifetime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Начало окна лежит в истории общей ветки, а не в ветке изменения. В
          # мелком клоне шаг не зеленеет, а объявляет, что считать не из чего:
          # обрезка неотличима от начала окна (045).
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: срок жизни окна, открывшего изменение
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base="${GITHUB_BASE_REF:-main}"
          # Ветку базы приносит `fetch-depth: 0` выше — тем же приёмом, что у
          # шага атрибуции, и дотягивать её здесь нечем. Блок, который тянет
          # базу сам, целиком считается требующим площадки: свой прогон
          # перестал бы его спрашивать, и проверка ловила бы уже после толчка.
          python scripts/check_window_lifetime.py --base "origin/$base" --history "origin/$base"
