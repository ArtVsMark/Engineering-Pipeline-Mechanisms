# Шаг 17.9 эпика: ряд прогонов — как конвейер работает на самом деле.
#
# ПОЧЕМУ РЯД, А НЕ СНИМОК. Записи проверок живут, пока живёт изменение, а логи
# прогонов из части окон не читаются вовсе. Интересное же видно только в ряду:
# доля погашенных заходов, имя, которое чаще краснеет, движение времени прогона.
# Ни один заход этого не показывает.
#
# РЯД ЖИВЁТ В СВОЕЙ ВЕТКЕ-СИРОТЕ `runs`, А НЕ В ВЕТКЕ ЗНАЧКОВ. Ветка значков
# перезаписывается ЦЕЛИКОМ, и накопление в ней держалось бы на чтении
# опубликованного файла по сети: одна осечка чтения — и ряд молча обрывается.
# Здесь наоборот, накопитель — сама история ветки. Разбор и отвергнутые
# варианты: docs/decisions/022-the-series-of-runs-lives-in-its-own-branch.md.
#
# ПРОИЗВОДНОЕ НЕ КОММИТИТСЯ В ОБЩУЮ ВЕТКУ (правило 125) — по той же причине, что
# факты и значок.
name: runs-series

on:
  schedule:
    # Раз в сутки: строка ряда — сутки, и второй заход в тот же день пересчитал
    # бы то же самое. Цена и роль объявлены в .rules/schedules.json.
    - cron: "5 4 * * *"
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:

permissions:
  # Запись нужна ровно на толчок в производную ветку — как у шага значков.
  contents: write

concurrency:
  # Два захода сразу писали бы один файл: последний обязан быть последним словом.
  group: runs-series
  cancel-in-progress: false

jobs:
  runs-series:
    name: runs-series
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Общий низ конвейера ставится пакетом (024). Разбор YAML нужен потому,
      # что состав служебных шагов свод выводит ИЗ ДЕРЕВА прогонов, а не помнит
      # списком (#634): без него шаг упал бы на импорте, ДО входа в механизм.
      - run: python -m pip install --quiet "pyyaml>=6,<7" ./packages/transport
      # ПРЕЖНИЙ РЯД БЕРЁТСЯ ИЗ ВЕТКИ, А НЕ ПО ССЫЛКЕ RAW: накопитель — история,
      # и клон её приносит целиком. Ряд мелкий — текстовый файл и день на строку.
      #
      # «ВЕТКИ ЕЩЁ НЕТ» И «СЕТЬ НЕ ОТВЕТИЛА» РАЗВОДЯТСЯ, А НЕ СЛИВАЮТСЯ В ОДНО.
      # Первое — начало ряда, второе — отказ захода: продолжить после него значило
      # бы опубликовать ряд из одного дня вместо накопленного (045). `--exit-code`
      # у `ls-remote` отвечает двойкой именно на «такой ветки нет».
      - name: взять прежний ряд
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          store="${RUNNER_TEMP}/series"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          mkdir -p "$store"
          cd "$store"
          git init -q -b runs
          git remote add origin "$remote"
          # СТАТУС, КОТОРЫЙ ЧИТАЮТ, ОБЯЗАН БЫТЬ ПОЙМАН СТРАХОВКОЙ `||`.
          # Площадка запускает блок через `bash -e`, и `set -uo pipefail` этого
          # не отменяет: `--exit-code` вернул 2, оболочка оборвала шаг ДО `case`,
          # и разбор «ветки ещё нет» не исполнился ни разу. Замер 16.09.2026: у
          # ряда прогонов один заход за всю жизнь, и он упал кодом 2 — то есть
          # накопитель не собрал ни одного дня, а пункт 13.1 ждал точек, которые
          # не могли появиться (045).
          asked=0
          git ls-remote --exit-code --heads origin runs >/dev/null 2>&1 || asked=$?
          case "$asked" in
            0)
              git -c protocol.version=2 fetch -q origin runs
              git checkout -q -B runs FETCH_HEAD
              echo "прежний ряд взят из ветки runs"
              ;;
            2)
              echo "::notice::Ветки runs ещё нет — этот заход начинает ряд."
              ;;
            *)
              echo "::error::Ветка runs не спрошена — это отказ сети, а не начало ряда."
              exit 1
              ;;
          esac

      - name: свести день и обновить ряд
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/runs_series.py \
            --store "${RUNNER_TEMP}/series/runs.json" \
            --report "${RUNNER_TEMP}/series/runs.md" \
            --apply

      - name: опубликовать ряд
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/series"
          # Производное собирает машина, и подписывать его человеком было бы
          # ложью: автор здесь — прогон.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Нечего коммитить — законный исход: заход мог пересчитать тот же день
          # и получить те же числа. Пустой коммит был бы шумом в накопителе.
          if git diff --cached --quiet; then
            echo "ряд не изменился — публиковать нечего"
            exit 0
          fi
          git commit -q -m "ряд прогонов на $(date -u +%F)"
          git push -q origin HEAD:runs
          echo "опубликовано: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/runs/runs.md"
