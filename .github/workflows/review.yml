# Шаг 12 скелета: внешний взгляд на изменение.
#
# ЭТО ДРУГОЙ ИСПОЛНИТЕЛЬ, А НЕ ВТОРАЯ ПОПЫТКА. Второй проход тем же окном даёт
# те же слепые пятна: ревью ведёт отдельный прогон, а не то окно, что писало
# изменение.
#
# ТРИГГЕР НАМЕРЕННО `pull_request`, А НЕ `pull_request_target`. Второй
# исполняется в контексте ОБЩЕЙ ветки и отдаёт секреты прогону, запущенному по
# коду постороннего автора. На изменении из форка секрета нет по построению, и
# это осознанное ограничение, а не поломка: форк ревьюит человек — руками или
# обращением (claude.yml).
#
# Форма собрана из двух соседей, и что откуда взято — docs/decisions/002.
name: review
# ИМЯ ЗАПУСКА ВЕРИФИКАТОРА — «verify <отпечаток>» (#1005). По нему заход
# `scripts/verify_queue.py` узнаёт, на какую находку верификатор уже звался:
# вход прогона площадка в списке запусков не отдаёт (049). Суточный потолок
# по имени не считается — в него идёт каждый ручной запуск (#1121). Прочие
# запуски зовутся как прежде: заголовком изменения, иначе именем прогона.
run-name: ${{ inputs.mark && format('verify {0}', inputs.mark) || github.event.pull_request.title || github.workflow }}

on:
  # ОБХОД ИДЁТ САМ, А НЕ ЖДЁТ РУКИ. Реестр непросмотренного ведёт очередь, и
  # тыкать кнопку по одному номеру — ручная работа, которую механизм умеет
  # делать. Кнопка остаётся: у события всегда есть ручной путь (104).
  schedule:
    # После ночного прогона входящих и дрейфа: реестр к этому часу уже свежий.
    - cron: "11 8 * * *"
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # УБОРКА РЕЕСТРА ИДЁТ ПО СЛИЯНИЮ, А НЕ ПОПУТНО С ЧУЖИМ РАЗБОРОМ. Снятие
  # находки объявляется строкой `Разобрано:` в теле слитого изменения — значит
  # и момент уборки задаёт слияние. Пока она шла только внутри разбора нового
  # изменения, опустевшая очередь означала, что разобранное висит в реестре
  # НАВСЕГДА: убрать его было некому. Приёмка «реестр пуст и держится сутки»
  # при этом недостижима по устройству.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # У события всегда есть ручная кнопка: события теряются (правило 104). У этой
  # кнопки теперь есть ПРЕДМЕТ — номер уже слитого изменения. Без него кнопка
  # смотрела в текущую ветку и повторно посмотреть слитое ею было нечем.
  workflow_dispatch:
    inputs:
      pr:
        description: "номер СЛИТОГО изменения; пусто — взять очередь из реестра"
        # Не обязателен с тех пор, как обход идёт сам: пустой вход значит «возьми
        # очередь», и это рабочий путь, а не забытое поле.
        required: false
        type: string
      # ВЕРИФИКАТОР ВХОДИТ ОТ ОДНОЙ НАХОДКИ, а не от изменения, и это другой
      # проверяющий, а не более строгий тот же (082). Аудитор ищет неизвестное,
      # верификатор берёт ОДНУ известную находку и пытается её опровергнуть.
      # Предмет — отпечаток из реестра находок; номер изменения читается оттуда же.
      mark:
        description: "отпечаток находки из реестра находок — проверить её премису; пусто — не проверять"
        required: false
        type: string

concurrency:
  # Группа называет ГОЛОВУ, а не только номер изменения (правило 179): у соседа
  # её нет, и там прогон на устаревшем коммите способен вытеснить более новый.
  #
  # У РУЧНОГО ЗАПУСКА ПРЕДМЕТ НАЗЫВАЕТ ВХОД, А НЕ СОБЫТИЕ. При `workflow_dispatch`
  # `pull_request` пуст, и без `inputs.pr` группа схлопывалась в одну на все
  # номера: поздние взгляды по РАЗНЫМ изменениям гасили друг друга. Замер
  # 10.09.2026 — владелец запустил пять заходов подряд по разным номерам, до
  # конца дошёл один, четыре отменены. Снаружи это выглядело как «механизм не
  # работает», хотя не работала именно группа.
  #
  # ПРОВЕРКА ПРЕМИСЫ НЕ СНИМАЕТСЯ ПОВТОРНЫМ НАЖАТИЕМ (#857, взгляд на #870). У
  # неё группа своя на каждый запуск — номер прогона в имени: иначе второе
  # нажатие по той же находке на той же голове снимало бы идущий `verify`
  # вместе с уже оплаченным ответом агента. Голову группа называет по-прежнему.
  group: review-${{ github.event.pull_request.number || inputs.pr || inputs.mark || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}${{ inputs.mark && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  # Взгляд ждёт вердикта сводного гейта на голове (#762) — его запись читается.
  checks: read
  pull-requests: write
  # Живая задача-адресат находок заводится и обновляется этим прогоном.
  issues: write
  id-token: write
  # Чтение прогонов — ПОТОЛОК ДЛЯ ОДНОГО ДЖОБА КАРТЫ (#1164): шаг выдаёт его
  # ей одной, а прочим джобам — свой список без него (`step-review.yml`).
  # Права вызванного прогона не шире прав вызывающего, поэтому оно здесь.
  actions: read

jobs:
  # ТОНКИЙ ВЫЗОВ (#993): взгляд, реестр находок, верификатор и поздний взгляд —
  # общим шагом `step-review.yml`; здесь только то, что решает проект, —
  # когда звать, имя запуска и один ли заход.
  #
  # СВОЙ ВЫЗОВ ПРИБИТ К ОБЩЕЙ ВЕТКЕ, А НЕ К `./`. Код конвейера шаг берёт на
  # коммите вызова (#990). Вызов `./…` на `pull_request` берёт шаг с коммита
  # изменения — и карта исполняла бы код головы, которую судит: изменение
  # правкой `look_mode.py` назначило бы себе пропуск взгляда само (#804,
  # #848). По адресу `@main` коммит вызова — голова общей ветки, как у
  # потребителя — его тег. Цена названа: правка `step-review.yml` идёт во
  # взгляд только после слияния — как и правка файла с агентом до выноса
  # (`scripts/check_agent_silenced.py`).
  #
  # АДРЕС ПОСТАВЩИКА ЗДЕСЬ БУКВАМИ, И ПРЕДЕЛ НАЗВАН (поздний взгляд на #1170).
  # `uses:` не принимает выражений — `${{ github.repository }}` в адресе
  # площадка отвергнет, — и в форке поставщика этот вызов зовёт шаг и код
  # ВЕРХНЕГО репозитория, а не форка: его правка `step-review.yml` в форке не
  # исполняется. Это та же модель, что у потребителя, — тело взгляда берётся
  # у поставщика; форку, который правит сам взгляд, вызов надо перенаправить
  # на себя одной строкой.
  review:
    uses: ArtVsMark/Engineering-Pipeline-Mechanisms/.github/workflows/step-review.yml@main
    with:
      pr: ${{ inputs.pr || '' }}
      mark: ${{ inputs.mark || '' }}
    # КЛЮЧ ПЕРЕДАЁТСЯ ПО ИМЕНИ, А НЕ `secrets: inherit` (#993, вариант «а»).
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
