# ПЕРЕИСПОЛЬЗУЕМЫЙ ПРОГОН: шаг конвейера, который зовут, а не запускают.
#
# ПЕРВЫЙ ВЫНЕСЕННЫЙ ШАГ (этап 4, эпик #547). Тело переехало из `ci.yml` целиком
# и без правок — менялся АДРЕС, а не поведение: иначе перевод и починку нельзя
# было бы отличить друг от друга, а первый же красный прогон пришлось бы
# разбирать на два вопроса разом.
#
# СОБЫТИЕ ЗДЕСЬ ОДНО — `workflow_call`, — и это третий род прогона рядом с «на
# изменении» и «вне изменения». Сам он не идёт никогда; запись проверки дают
# его джобы, но ТОЛЬКО через вызывающего и ТОЛЬКО составным именем:
# «<имя вызывающего> / <имя вызванного>». Замер прогоном на живой площадке —
# изменение #549, документация площадки из окна недоступна (139).
#
# ОТДАЁТСЯ НАРУЖУ: потребитель зовёт этот файл адресом с версией, к которой он
# прибит (157), а не копией у себя.
#
# ПОТРЕБИТЕЛЬ ЗОВЁТ ЭТОТ ЖЕ ФАЙЛ АДРЕСОМ С ВЕРСИЕЙ, к которой он прибит (157),
# а не копией у себя: копия — ровно та беда, из-за которой этап 4 и заведён.
name: step-debt

on:
  workflow_call:

# Права объявляет ВЫЗЫВАЮЩИЙ: у переиспользуемого прогона своего события нет,
# и просить права ему не у кого. Здесь они названы потолком — большего шаг не
# получит, даже если вызывающий даст больше.
permissions:
  contents: read
  issues: read

jobs:
  debt:
    # СОВЕЩАТЕЛЬНЫЙ ШАГ, А НЕ ГЕЙТ. Долг бывает больше одного изменения, и
    # красное здесь стало бы проверкой, которую приучаются обходить (051).
    # Его дело — не пускать долг в невидимое: находки и неотвеченные правила
    # идут перед планом, и это должно быть видно, а не вспоминаться.
    name: debt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Счёт по пунктам спрашивает, КОГДА имя появилось в истории. В мелком
          # клоне она обрезана до одного коммита, и все файлы выглядят
          # добавленными в нём — признак срабатывал бы на каждом названном.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Шаг читает краснотy общей ветки через `main_red`, а тот — ответ по
      # классам проверок, и разбирает его YAML. Без этой строки шаг падал бы
      # на импорте, ДО входа в скрипт: свой третий исход выдать он не мог бы,
      # и прогон читал бы сбой как отказ механизма.
      - name: поставить разбор состава
        run: python -m pip install --quiet "pyyaml>=6,<7" ./packages/transport
      - name: остаток долга — находки и неотвеченные правила
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Коды разбираются списком РАЗРЕШЁННОГО (068): объявленные исходы — 0
          # и 3, всё прочее отказ. Третий здесь означает «часть источников не
          # прочитана», и он не зеленит шаг молча.
          said="${RUNNER_TEMP}/debt.txt"
          set +e
          python scripts/debt.py >"$said" 2>&1
          code=$?
          set -e
          cat "$said"
          reason="$(tr '\n' ' ' <"$said")"
          case "$code" in
            0) ;;
            3) echo "::warning::часть источников долга не прочитана: ${reason}" ;;
            # ОТКАЗ ТОЖЕ НЕСЁТ ПРИЧИНУ, а не только объявленный третий исход.
            # Причина вычислена строкой выше и до сих пор доставалась одной
            # ветке из трёх: шаг падал, говоря наружу ровно ничего. Замер
            # 16.09.2026 — голова 229fb95: `debt` упал, разобрать красноту было
            # нечем, и почему она случилась, неизвестно до сих пор (142).
            *) echo "::error::остаток долга не прочитан (код $code): ${reason}"; exit "$code" ;;
          esac

