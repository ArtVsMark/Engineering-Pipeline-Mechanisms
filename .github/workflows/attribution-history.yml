# Атрибуция в ИТОГОВОЙ истории общей ветки, а не в коммитах ветки изменения.
#
# ЧЕГО НЕ ВИДИТ ГЕЙТ НА ИЗМЕНЕНИИ. Он спрашивает коммиты ветки относительно
# базы — и на изменении зелен. Но в общую ветку едет НЕ они: очередь уплотняет
# работу в один коммит и составляет ему тело сама. Если трейлер туда не попал,
# гейт изменения об этом не узнает никогда: его предмет уже слит и закрыт.
#
# Замер 10.09.2026, из-за которого прогон и заведён: из ста первопредков после
# объявленной отметки шестнадцать шли без строки соавтора — четырнадцать мержей
# старого способа слияния и два уплотнения. Все они старше 09.09 18:17, то есть
# старше того дня, когда очередь научилась переносить трейлеры в тело.
#
# ПОЧЕМУ `since`, А НЕ ВСЯ ИСТОРИЯ. Тот хвост переписать нечем: коммиты общей
# ветки не правятся. Спрашивать со всей истории значило бы держать вечное
# красное, а вечное красное — не сигнал, а фон, и рядом с ним не заметят
# настоящего (051). Отметка объявлена здесь и двигается только вперёд и только
# осознанно.
#
# ОТМЕТКА — КОММИТ, А НЕ ДАТА, и это стоило первого же прогона. Вход назван
# `since`, и слово «начало» располагает подать время; у гейта каталога `since`
# РЕВИЗИЯ, из неё строится диапазон `<since>..<ref>`. Дата дала третий исход —
# «`2026-09-09T18:20:00..origin/main` не разобран», — а снаружи это выглядело
# обычным красным: «нашёл отказ» и «не смог посмотреть» различает только лог
# (039). Держит это теперь `tests/test_attribution_history.py`: проверить прогон
# иначе было нечем — он идёт по событию общей ветки, и первый его заход
# случается уже ПОСЛЕ слияния (139).
#
# ПОЧЕМУ ОТДЕЛЬНЫМ ФАЙЛОМ, А НЕ РАБОТОЙ В `ci.yml`. Работа с условием `if` даёт
# на изменениях запись с исходом `skipped`, а сводный гейт считает пропуск
# обязательного отказом (040). Отдельный файл со своим событием не создаёт
# записи на изменениях вовсе. Приём взят у каталога (162).
#
# Красное здесь — долг по УЖЕ слитому: правкой изменения он не чинится, и
# слияния не держит. Это источник 3 контура 1, а не стоп.
name: attribution-history

on:
  push:
    branches: [main]
  # У события всегда есть ручная кнопка: события теряются (104).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attribution-history
  cancel-in-progress: true

jobs:
  first-parents:
    name: attribution-history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Закреплено по SHA: прогон идёт с ОБЩЕЙ ветки, и подвижная метка здесь
      # меняет исполняемый код без нашего ведома (152).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Первопредки — это вся история общей ветки, мелкого клона не хватит.
          fetch-depth: 0
      # Гейт не переписан здесь: каталог отдаёт его действием, и подключение
      # идёт ссылкой на версию, а не копией (090).
      - name: сверить атрибуцию первопредков
        uses: ArtVsMark/Engineering-Incidents-Playbook/.github/actions/attribution@v1.2.0
        with:
          authors: .github/authors.txt
          mode: first-parents
          # Объявленное начало — ПОСЛЕДНИЙ первопредок без строки соавтора:
          # 09.09 18:17, слияние #48 старым способом. Диапазон полуоткрыт, сам
          # этот коммит не спрашивается; всё, что после него, — уже наше.
          # Отпечаток целиком, а не короткий: короткий однажды перестаёт быть
          # однозначным, и отметка тогда указывает не туда.
          since: "7df3f9683c6102c599ff31ac6b110f2bf68222b2"
          require-declared-author: "true"
          require-coauthor: "true"
          catalogue-ref: v1.2.0
