# Верификатор по плану: висящие находки по слитому идут на проверку премисы.
#
# РЕШЕНИЕ ВЛАДЕЛЬЦА 04.10.2026 (#1005, вариант 3). Заход идёт после пересборки
# плана — тогда же, когда раздел 3 («долг по уже слитому») пересчитан, — и
# зовёт верификатор (`review.yml`, джоб `verify`) на находки, висящие дольше
# срока. Потолок запусков за сутки считается у площадки по имени прогона.
# Логика, срок и потолок — `scripts/verify_queue.py`.
#
# КОД — С ОБЩЕЙ ВЕТКИ (152, 085). `workflow_run` исполняет определение и код
# общей ветки; право у прогона — звать другой прогон, и чужой код с ним был
# бы обходом.
#
# ИМЯ ЗАПИСИ ПРОВЕРКИ СОСТАВНОЕ — `verify-queue / verify-queue`: заход идёт
# общим шагом (#993).
name: verify-queue

on:
  workflow_run:
    workflows: [work-plan]
    types: [completed]
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  # Вызов прогона верификатора — право `actions: write`, и только оно.
  actions: write
  # Живой реестр находок читается, а не пишется: пишет сам верификатор.
  issues: read
  pull-requests: read

concurrency:
  # Один заход за раз: два подряд посчитали бы суточный потолок по одному
  # состоянию и позвали бы верификатор сверх него (149).
  group: verify-queue
  cancel-in-progress: false

jobs:
  # ТОНКИЙ ВЫЗОВ (#993): заход — общим шагом `step-verify-queue.yml`, здесь
  # только то, что решает проект, — когда звать и один ли заход. Код конвейера
  # шаг берёт своим checkout на коммите вызова (#990).
  verify-queue:
    uses: ./.github/workflows/step-verify-queue.yml
