# ПЕРЕИСПОЛЬЗУЕМЫЙ ПРОГОН: шаг конвейера, который зовут, а не запускают.
#
# Тело переехало из `ci.yml` ЦЕЛИКОМ и без правок — менялся адрес, а не
# поведение: иначе перевод и починку нельзя было бы отличить друг от друга.
#
# ОТДАЁТСЯ НАРУЖУ: потребитель зовёт этот файл адресом с версией, к которой он
# прибит (157), а не копией у себя. Почему копия — беда, с замером копий по
# проектам семьи, — в договоре, docs/use/pipeline.md (022).
#
# ИМЯ ЗАПИСИ ПРОВЕРКИ У ВЫЗВАННОГО ДЖОБА СОСТАВНОЕ — «<имя вызывающего> / <имя
# вызванного>». Замер прогоном на живой площадке (изменение #549), а не по
# документации: из окна она недоступна (139).
#
# ДУБЛЬ ЭТОЙ ШАПКИ НАМЕРЕННЫЙ, И ЭТО СКАЗАНО, А НЕ УМОЛЧАНО (071). Площадка
# требует от переиспользуемого прогона ОТДЕЛЬНОГО ФАЙЛА: вынести пояснение в
# общее место нечем — комментарий не подключается, а сам прогон зовут по адресу
# файла. Цена названа: правка пояснения идёт по всем файлам разом, и расходятся
# они молча. Держит их от расхождения не внимание, а прогон
# `tests/test_reusable_steps.py`.
name: step-journal

on:
  workflow_call:

# Потолок прав: большего шаг не получит, даже если вызывающий даст больше.
permissions:
  contents: read
  checks: read
  pull-requests: read
  issues: read

jobs:
  journal:
    name: journal
    # На общей ветке шаг не идёт: предмет — фрагмент, приехавший с изменением.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # КОД КОНВЕЙЕРА — СВОИМ CHECKOUT, А НЕ ИЗ ДЕРЕВА ВЫЗЫВАЮЩЕГО (#990). У
      # потребителя нашего `scripts/` нет: дерево вызывающего — ЕГО, и в нём
      # только данные. Репозиторий и коммит — того файла, который позвали
      # (`job.workflow_repository`, `job.workflow_sha`), поэтому прибивка
      # вызова к тегу прибивает и код, а адрес поставщика буквами не пишется.
      # Замер прогоном 01.10.2026 (#997): `github.job_workflow_sha` у
      # вызванного шага пуст, `job.workflow_sha` — коммит вызванного файла.
      # Пустой коммит не подменяется веткой по умолчанию молча (045).
      # ДУБЛЬ ЭТОГО БЛОКА НАМЕРЕННЫЙ (071): площадка не подключает шаги внутрь
      # шага, и блок стоит в каждом общем шаге, зовущем наш код. Совпадение
      # блоков держит `tests/test_reusable_steps.py::test_the_code_block_is_one_in_every_step`.
      - name: коммит вызова назван
        env:
          AT: ${{ job.workflow_sha }}
        run: |
          if [ -z "$AT" ]; then
            echo "::error::коммит вызова шага не назван — код конвейера не взят (045)"
            exit 1
          fi
      - name: код конвейера — на коммите вызова
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-mechanisms
          persist-credentials: false
      # Из рабочего дерева код уносится: обходы по дереву потребителя видят
      # только его файлы, а не наши.
      - name: унести код конвейера из дерева потребителя
        run: |
          set -euo pipefail
          mv .pipeline-mechanisms "$RUNNER_TEMP/mechanisms"
          echo "MECHANISMS=$RUNNER_TEMP/mechanisms" >>"$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Общий низ конвейера ставится пакетом (024).
      - run: python -m pip install --quiet $MECHANISMS/packages/transport
      # БАЗА ПОДТЯГИВАЕТСЯ ОТДЕЛЬНЫМ ШАГОМ, а не внутри блока проверки. Свой
      # прогон перед толчком берёт команды блоками целиком и блок с `git fetch`
      # запустить не может: локально это не проверка, а правка чужого дерева.
      # Пока фетч жил внутри, гейт журнала был виден только площадке — и ловил
      # то, что видно на дереве, уже после толчка.
      - name: подтянуть базу
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base="${GITHUB_BASE_REF:-main}"
          git fetch --no-tags origin "$base:refs/remotes/origin/$base"
      - name: фрагмент журнала
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python $MECHANISMS/scripts/check_journal.py
      # Собранный журнал здесь НЕ сверяется: он собирается при выпуске (030).
      # Общий файл, который трогает каждая ветка, даёт конфликт на каждом
      # втором изменении — ровно тот инцидент, из-за которого правило и есть.
      - name: фрагменты журнала разбираются
        env:
          # База нужна: шаг разбирает то, что принесло ИЗМЕНЕНИЕ, а не всё
          # состояние каталога. Иначе он валится третьим исходом сразу после
          # выпуска, когда фрагменты уехали в `released/` и каталог пуст.
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python $MECHANISMS/scripts/build_changelog.py --fragments
      - name: версия не правлена руками
        run: python $MECHANISMS/scripts/check_version.py
      # Полнота истории — предмет прогона, а не проверок. Две проверки версии
      # идут по живому дереву и на обрезанном чекауте пропускаются (у них там
      # нет предмета); чтобы пропуск не стал молчаливой дырой, здесь стоит
      # гейт: тегов не пришло — третий исход вслух (045).
      - name: история пришла целиком
        run: python $MECHANISMS/scripts/version.py --check
      # СВОЁ ИМЯ БЕРЁТСЯ У ПЛОЩАДКИ, А НЕ ИЗ ПАМЯТИ ДЕРЕВА (172). Токен нужен:
      # переименованное ловится ответом площадки, а не сравнением имён — старое
      # имя не похоже на новое, и площадка держит по нему редирект.
      - name: имена репозиториев не устарели
        env:
          GH_TOKEN: ${{ github.token }}
        run: python $MECHANISMS/scripts/check_own_name.py
      # ПОДПИСЬ ПОД ПЕРЕЧИТЫВАНИЕМ НЕ ЕДЕТ ОДНА. Поднятый номер прочитанной
      # выгрузки говорит «ответы перечитаны под неё»; поднятый в одиночку — это
      # подпись под несделанным, и она гасит сигнал дрейфа, ради которого номер
      # и заведён (157).
      - name: подпись под перечитыванием
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python $MECHANISMS/scripts/check_reread.py

      # Ссылками на правила проект обосновывает решения, и битая ссылка
      # обесценивает довод: проверить его нельзя. Имена берутся у каталога, а
      # не из памяти — по памяти их и написали 29 раз.
      - name: ссылки на правила разрешаются
        run: |
          set -uo pipefail
          rc=0
          python $MECHANISMS/scripts/check_rule_links.py || rc=$?
          case "$rc" in
            0) ;;
            # МОЛЧАНИЕ КАТАЛОГА НЕ КРАСИТ, НО И НЕ ИСЧЕЗАЕТ. Предупреждение
            # видно автору изменения прямо на нём: адресат у отказа канала есть,
            # и это не лог, в который никто не смотрит (084, 154).
            4) echo "::warning::Каталог не ответил — имена правил не сверены. Это отказ канала, а не находка о дереве. Если повторяется, чинить у каталога, а не здесь." ;;
            *) exit "$rc" ;;
          esac
      # Разбор правила живёт в каталоге, и мы на него ССЫЛАЕМСЯ. Переписанный к
      # себе, он расходится с источником при первой же правке каталога — и
      # расходится молча: копия выглядит прежней, а правило под ней уже другое
      # (153). Цитата при этом законна: гейт судит потерю адреса, а не
      # заимствование.
      - name: чужой разбор приведён ссылкой, а не копией
        run: |
          set -uo pipefail
          rc=0
          python $MECHANISMS/scripts/check_foreign_why.py || rc=$?
          case "$rc" in
            0) ;;
            # МОЛЧАНИЕ КАТАЛОГА НЕ КРАСИТ, НО И НЕ ИСЧЕЗАЕТ. Предупреждение
            # видно автору изменения прямо на нём: адресат у отказа канала есть,
            # и это не лог, в который никто не смотрит (084, 154).
            4) echo "::warning::Каталог не ответил — копии чужого разбора не сверены. Это отказ канала, а не находка о дереве. Если повторяется, чинить у каталога, а не здесь." ;;
            *) exit "$rc" ;;
          esac
      # Инструмент, отданный наружу, называют на входе, а не в журнале
      # изменений: неназванное берут копированием, потому что другого пути
      # читателю не оставили (163). Помеченных сегодня ноль — поэтому гейт
      # судит вход: пока отдавать нечего, README обязан говорить это словом, а
      # появится первый помеченный — обязан назвать его и замолчать про пустоту.
      - name: отданное наружу названо на входе
        run: python $MECHANISMS/scripts/check_shipped.py
      # Решение пересматривают НОВОЙ записью, а не правкой старой: переписанное
      # задним числом решение выдаёт сегодняшний выбор за вчерашний, и следа от
      # этого не остаётся. Предмет — что ИЗМЕНЕНИЕ делает с принятой записью,
      # поэтому прошлое гейт не судит: его правкой изменения не починить (051).
      - name: принятое решение не переписано задним числом
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python $MECHANISMS/scripts/check_decisions_edit.py

      # ВОПРОС О ПРАВИЛЕ ЗАДАЁТСЯ ЗДЕСЬ, ПОТОМУ ЧТО ЗДЕСЬ ЕГО ЕЩЁ ЕСТЬ КОМУ
      # ОТВЕТИТЬ. После слияния окно ушло, и разбирать за него значило бы
      # угадывать. Гейт не решает, правило это или нет, — он не даёт промолчать.
      - name: новая запись решения называет судьбу правила
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base="${GITHUB_BASE_REF:-main}"
          python $MECHANISMS/scripts/check_rule_birth.py --base "origin/$base"

      # Ссылка на производное — значок, картинку, отчёт — не уезжает в общую
      # ветку раньше, чем прогон его нарисовал. Проверкой «файл есть в дереве»
      # это не лечится: производного в дереве и не должно быть, — спрашивается
      # площадка.
      - name: ссылка на производное не раньше самого производного
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python $MECHANISMS/scripts/check_derived_refs.py
      # НОВОЕ ПРИЕЗЖАЕТ СО СВОИМ ПРОГОНОМ. Замер 12.09.2026 по одиннадцати
      # настоящим дефектам смены: покрытие поймало бы два, и оба одного класса
      # — «новая функция, у которой тестов нет вообще». Остальные девять —
      # верно работающий покрытый код с неверной премисой, и процентами они не
      # видны. Судится только ДОБАВЛЕННОЕ: в дереве 75 имён из 327 не названы
      # ни одним прогоном, и краснеть на них значило бы судить чужую работу.
      - name: новое приезжает со своим прогоном
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python $MECHANISMS/scripts/check_new_is_tested.py
      # ПАРА К ПРЕДЫДУЩЕМУ, И ИМЕННО ЕЁ ОТСУТСТВИЕ СТОИЛО ШЕСТИ СЛУЧАЕВ ЗА ДВОЕ
      # СУТОК (21–22.09.2026). Сосед спрашивает, зовёт ли добавленное имя НАБОР;
      # этот — зовёт ли его РАБОЧИЙ путь. Механизм, до которого не доходит
      # управление, выглядел здоровее непроверенного: у него есть зелёный
      # прогон, а дифф показывает исправный код. Четыре из шести нашёл внешний
      # взгляд, два — нарочный замер, ноль — чтение.
      - name: добавленное зовёт рабочий путь
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python $MECHANISMS/scripts/check_reached_by_work.py
