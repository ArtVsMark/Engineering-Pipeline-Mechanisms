# Замер взведения: площадку спрашивают, принимает ли мутация ТЕЛО уплотнения.
#
# ЗАЧЕМ ЗАМЕР ОТДЕЛЬНЫМ ПРОГОНОМ. Решение
# `docs/decisions/011-merging-is-handed-to-the-platform.md` отдаёт площадке
# последнее действие — само слияние, — и назвало непроверенным ровно одно:
# доходят ли до уплотнения `commitHeadline` и `commitBody`. Поля объявлены
# входом мутации, но в семье их не передаёт никто, то есть проверено это не
# было. Переключать очередь на непроверенной премисе смена уже ловила себя
# трижды, поэтому сначала вопрос, потом переключение
# ([044](https://github.com/ArtVsMark/Engineering-Incidents-Playbook/blob/main/rules/ru/044-check-the-premise-before-fixing.md)).
#
# ТОЛЬКО КНОПКА, И ЭТО ИСПРАВЛЕНИЕ, А НЕ ОСТОРОЖНОСТЬ. Заход стоял на
# `pull_request`: замер обязан ехать вместе с изменением, которое механизм
# трогает (139). Но у такого прогона в окружении лежит `MERGE_QUEUE_TOKEN`, а
# исполняет он код ИЗ САМОГО ИЗМЕНЕНИЯ — то есть любая правка `scripts/arm.py`
# в ветке становится кодом, которому выдали токен владельца. Это известный путь
# кражи секрета, и нашёл его внешний взгляд на #231 (`b41a6ce`).
#
# Своё подтверждение прогоном замер уже получил — 12.09.2026, ответ записан в
# #196 и в решении 011. Дальше он нужен как КНОПКА: спросить площадку снова,
# когда premise понадобится перечитать. Взведение же живёт теперь в шаге 8, и
# там оно не исполняет код изменения — прогон очереди берёт файлы с общей ветки.
#
# ОТВЕТ ПИШЕТСЯ В ЗАДАЧУ, А НЕ В ЛОГ. Логи прогонов агентскому окну недоступны
# — прокси режет хранилище, — и замер, оставшийся в логе, не прочтёт тот, кому
# он нужен. Адресат назван в `.pipeline.yml` и это эпик #196: там принимается
# решение, для которого замер и делается (142).
#
# ТОКЕН ВЛАДЕЛЬЦА. Взведение — запись, несущая личность: на токене прогона
# слияние в общей ветке подписало бы приложение
# ([131](https://github.com/ArtVsMark/Engineering-Incidents-Playbook/blob/main/rules/ru/131-no-writes-from-a-cloud-session.md)).
name: arm

on:
  # Событие сюда не ведёт намеренно: см. шапку. Кнопка — единственный вход, и
  # предмет она СПРАШИВАЕТ: замер трогает чужую работу, и выбирать её за
  # человека нечем.
  workflow_dispatch:
    inputs:
      pr:
        description: номер изменения под замер (годны конфликтное и закрытое проверками)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Один заход на репозиторий, и ОТМЕНЫ НЕТ. Взведение и снятие идут парой:
  # заход, убитый между ними, оставляет чужой значок висеть, и снять его будет
  # некому — площадка сольёт изменение, как только проверки позеленеют
  # ([109](https://github.com/ArtVsMark/Engineering-Incidents-Playbook/blob/main/rules/ru/109-every-exit-from-a-transient-state-must-be-terminal.md)).
  # Нашёл внешний взгляд на #231 (`e189694`, `0d569d4`).
  group: arm
  cancel-in-progress: false

jobs:
  probe:
    name: arm-probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: спросить площадку про тело уплотнения
        env:
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Ввод идёт ОКРУЖЕНИЕМ, а не подстановкой в текст команды: подставленный
          # `${{ }}` — это чужая строка внутри нашей оболочки
          # ([085](https://github.com/ArtVsMark/Engineering-Incidents-Playbook/blob/main/rules/ru/085-content-from-the-subject-is-untrusted-input-to-the-prompt.md)).
          SUBJECT: ${{ inputs.pr }}
        run: |
          set -uo pipefail
          rc=0
          python scripts/arm.py --probe --pr "$SUBJECT" --apply --say-to 196 || rc=$?
          # Исходы разбираются СПИСКОМ: неизвестный код — не «почти удача» (039).
          case "$rc" in
            0) echo "замер отработал — ответ записан в #196" ;;
            3) echo "::warning::замер не настроен — нет MERGE_QUEUE_TOKEN, взводить нечем" ;;
            *) echo "::error::замер не отработал (код $rc) — решение 011 осталось без ответа"
               exit 1 ;;
          esac
