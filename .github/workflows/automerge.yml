# Шаг 8 скелета: очередь и слияние (docs/pipeline.md).
#
# ИМЯ ФАЙЛА И КОНТЕКСТА — `automerge`, и это окончательно, а не «до решения»:
# решение #3 принято 09.09 (docs/decisions/003-own-automerge-not-native-queue.md).
# Имя выбрано по большинству семьи (3 из 5), а не по красоте: каждое
# переименование обнуляет историю прогонов файла.
#
# СОБЫТИЕ, А НЕ ОПРОС (011). Очередь двигают четыре вещи, и каждая — событие:
# метка появилась или снялась, прогон гейтов завершился, общая ветка поехала,
# прогон взгляда завершился — голова ждёт его вердикта перед взведением (#654).
# Расписания здесь нет намеренно: наблюдение и тревога — предмет службы, а не
# площадки (docs/decisions/004-schedules-stay-service-observes.md), и ни один
# шаг конвейера от службы не зависит.
#
# `workflow_run` ЗАКРЫВАЕТ ОБА ОСТАВШИХСЯ СЛУЧАЯ РАЗОМ. Гейты идут и на
# изменении, и на общей ветке, поэтому одно событие даёт и «проверки
# позеленели», и «main поехал, голова очереди отстала». Второй триггер на
# `push: main` был бы вторым источником того же — ровно то, что запрещает 022.
#
# ТОКЕН — ВЛАДЕЛЬЦА (MERGE_QUEUE_TOKEN), а не `github.token`. Слияние несёт
# личность человека: на токене прогона автором в общей ветке стало бы
# приложение, и после уплотнения переписать это нечем (131, 135). Цена того,
# что шага не было, записана в docs/decisions/001-attribution-of-merged-1.md.
#
# БЕЗ СЕКРЕТА ШАГ НЕ КРАСНЕЕТ, А ГОВОРИТ. Необязательный канал не роняет
# основную работу (084): иначе каждое изменение краснело бы ни за что, и
# проверку научились бы обходить (051).
name: automerge

on:
  # Метка — вход механизма (064), и её правка обязана двигать очередь сразу:
  # `automerge` ставит в очередь, `hold` снимает, `blocker` меняет ступень.
  # `synchronize` — ради согласия после вердикта взгляда (#654): толчок в
  # взведённое изменение запускает новый взгляд, и очередь обязана снять
  # взведение сразу — иначе площадка сольёт голову по зелёному `ci` раньше,
  # чем взгляд скажет (`865341e`).
  pull_request:
    types: [labeled, unlabeled, ready_for_review, converted_to_draft, synchronize]
  workflow_run:
    # `review` — голова, ждавшая взгляда, взводится заходом, который зовёт
    # завершение его прогона. Прогон `review` идёт и не по изменению — поздний
    # взгляд по расписанию, верификатор, уборка после `ci` на общей ветке, —
    # и тогда заход очереди лишний, но безвредный: очередь одна, заходы идут
    # по одному (`concurrency`), и ждать в нём некого (`2c15d26`).
    workflows: [ci, review]
    types: [completed]
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read
  # Реестр слитого без внешнего взгляда — живая задача, и ведёт её этот прогон.
  issues: write

concurrency:
  # Очередь одна на репозиторий, поэтому и группа одна: два захода сразу
  # прочитали бы одну голову и слили бы её дважды. Голову называть здесь
  # нечем и не нужно (179) — предмет группы не изменение, а сама очередь.
  group: automerge
  cancel-in-progress: false

jobs:
  automerge:
    name: automerge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Тело уплотнения собирается из коммитов ветки — нужна вся история.
      # ЗАКРЕПЛЕНО ПО SHA, ПОТОМУ ЧТО ВЫЗЫВАЮЩИЙ БЕРЁТСЯ С ОБЩЕЙ ВЕТКИ. На
      # `workflow_run` площадка берёт файл прогона с `main`, а не из изменения:
      # значит вызываемое обязано быть закреплено, иначе подвижная метка меняет
      # исполняемый код без нашего ведома
      # ([152](https://github.com/ArtVsMark/Engineering-Incidents-Playbook/blob/main/rules/ru/152-pinning-callee-without-caller.md)).
      # На `pull_request` рассуждение обратное — там файл прогона правит тот же,
      # кто правит изменение, и закрепление ничего не добавляет.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Шаг читает ответ по классам проверок, а тот разбирает YAML. Без этой
      # строки шаг падал бы на импорте — ДО входа в скрипт, — и свой третий
      # исход выдать не мог: прогон прочитал бы сбой как «секрет не задан».
      - name: поставить разбор состава
        run: python -m pip install --quiet "pyyaml>=6,<7" ./packages/transport

      - name: двигать очередь
        env:
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # ВЫВОД УХОДИТ В АННОТАЦИЮ И СВОДКУ, А НЕ ТОЛЬКО В ЛОГ. Очередь
        # печатает РАЗБОР: почему голова пропущена, кто взведён, что признано
        # пустым. Лог прогона читается не из всякого окна — облачному хранилище
        # закрыто, — и от захода остаётся код возврата, по которому не
        # разобрать ничего. Ровно на этом 13.09.2026 не удалось подтвердить
        # починку пустой головы: механизм отработал, а показать это было нечем
        # (#287).
        #
        # ЧИТАЕМА СНАРУЖИ ИМЕННО АННОТАЦИЯ, И ЭТО ЗАМЕР, А НЕ ДОГАДКА.
        # 13.09.2026: у джоба `ci-complete` на изменении #290 REST отдаёт
        # `annotations_count: 1`, а `output.summary` — пустую строку. Сводка
        # остаётся для человека в окне площадки, наружу говорит аннотация.
        run: |
          set -uo pipefail
          # `-e` приходит из умолчания площадки и без `|| rc=$?` убил бы
          # оболочку раньше разбора кода: три исхода стали бы двумя.
          rc=0
          python scripts/automerge.py > "${RUNNER_TEMP}/queue.txt" 2>&1 || rc=$?
          cat "${RUNNER_TEMP}/queue.txt"
          # ТЕЛО ПОДАЁТСЯ ОТСТУПОМ, А НЕ ЗАБОРОМ ИЗ КАВЫЧЕК. В выводе очереди
          # есть заголовки изменений, а их пишет человек: три кавычки подряд в
          # заголовке закрывают забор раньше времени, и остаток разбора
          # разъезжается по разметке сводки. Отступ в четыре пробела ломать
          # нечем. Нашли внешние взгляды на #292 — двумя записями.
          {
            echo "### очередь: заход ${rc}"
            echo
            sed 's/^/    /' "${RUNNER_TEMP}/queue.txt"
          } >> "${GITHUB_STEP_SUMMARY}"
          # Аннотация одной строкой: переводы строк экранируются, иначе
          # площадка обрежет сообщение первым же из них. ПОРЯДОК ЗАМЕН
          # ОБЯЗАТЕЛЕН — сперва сам знак процента, иначе подставленный `%0A`
          # превратится в `%250A`.
          said="$(sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' "${RUNNER_TEMP}/queue.txt")"
          echo "::notice::очередь: заход ${rc}%0A${said}"

          # Коды разбираются СПИСКОМ РАЗРЕШЁННОГО (068): зелёными считаются
          # только объявленные, всё прочее — отказ. Обратный порядок уже стоил
          # соседнему шагу зелёного прогона на сломанном коде.
          case "$rc" in
            0) ;;
            3)
              echo "::warning::MERGE_QUEUE_TOKEN не задан — очередь не двигается. Нужен токен владельца с правами contents:write и pull-requests:write; иначе слияние делает человек, и в общей ветке автором станет он."
              ;;
            *)
              echo "::error::Шаг очереди не отработал (код $rc): $(tr '\n' ' ' <"${RUNNER_TEMP}/queue.txt")"
              exit 1
              ;;
          esac
          exit 0

      # СЛЕД О СЛИЯНИИ БЕЗ ВЗГЛЯДА ОСТАЁТСЯ ЗДЕСЬ, ГДЕ ПРОИСХОДИТ СЛИЯНИЕ.
      # Ревью совещательное намеренно (084), и цена этого одна: «взгляд был и
      # находок нет» и «взгляда не было вовсе» снаружи одинаковы. Код возврата
      # ревью умирает вместе с прогоном, поэтому факт записывается в живую
      # задачу — она переживает слияние (142).
      #
      # ШАГ НЕ ДЕРЖИТ ОЧЕРЕДЬ И НЕ КРАСНЕЕТ: он ведёт запись, а не проверку.
      # Токен здесь прогонный, а не владельца: задача — не слияние, личность
      # человека она не несёт, и отдавать ей право слияния незачем (108).
      - name: слитое без взгляда получает след
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          rc=0
          # Причина отказа едет в аннотацию, а не остаётся в логе: логи прогонов
          # из части окон не читаются вовсе, и «смотрите вывод шага» для них —
          # тупик (142). Приём один на проект (090).
          said="${RUNNER_TEMP}/unlooked.txt"
          python scripts/unlooked.py --apply >"$said" 2>&1 || rc=$?
          cat "$said"
          reason="$(tr '\n' ' ' <"$said")"
          case "$rc" in
            0) echo "у всего слитого в окне обхода взгляд был" ;;
            3) echo "реестр слитого без взгляда обновлён" ;;
            *) echo "::warning::Реестр слитого без внешнего взгляда не отработал (код $rc) — факт остался неназванным: ${reason}" ;;
          esac
