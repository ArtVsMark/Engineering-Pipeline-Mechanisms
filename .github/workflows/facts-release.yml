# Выпуск ДОГОВОРА ФАКТОВ семьи: тег `facts-v<номер>` и страница с пятью файлами
# (#1563, решение владельца 22.10.2026: договор фактов 2.0 держат механизмы).
#
# НЕ ВЫПУСК МЕХАНИЗМОВ. Тот — `release.yml` и тег `vX.Y.Z`; этот ставит тег
# договора, к которому издатели фактов прибивают проверку в своём шаге CI.
# Номер — `export/facts/facts.version`, и только он; тег из него выводится.
#
# КНОПКОЙ И ТОКЕНОМ ВЛАДЕЛЬЦА (131). Тег и страница несут личность человека,
# поэтому прогон зовётся руками и пишет `MERGE_QUEUE_TOKEN`, а не токеном
# прогона. Без флажка `apply` — сухой заход: выпуск собирается и проверяется,
# но не ставится.
#
# СЕМЬЮ СПРОСИЛИ ПЕРВОЙ (162): прогон взят у каталога вместе с договором — у
# каталога выпуск договора был готовым прогоном каталога, и приём перенесён
# сюда переездом; у соседей по семье своего выпуска договора нет.
#
# ТРАНСПОРТ ОДИН (001). Страница и файлы ставятся `scripts/facts_release.py
# --publish` через `ghrest`, а не `gh release create`, как у каталога.
name: facts-release

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "поставить тег и страницу; без флажка — сухой заход"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: facts-release
  cancel-in-progress: false

jobs:
  release:
    name: facts-release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: выпуск — только с общей ветки
        if: inputs.apply && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Выпуск договора фактов запускается с main, а не с ${GITHUB_REF}: тег пометил бы то, чего в общей ветке нет."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet ./packages/transport
      - name: собрать и проверить выпуск
        if: ${{ !inputs.apply }}
        env:
          # Сухой заход к площадке не ходит: теги читаются локально
          # (`git tag --list` по выборке checkout). Токен здесь держит гейт
          # шага (`test_steps_get_their_token`): скрипт выпуска зовёт транспорт.
          GH_TOKEN: ${{ github.token }}
        run: python scripts/facts_release.py --dist "$RUNNER_TEMP/facts-release" --notes "$RUNNER_TEMP/facts-notes.md"
      - name: выпустить
        if: inputs.apply
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Выпуск запрошен, но MERGE_QUEUE_TOKEN не задан: тег несёт личность человека, и токеном прогона его ставить нельзя."
            exit 2
          fi
          python scripts/facts_release.py --dist "$RUNNER_TEMP/facts-release" \
            --notes "$RUNNER_TEMP/facts-notes.md" --publish --target "$GITHUB_SHA"
