# Шаг 14 скелета: факты о проекте и значок — в отдельную ветку.
#
# ПРОИЗВОДНОЕ НЕ КОММИТИТСЯ В ОБЩУЮ ВЕТКУ (правило 125). Значок и сводка,
# лежащие рядом с источником, расходятся с ним молча: правится источник, а
# число остаётся вчерашним, и заметить это можно только сверкой руками.
#
# ВЕТКА `badges` ПОПОЛНЯЕТСЯ КОММИТАМИ, А НЕ ПЕРЕЗАПИСЫВАЕТСЯ (#1001, шаг 2).
# Факты кладёт общий шаг `step-facts.yml` коммитом поверх ветки и не трогает
# остального (решение владельца 06.10.2026, вариант 1); этот прогон — его
# первый потребитель и тем же способом кладёт свои значки и архив находок.
# Прежде ветка была сиротой из одного коммита: перезапись затёрла бы факты,
# положенные шагом. Цена названа: ветка копит историю производного — вреда
# не несёт, ценности тоже.
#
# ПУБЛИКАЦИЯ ЕЩЁ И ЧИСТИТ КАТАЛОГ: всё, чего нет в перечне `build_facts.py
# --branch-files`, она с ветки снимает (#1198). В перечне — и файлы общего
# шага, иначе этот прогон удалял бы их каждым заходом; совпадение держит
# `tests/test_facts.py`.
#
# ЭТО КАНАЛ НАРУЖУ, А НЕ УКРАШЕНИЕ. Соседям по семье и каталогу правил нужно
# знать, на какой версии контракта стоит проект и сколько правил он держит.
# Факты о проекте публикует сам проект (174), а не тот, кто о нём пишет:
# `facts.json` лежит по адресу контракта фактов семьи — ветка `badges`, путь
# `.github/badges/facts.json`, как у соседей (#759), — и читается без клона.
name: badges

on:
  push:
    branches: [main]
  # ЕДИНЫЙ ЗНАЧОК КРАСИТСЯ ИСХОДОМ ПРОГОНА, который на толчке ещё идёт (#1019):
  # сборка по толчку видит прошлый исход `ci`. Поэтому сборка просыпается и
  # когда он ЗАВЕРШИЛСЯ на общей ветке — иначе цвет отставал бы на целое слияние.
  #
  # `python-next` БУДИТ СБОРКУ ТОЖЕ: предрелизную зону действие каталога красит его
  # исходом, а на толчке этот прогон ещё идёт — без своего события цвет
  # отставал бы на слияние, а недельный заход по расписанию не попадал бы на
  # значок вовсе (взгляд на #1066). Будить сборку обязан каждый прогон, чей
  # исход значок рисует, — это держит `tests/test_showcase.py`.
  #
  # Файл прогона на `workflow_run` площадка берёт с общей ветки, и выкачка без
  # `ref:` берёт её же — код закреплён за ней событием, а не строкой (152).
  # Явный `ref:` здесь не нужен и гейтом не допускается: свой ref — это база
  # или коммит вызова (tests/test_review_safety.py, `own_ref`).
  #
  # СБОРКА НА НЁМ ПОЛНАЯ, А НЕ ОДИН ЗНАЧОК. Группа ниже держит один ожидающий
  # прогон и заменяет его новым: облегчённый заход, заменивший толчковый,
  # опубликовал бы вчерашние факты поверх сегодняшнего слияния. Цена — ещё одна
  # полная сборка на слияние; архив находок дописывается приростом, и повтор
  # без нового слияния его не двигает.
  workflow_run:
    workflows: [ci, python-next]
    types: [completed]
    branches: [main]
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:
    inputs:
      reread:
        description: "перечитать снятия учтённых изменений из истории main (#820)"
        type: boolean
        default: false

permissions:
  # Право на запись нужно ровно на толчок в производную ветку. Таких прогонов в
  # конвейере два — этот и `runs-series`, — и оба пишут только в свою
  # производную ветку (125): `badges` пополняется коммитами поверх, а не
  # пересоздаётся сиротой (шапка файла). Прежде здесь стояло «единственное
  # право на запись во всём конвейере»: исключительное утверждение,
  # переставшее быть верным в день появления второго (181).
  contents: write
  # Архив находок (#778) читает ленты слитых изменений и живой реестр; тела
  # слияний он берёт из истории общей ветки, а не у площадки (взгляд на #874).
  pull-requests: read
  issues: read
  # Исходы прогонов и их работ для единого значка читаются у площадки (#1019).
  actions: read

concurrency:
  # Голова здесь не нужна: последний прогон обязан быть последним словом, а
  # два захода, кладущих коммиты на одну ветку, разошлись бы отказом толчка.
  # Им он и остаётся без отмены: площадка держит в группе один ожидающий
  # прогон и заменяет его новым. ИДУЩИЙ НЕ СНИМАЕТСЯ:
  # снятый заход уже потратил запросы на волну архива, но учтённого не
  # опубликовал, и следующий платил бы её заново — час стоил бы волну на
  # каждое слияние (взгляд на #879).
  group: badges
  cancel-in-progress: false

jobs:
  # СВОИ ВХОДЫ ОБЩЕГО ШАГА: свои разделы файлом и покрытие этого прогона. Шаг
  # их вливает, а не считает второй раз (155, 022): наш прогон — первый
  # потребитель общего издателя фактов (#1001).
  inputs:
    name: inputs
    # ФИЛЬТР `branches` СВЕРЯЕТ `head_branch`, А НЕ ВЕТКУ ПРИЁМНИКА. Прогон `ci`
    # на изменении из форка с веткой `main` тоже несёт `head_branch: main` и
    # будил бы сборку с правом записи. Код при этом наш, с общей ветки, но
    # публикация вышла бы лишней. Поэтому `workflow_run` идёт только от
    # прогонов общей ветки — толчка, кнопки и расписания: расписание есть у
    # `python-next`, и заходит оно всегда на общей ветке (взгляды на #1033, #1066).
    if: >-
      github.event_name != 'workflow_run'
      || contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event.workflow_run.event)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # ВСЯ ИСТОРИЯ И ТЕГИ: версия проекта СЧИТАЕТСЯ по ним. Мелкий клон даёт
      # правдоподобное число, которое ложь, — тегов не видно, и MAJOR.MINOR
      # берутся из объявленного контракта вместо выпущенного (045).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet "pyyaml>=6,<7" ./packages/transport

      # СВОДКА СЕМЬИ БЕРЁТСЯ У КАТАЛОГА, А НЕ СОБИРАЕТСЯ ЗАНОВО. Она уже
      # собрана его ночным прогоном и лежит в его ветке значков; второй сборщик
      # тех же чисел разошёлся бы с первым молча (022).
      #
      # Отказ здесь не роняет шаг: без сводки числа семьи объявляются НЕ
      # прочитанными, а не нулевыми (045). Свои факты собираются в любом случае.
      - name: взять сводку семьи у каталога
        continue-on-error: true
        run: |
          set -uo pipefail
          curl -sSfL -o "$RUNNER_TEMP/where.json" \
            https://raw.githubusercontent.com/ArtVsMark/Engineering-Incidents-Playbook/badges/export/where.json \
            || echo "::warning::Сводка семьи не скачалась — числа общих механизмов будут объявлены непрочитанными."
      # ПОКРЫТИЕ СЧИТАЕТСЯ ПРОГОНОМ, И СЧЁТЧИК ОБЯЗАН ВИДЕТЬ ПОДПРОЦЕССЫ. Гейты
      # проверяются ЗАПУСКОМ, и без ключа `COVERAGE_SUBPROCESS` счётчик показывал
      # ноль у полностью проверенных модулей: 66% против настоящих 77%. Обёртку
      # ставит `tests/conftest.py`, а не `.pth` в чужом каталоге пакетов —
      # молчаливый приём сломался бы незаметно.
      #
      # Отказ здесь не роняет шаг: без отчёта покрытие объявляется НЕ
      # прочитанным, а не нулевым (045). Прочие факты собираются в любом случае.
      - name: сосчитать покрытие
        continue-on-error: true
        env:
          COVERAGE_SUBPROCESS: "1"
          # Зерно порядка — номер прогона, как и на изменении: упавший порядок
          # воспроизводим снаружи, а логи этого прогона из части окон не читаются.
          RANDOM_SEED: ${{ github.run_id }}
        run: |
          set -uo pipefail
          # НАБОР ПРОГОНЯЕТСЯ ТЕМ ЖЕ СОСТАВОМ, ЧТО И НА ИЗМЕНЕНИИ. Прежде здесь
          # ставился только счётчик, а самого набора в окружении не было вовсе:
          # заход падал, покрытие объявлялось НЕ ПРОЧИТАННЫМ — честно, но
          # единственным следом было предупреждение в логе, которого часть окон
          # не видит. Замер 15.09.2026: значок витрины показывал «покрытие: не
          # прочитано», а facts.json — `read: false`, и так с самого появления
          # счётчика 12.09. Число, ни разу не опубликованное, выглядело
          # опубликованным (045).
          python -m pip install --quiet \
            "coverage>=7,<8" "pytest>=8,<10" "pytest-randomly>=3,<4" ./packages/transport
          rc=0
          python -m coverage run --parallel-mode --source=scripts -m pytest \
            --strict-markers -p no:cacheprovider \
            ${RANDOM_SEED:+--randomly-seed=$RANDOM_SEED} -q || rc=$?
          # Зелёным считается ТОЛЬКО объявленный код: Python отдаёт единицу и
          # при необработанном сбое, и читать её условием значило бы засчитать
          # поломку за известное состояние (068).
          case "$rc" in
            0)
              python -m coverage combine -q
              python -m coverage json -o "$RUNNER_TEMP/in/coverage.json" -q
              ;;
            *)
              echo "::warning::Набор не прошёл под счётчиком (код $rc) — покрытие будет объявлено непрочитанным."
              ;;
          esac
      # КТО ИЗ СЕМЬИ ЗОВЁТ НАШИ ШАГИ — обходом клонов, а не совпадением имён
      # (#1199). Клоны — сеть, поэтому обход отдельным шагом, а сборка фактов
      # читает его файл. Код 3 — часть клонов не прочитана: числа есть и
      # непрочитанные в них названы; иной ненулевой — файла нет, и факты
      # скажут «не прочитано», а не ноль (045). Время держит сам обход
      # (`family_uptake.BUDGET`): после бюджета соседи не начинаются и названы
      # непрочитанными, а прочитанные остаются в файле. Предел шага стоит выше
      # худшего случая обхода и ловит лишь то, чего обход не предвидел: снятый
      # по нему шаг файла не оставит — это то же «не прочитано».
      - name: обойти клоны семьи
        timeout-minutes: 4
        continue-on-error: true
        run: |
          set -uo pipefail
          rc=0
          python scripts/family_uptake.py --summary "${RUNNER_TEMP}/where.json" \
            --out "${RUNNER_TEMP}/uptake.json" || rc=$?
          case "$rc" in
            0|3) ;;
            *) echo "::warning::обход клонов семьи не отработал (код $rc) — «взяли вызовом» не прочитано" ;;
          esac
      - name: свои разделы — файлом для общего шага
        run: |
          python scripts/build_facts.py \
            --extra-out "${RUNNER_TEMP}/in/extra-facts.json" \
            --family "${RUNNER_TEMP}/where.json" \
            --uptake "${RUNNER_TEMP}/uptake.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: facts-inputs
          path: ${{ runner.temp }}/in
          if-no-files-found: error
          retention-days: 1

  # ФАКТЫ СОБИРАЕТ И КЛАДЁТ ОБЩИЙ ШАГ (#1001, шаг 2): общие показатели он
  # выводит из дерева, наши вливает из артефакта, сверяет со схемой витрины
  # и публикует коммитом поверх ветки `badges`. Свой адрес — внутренний путь:
  # прогон идёт только на общей ветке, и голова изменения сюда не попадает.
  facts:
    needs: inputs
    uses: ./.github/workflows/step-facts.yml
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: read
    with:
      ci-workflow: ci.yml
      python-matrix: ci.yml:test-matrix
      python-next: python-next.yml:test-next
      inputs-artifact: facts-inputs
      # Архив находок пишет общий шаг тем же коммитом, что факты (#1414):
      # у нас и у потребителя один путь, а не наш свой джоб. ЗАГОТОВКА
      # ПОТРЕБИТЕЛЯ РЕЖЕТСЯ ОТСЮДА, и `archive: true` уходит в неё как есть
      # (взгляд на #1423): заготовка кладёт и взгляд, а без архива находки
      # взгляда у потребителя не копились бы. Кто взгляд не зовёт, ставит
      # `false` — по умолчанию у шага вход выключен.
      archive: true
      archive-reread: ${{ inputs.reread == true }}

  badges:
    name: badges
    needs: facts
    # Тот же фильтр будящих событий, что у `inputs`: значок красит исход тех
    # прогонов, что будят сборку, и это сверяет `tests/test_showcase.py`.
    if: >-
      github.event_name != 'workflow_run'
      || contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event.workflow_run.event)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # ВСЯ ИСТОРИЯ И ТЕГИ: версия проекта СЧИТАЕТСЯ по ним. Мелкий клон даёт
      # правдоподобное число, которое ложь, — тегов не видно, и MAJOR.MINOR
      # берутся из объявленного контракта вместо выпущенного (045).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet "pyyaml>=6,<7" ./packages/transport
      # Ветка `badges` выбирается целиком, без --depth: мелкая выборка в полном
      # клоне поставила бы границу истории на её коммит (взгляд на #1183).
      # ЗНАЧКИ РИСУЮТСЯ ПО ОПУБЛИКОВАННЫМ ФАКТАМ, а не по второй сборке: число
      # на значке и в файле, который читает витрина, иначе разошлись бы (022).
      #
      # НЕОПУБЛИКОВАННОЕ — С ТОГО ЖЕ КОММИТА (взгляд на #1345). `rules`,
      # `manifest` и `contract` в фактах 1.6 не лежат, и рисующий берёт их из
      # дерева (`build_facts.rehydrated`). Дерево этого прогона — голова ветки,
      # а факты на `badges` могут быть от прежнего коммита: публикацию отказали
      # или её обогнала другая голова. Поэтому дерево для них — отдельная копия
      # на `commit` из самих фактов. Коммита нет в истории — отказ: значок по
      # чужому дереву хуже прежнего значка (045). Отказ `--commit-of` пишет
      # свою причину в пометку: поля нет и JSON не читается — разные поломки,
      # и общая фраза назвала бы вторую первой (взгляд на #1364). Нет ветки
      # `badges` или в ней нет `facts.json` — тоже своя пометка, а не немое
      # падение через `set -e` (взгляд на #1382).
      - name: взять опубликованные факты и их дерево
        run: |
          set -euo pipefail
          if ! git fetch --quiet origin badges 2>"${RUNNER_TEMP}/fetch.err"; then
            echo "::error::Значки не нарисованы: ветка badges не получена — $(tr '\n' ' ' < "${RUNNER_TEMP}/fetch.err")"
            exit 1
          fi
          if ! git show FETCH_HEAD:.github/badges/facts.json > "${RUNNER_TEMP}/facts.json" 2>"${RUNNER_TEMP}/show.err"; then
            echo "::error::Значки не нарисованы: на ветке badges нет facts.json — $(tr '\n' ' ' < "${RUNNER_TEMP}/show.err")"
            exit 1
          fi
          if ! commit=$(python scripts/build_facts.py --commit-of "${RUNNER_TEMP}/facts.json" 2>"${RUNNER_TEMP}/commit-of.err"); then
            echo "::error::Значки не нарисованы: $(tr '\n' ' ' < "${RUNNER_TEMP}/commit-of.err")"
            exit 1
          fi
          if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
            echo "::error::Значки не нарисованы: коммита фактов «${commit}» нет в истории — дерево для неопубликованных разделов взять неоткуда."
            exit 1
          fi
          git worktree add --quiet --detach "${RUNNER_TEMP}/at-facts" "$commit"
      # `project.svg` ЗДЕСЬ НЕ РИСУЕТСЯ (#1422): его собирает действие каталога
      # `project-badge` в общем шаге фактов (джоб `facts`), и писатель у файла
      # один. Единый значок `python.svg` снят вместе с шагом `python-badge`:
      # верхняя строка значка проекта несёт те же зоны, и уборка ветки его снимает.
      - name: нарисовать значки по фактам
        run: |
          python scripts/build_facts.py \
            --from-facts "${RUNNER_TEMP}/facts.json" \
            --out-dir "${RUNNER_TEMP}/badges" \
            --root "${RUNNER_TEMP}/at-facts" \
            --supplier "$GITHUB_REPOSITORY"
      - name: опубликовать в ветку badges
        run: |
          set -euo pipefail
          pub="${RUNNER_TEMP}/publish"
          git fetch --quiet origin badges
          git worktree add --quiet --detach "$pub" FETCH_HEAD
          cp -R "${RUNNER_TEMP}/badges/.github/badges/." "$pub/.github/badges/"
          # СНЯТОЕ УХОДИТ С ВЕТКИ (взгляд на #1198): копия поверх ничего не
          # удаляет, и снятый значок застывал по своему адресу навсегда.
          # Перечень допустимого выводит сборка из инвентаря, а не список
          # снятых по имени; удаляет тоже она — файл или каталог целиком, —
          # а запись удаления делает `git add -A` ниже (взгляд на #1202).
          python scripts/build_facts.py --prune "$pub/.github/badges"
          cd "$pub"
          # Производное собирает машина, и подписывать его человеком было бы
          # ложью: автор здесь — прогон, и в истории это должно быть видно.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/badges
          if git diff --cached --quiet; then
            echo "значки не изменились — коммита нет"
            exit 0
          fi
          git commit -q -m "значки на ${GITHUB_SHA}"
          # БЕЗ --force: факты общего шага на ветке не затираются (#1001).
          git push -q origin HEAD:refs/heads/badges
