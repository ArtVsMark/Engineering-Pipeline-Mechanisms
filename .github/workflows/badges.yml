# Шаг 14 скелета: факты о проекте и значок — в отдельную ветку.
#
# ПРОИЗВОДНОЕ НЕ КОММИТИТСЯ В ОБЩУЮ ВЕТКУ (правило 125). Значок и сводка,
# лежащие рядом с источником, расходятся с ним молча: правится источник, а
# число остаётся вчерашним, и заметить это можно только сверкой руками.
#
# ВЕТКА `badges` — СИРОТА И ПЕРЕЗАПИСЫВАЕТСЯ ЦЕЛИКОМ. История производного
# ценности не имеет: его можно удалить и собрать заново, ничего не потеряв.
# Поэтому ветка всегда состоит из одного коммита, а не наращивается — иначе
# репозиторий копит мусор, который никто не читает.
#
# ЭТО КАНАЛ НАРУЖУ, А НЕ УКРАШЕНИЕ. Соседям по семье и каталогу правил нужно
# знать, на какой версии контракта стоит проект и сколько правил он держит.
# Факты о проекте публикует сам проект (174), а не тот, кто о нём пишет:
# `facts.json` лежит по адресу контракта фактов семьи — ветка `badges`, путь
# `.github/badges/facts.json`, как у соседей (#759), — и читается без клона.
name: badges

on:
  push:
    branches: [main]
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:
    inputs:
      reread:
        description: "перечитать снятия учтённых изменений из истории main (#820)"
        type: boolean
        default: false

permissions:
  # Право на запись нужно ровно на толчок в производную ветку. Таких прогонов в
  # конвейере два — этот и `runs-series`, — и оба пишут только в свою ветку-сироту
  # (125). Прежде здесь стояло «единственное право на запись во всём конвейере»:
  # исключительное утверждение, переставшее быть верным в день появления второго
  # (181).
  contents: write
  # Архив находок (#778) читает ленты слитых изменений и живой реестр; тела
  # слияний он берёт из истории общей ветки, а не у площадки (взгляд на #874).
  pull-requests: read
  issues: read

concurrency:
  # Голова здесь не нужна: ветка перезаписывается целиком, и последний прогон
  # обязан быть последним словом. Им он и остаётся без отмены: площадка держит
  # в группе один ожидающий прогон и заменяет его новым. ИДУЩИЙ НЕ СНИМАЕТСЯ:
  # снятый заход уже потратил запросы на волну архива, но учтённого не
  # опубликовал, и следующий платил бы её заново — час стоил бы волну на
  # каждое слияние (взгляд на #879).
  group: badges
  cancel-in-progress: false

jobs:
  badges:
    name: badges
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # ВСЯ ИСТОРИЯ И ТЕГИ: версия проекта СЧИТАЕТСЯ по ним. Мелкий клон даёт
      # правдоподобное число, которое ложь, — тегов не видно, и MAJOR.MINOR
      # берутся из объявленного контракта вместо выпущенного (045).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "pyyaml>=6,<7" ./packages/transport

      # СВОДКА СЕМЬИ БЕРЁТСЯ У КАТАЛОГА, А НЕ СОБИРАЕТСЯ ЗАНОВО. Она уже
      # собрана его ночным прогоном и лежит в его ветке значков; второй сборщик
      # тех же чисел разошёлся бы с первым молча (022).
      #
      # Отказ здесь не роняет шаг: без сводки числа семьи объявляются НЕ
      # прочитанными, а не нулевыми (045). Свои факты собираются в любом случае.
      - name: взять сводку семьи у каталога
        continue-on-error: true
        run: |
          set -uo pipefail
          curl -sSfL -o "$RUNNER_TEMP/where.json" \
            https://raw.githubusercontent.com/ArtVsMark/Engineering-Incidents-Playbook/badges/export/where.json \
            || echo "::warning::Сводка семьи не скачалась — числа общих механизмов будут объявлены непрочитанными."
      # ПОКРЫТИЕ СЧИТАЕТСЯ ПРОГОНОМ, И СЧЁТЧИК ОБЯЗАН ВИДЕТЬ ПОДПРОЦЕССЫ. Гейты
      # проверяются ЗАПУСКОМ, и без ключа `COVERAGE_SUBPROCESS` счётчик показывал
      # ноль у полностью проверенных модулей: 66% против настоящих 77%. Обёртку
      # ставит `tests/conftest.py`, а не `.pth` в чужом каталоге пакетов —
      # молчаливый приём сломался бы незаметно.
      #
      # Отказ здесь не роняет шаг: без отчёта покрытие объявляется НЕ
      # прочитанным, а не нулевым (045). Прочие факты собираются в любом случае.
      - name: сосчитать покрытие
        continue-on-error: true
        env:
          COVERAGE_SUBPROCESS: "1"
          # Зерно порядка — номер прогона, как и на изменении: упавший порядок
          # воспроизводим снаружи, а логи этого прогона из части окон не читаются.
          RANDOM_SEED: ${{ github.run_id }}
        run: |
          set -uo pipefail
          # НАБОР ПРОГОНЯЕТСЯ ТЕМ ЖЕ СОСТАВОМ, ЧТО И НА ИЗМЕНЕНИИ. Прежде здесь
          # ставился только счётчик, а самого набора в окружении не было вовсе:
          # заход падал, покрытие объявлялось НЕ ПРОЧИТАННЫМ — честно, но
          # единственным следом было предупреждение в логе, которого часть окон
          # не видит. Замер 15.09.2026: значок витрины показывал «покрытие: не
          # прочитано», а facts.json — `read: false`, и так с самого появления
          # счётчика 12.09. Число, ни разу не опубликованное, выглядело
          # опубликованным (045).
          python -m pip install --quiet \
            "coverage>=7,<8" "pytest>=8,<10" "pytest-randomly>=3,<4" ./packages/transport
          rc=0
          python -m coverage run --parallel-mode --source=scripts -m pytest \
            --strict-markers -p no:cacheprovider \
            ${RANDOM_SEED:+--randomly-seed=$RANDOM_SEED} -q || rc=$?
          # Зелёным считается ТОЛЬКО объявленный код: Python отдаёт единицу и
          # при необработанном сбое, и читать её условием значило бы засчитать
          # поломку за известное состояние (068).
          case "$rc" in
            0)
              python -m coverage combine -q
              python -m coverage json -o "$RUNNER_TEMP/coverage.json" -q
              ;;
            *)
              echo "::warning::Набор не прошёл под счётчиком (код $rc) — покрытие будет объявлено непрочитанным."
              ;;
          esac
      - name: собрать факты и значок
        run: |
          python scripts/build_facts.py \
            --out-dir "${RUNNER_TEMP}/badges" \
            --sha "${GITHUB_SHA}" \
            --family "${RUNNER_TEMP}/where.json" \
            --coverage "${RUNNER_TEMP}/coverage.json"
      # АРХИВ НАХОДОК ВЗГЛЯДА (#778) — в ту же ветку и тем же адресом семьи.
      # Он ДОПИСЫВАЕТСЯ: прежний файл берётся git-ом с ветки `badges` (не API
      # содержимого: тот не отдаёт файлы больше мегабайта), и к нему
      # добавляется слитое, которого в нём ещё нет.
      #
      # ИСТОРИЮ ОТКАЗОМ НЕ ТЕРЯЕМ. Ветка перезаписывается целиком, и упавший
      # шаг снял бы архив с неё, а ответы верификатора у ушедших из реестра
      # записей не восстановить. Поэтому: шаг отказал — прежний файл
      # переносится как есть; ветку не прочитать вовсе — прогон не публикует
      # её, а краснеет (взгляд на #788, 045).
      #
      # «ВЕТКИ НЕТ» И «ВЕТКУ НЕ ПРОЧЕСТЬ» РАЗЛИЧАЕТ КОД, А НЕ УСПЕХ. `ls-remote
      # --exit-code` отвечает 2 только на отсутствие ветки; сеть и права дают
      # 128. Прежняя редакция читала любой ненулевой код как «ветки нет», и
      # двойной отказ сети собирал архив с нуля поверх истории (взгляд на #788).
      #
      # ПЕРЕНОС НЕ МОЛЧИТ. Прежний файл спасает историю, но не дописывается: без
      # сигнала архив замер бы на месте, а прогон зеленел. Поэтому перенос
      # помечается выходом шага, и после публикации прогон краснеет (045).
      - name: дописать архив находок
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          # Кнопка перечитки идёт окружением, а не подстановкой в текст команды (085).
          REREAD: ${{ inputs.reread }}
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/badges/.github/badges/findings.json"
          prev="${RUNNER_TEMP}/findings-prev.json"
          args=()
          # Перечитка — только по кнопке: история читается целиком, и на каждом
          # толчке в main она не нужна (#820).
          # История читается у ТОЙ ветки, с которой нажата кнопка, а обещана
          # история main: с другой ветки её тело сняло бы находку (взгляд на #849).
          if [ "${REREAD:-}" = "true" ]; then
            if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
              echo "::error::перечитка читает историю main, а кнопка нажата на ${GITHUB_REF:-?} — останавливаю"
              exit 1
            fi
            args+=(--reread)
          fi
          if git fetch --quiet --depth=1 origin badges; then
            # «ФАЙЛА НЕТ» И «ФАЙЛ НЕ ПРОЧИТАН» — ТА ЖЕ РАЗВИЛКА, ЧТО У ВЕТКИ НИЖЕ.
            # Отказ `git show` не говорит, какой из двух: прежняя редакция
            # читала любой как «архива нет» и собирала его с нуля поверх
            # истории (взгляд на #791). Отсутствие называет `ls-tree` пустым
            # ответом, а сбой — кодом.
            listed=0
            found=$(git ls-tree -z --name-only FETCH_HEAD -- .github/badges/findings.json | tr -d "\0") || listed=$?
            if [ "$listed" -ne 0 ]; then
              echo "::error::дерево ветки badges не прочитано (ls-tree код $listed) — архив не перенести, публикацию останавливаю"
              exit 1
            elif [ -z "$found" ]; then
              echo "архива на ветке ещё нет — наполнение с начала"
            else
              shown=0
              git show FETCH_HEAD:.github/badges/findings.json > "$prev" || shown=$?
              if [ "$shown" -ne 0 ]; then
                echo "::error::архив на ветке есть, но не прочитан (show код $shown) — публикацию останавливаю"
                exit 1
              fi
              args+=(--previous "$prev")
            fi
          else
            remote=0
            git ls-remote --exit-code --heads origin badges >/dev/null || remote=$?
            case "$remote" in
              2) echo "ветки badges ещё нет — наполнение с начала" ;;
              *)
                echo "::error::ветка badges не прочитана (ls-remote код $remote) — архив не перенести, публикацию останавливаю"
                exit 1
                ;;
            esac
          fi
          rc=0
          python scripts/findings_archive.py --repo "${GITHUB_REPOSITORY}" --out "$out" \
            "${args[@]}" || rc=$?
          case "$rc" in
            0) ;;
            *)
              echo "::warning::архив находок не дописан (код $rc) — переношу прежний как есть."
              if [ -f "$prev" ]; then cp "$prev" "$out"; fi
              echo "carried=$rc" >> "$GITHUB_OUTPUT"
              ;;
          esac
      # ПРИЁМКА СТРОЖЕ ЧИНИМОГО (193, #864): архив сверяется с историей общей
      # ветки независимым чтением, а не тем же разбором, что его собрал.
      # Расхождение — предупреждение: публикацию оно не держит, но называется
      # числом на каждой сборке.
      # Сверка идёт против ОБЩЕЙ ветки явно, а не против HEAD: запуск кнопкой с
      # другой ветки сравнил бы архив с чужой историей (взгляд на #873). Прежний
      # архив нужен, чтобы предупреждать только о новом расхождении.
      - name: сверить архив с историей
        env:
          ARCHIVE: ${{ runner.temp }}/badges/.github/badges/findings.json
          PREVIOUS: ${{ runner.temp }}/findings-prev.json
        run: |
          set -uo pipefail
          rc=0
          python scripts/archive_against_history.py --archive "$ARCHIVE" \
            --previous "$PREVIOUS" --ref origin/main || rc=$?
          case "$rc" in
            0|3) ;;
            *) echo "::warning::архив с историей не сверен (код $rc) — приёмка перечитки не проверена" ;;
          esac
      - name: опубликовать в ветку badges
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/badges"
          git init -q -b badges
          # Производное собирает машина, и подписывать его человеком было бы
          # ложью: автор здесь — прогон, и в истории это должно быть видно.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "факты и значок на ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" badges
          echo "опубликовано: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/badges/.github/badges/facts.json"
      - name: архив не замер
        if: steps.archive.outputs.carried != ''
        env:
          CARRIED: ${{ steps.archive.outputs.carried }}
        run: |
          echo "::error::архив находок перенесён без дописывания (код $CARRIED) — факты опубликованы, архив стоит на месте"
          exit 1
