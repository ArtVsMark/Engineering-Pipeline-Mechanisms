# План работ: зеркало источников 0–6 в живой задаче (scripts/work_plan.py).
#
# ЗАХОД ИДЁТ ПО ПРОГОНУ КОНВЕЙЕРА, А НЕ ПО РАСПИСАНИЮ, и разница существенная.
# Расписание сделало бы план лентой событий: раз в сутки он либо протухает,
# либо пересчитывает то же самое. Прогон — момент, в который источники
# МЕНЯЮТСЯ, и моментов таких три: слияние меняет источники 3 и 5, проверка на
# голове изменения — источники 1 и 2, ночной заход дрейфа — половину источника
# 5 (#665). Между прогонами меняться нечему.
#
# ЗАМЕР 23.09.2026, ИЗ-ЗА КОТОРОГО ПРОГОН И ЗАВЕДЁН. Сборщик приехал без
# прогона: пересобирать план полагалось «по запросу». За смену слилось СЕМЬ
# изменений, и всё это время план оставался вчерашним — строка закрытой задачи
# висела, а раздел 3 показывал находки, снятые трейлерами. Заметил владелец,
# а не механизм: правило, которое держится на том, что кто-то вспомнит, — это
# правило без механизма
# ([002](https://github.com/ArtVsMark/Engineering-Incidents-Playbook/blob/main/rules/ru/002-rule-without-mechanism.md)).
#
# РАЗДЕЛЫ 4 И 6 МЕХАНИЗМ НЕ СОЧИНЯЕТ. Работу в план кладёт человек; заход лишь
# уносит строки, чей адрес закрыт. Это и есть граница: механизм убирает
# сделанное, человек называет новое.
#
# ПО ЧУЖОМУ ПРОГОНУ — тем же приёмом, что у соседей (`stuck`, `hail`,
# `main-red`): своего события у плана нет, его будит работа конвейера.
name: work-plan

on:
  workflow_run:
    # ВЕТКА НЕ ФИЛЬТРУЕТСЯ, И ЭТО НЕ НЕБРЕЖНОСТЬ. Слияние меняет источники 3 и
    # 5, а проверка на голове ИЗМЕНЕНИЯ — источники 1 и 2: конфликт и красное
    # на своём открытом. Они живут и гаснут между слияниями, и заход только по
    # общей ветке их бы не видел вовсе (045). Дрейф — свой момент: его ночной
    # заход переписывает задачу дрейфа, а это половина источника 5, и без него
    # запись дрейфа доходила бы до плана только со следующим прогоном `ci`.
    #
    # `review` — ПОТОМУ ЧТО РЕЕСТР НАХОДОК ПИШЕТ ОН, А НЕ `ci` (#1726).
    # Уборка реестра идёт по `ci` на общей ветке, тем же событием, что и заход
    # плана, и порядка между ними нет: план, прочитавший реестр раньше уборки,
    # держал снятые находки до следующего `ci` (замер 28.10.2026: `c6ecb05` и
    # `6c54b11` висели после слияния, снявшего их). Пишут реестр ВСЕ прогоны
    # `review`: уборка, поздний взгляд, верификатор — и взгляд по изменению,
    # джоб `findings` шага `step-review.yml` идёт именно на `pull_request`.
    # Поэтому условия работы у плана нет: прежнее отсекало взгляд по изменению
    # с доводом «реестр не пишет», и находки открытого изменения доходили до
    # плана только со следующим `ci` (взгляд на #1727, `c398b1d`).
    #
    # ЦЕПОЧКИ НАЗВАНЫ ОБЕ, И ПРОСЫПАЮТСЯ ОБЕ — ЗАМЕРОМ, А НЕ ДОВОДОМ (взгляд на
    # #1727, `f45a49d`, `e2292c1`). `ci` → `review` → `work-plan` →
    # `verify-queue`: на голове 8f36619 28.10.2026 `review` 40782209181 кончился
    # в 22:44:29, план 40782262870 начался в 22:44:31, `verify-queue`
    # 40782345892 — в 22:45:11, через две секунды после конца плана. Прежний
    # довод «глубже трёх звеньев площадка не будит» здесь неверен. Взгляд по
    # изменению — `review` (`pull_request`) → `work-plan` → `verify-queue`, на
    # звено короче. Предел площадки для цепочек `workflow_run` глубже этих не
    # мерен.
    #
    # ЦЕНА НАЗВАНА (взгляд на #1727, `e684917`): по каждому взгляду на
    # изменение лишний заход плана и `verify-queue`, хотя верификатор смотрит
    # находки СЛИТОГО и по взгляду на изменение ему делать нечего. Замер
    # 28.10.2026: взглядов по изменению 30, план — медиана 36 с из 256 заходов
    # суток, `verify-queue` — 18 с; прибавка около 27 мин исполнителя в сутки.
    # Это плата за то, что находки своего открытого видны в плане сразу;
    # отличить у `verify-queue` заход плана по взгляду нечем — событие прогона
    # плана одно и то же.
    #
    # ЦИКЛ НАЗВАН, И ДЕРЖАТ ЕГО ДВА ПРЕДЕЛА. Верификатор — прогон `review` по
    # кнопке от `verify-queue`; он будит план, план — снова `verify-queue`.
    # Круг гасит очередь: находку, на которую верификатор звался, он не зовёт
    # повторно `RECALL_DAYS` дней, — а сверху стоит суточный потолок
    # `DAILY_CAP` (`scripts/verify_queue.py`). Снимут оба — каждый заход
    # верификатора будет звать следующий.
    workflows: [ci, drift, review]
    types: [completed]
  # У события всегда есть ручная кнопка: события теряются (правило 104). Здесь
  # она нужна и отдельно — находка бывает и без слияния: поздний взгляд на уже
  # слитое кладёт запись в реестр, а слияния за ним не идёт.
  workflow_dispatch:

permissions:
  contents: read
  # План — задача, и тело её ведёт механизм.
  issues: write
  pull-requests: read
  checks: read

concurrency:
  # Один заход на репозиторий: план — общий ресурс с одним владельцем (149).
  # Два слияния подряд переписали бы тело друг друга, и последний обязан быть
  # последним словом.
  group: work-plan
  cancel-in-progress: false

jobs:
  # ТОНКИЙ ВЫЗОВ (#993): сборка — общим шагом `step-work-plan.yml`, здесь
  # только то, что решает проект, — когда пересобирать и один ли заход. Код
  # конвейера шаг берёт своим checkout на коммите вызова (#990), поэтому
  # потребитель зовёт его адресом с тегом, а не копирует.
  work-plan:
    uses: ./.github/workflows/step-work-plan.yml
