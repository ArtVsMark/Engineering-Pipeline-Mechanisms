# План работ: зеркало источников 0–6 в живой задаче (scripts/work_plan.py).
#
# ЗАХОД ИДЁТ ПО ПРОГОНУ КОНВЕЙЕРА, А НЕ ПО РАСПИСАНИЮ, и разница существенная.
# Расписание сделало бы план лентой событий: раз в сутки он либо протухает,
# либо пересчитывает то же самое. Прогон — момент, в который источники
# МЕНЯЮТСЯ, и моментов таких два: слияние меняет источники 3 и 5, проверка на
# голове изменения — источники 1 и 2. Между прогонами меняться нечему.
#
# ЗАМЕР 23.09.2026, ИЗ-ЗА КОТОРОГО ПРОГОН И ЗАВЕДЁН. Сборщик приехал без
# прогона: пересобирать план полагалось «по запросу». За смену слилось СЕМЬ
# изменений, и всё это время план оставался вчерашним — строка закрытой задачи
# висела, а раздел 3 показывал находки, снятые трейлерами. Заметил владелец,
# а не механизм: правило, которое держится на том, что кто-то вспомнит, — это
# правило без механизма
# ([002](https://github.com/ArtVsMark/Engineering-Incidents-Playbook/blob/main/rules/ru/002-rule-without-mechanism.md)).
#
# РАЗДЕЛЫ 4 И 6 МЕХАНИЗМ НЕ СОЧИНЯЕТ. Работу в план кладёт человек; заход лишь
# уносит строки, чей адрес закрыт. Это и есть граница: механизм убирает
# сделанное, человек называет новое.
#
# ПО ЧУЖОМУ ПРОГОНУ — тем же приёмом, что у соседей (`stuck`, `hail`,
# `main-red`): своего события у плана нет, его будит работа конвейера.
name: work-plan

on:
  workflow_run:
    # ВЕТКА НЕ ФИЛЬТРУЕТСЯ, И ЭТО НЕ НЕБРЕЖНОСТЬ. Слияние меняет источники 3 и
    # 5, а проверка на голове ИЗМЕНЕНИЯ — источники 1 и 2: конфликт и красное
    # на своём открытом. Они живут и гаснут между слияниями, и заход только по
    # общей ветке их бы не видел вовсе (045).
    workflows: [ci]
    types: [completed]
  # У события всегда есть ручная кнопка: события теряются (правило 104). Здесь
  # она нужна и отдельно — находка бывает и без слияния: поздний взгляд на уже
  # слитое кладёт запись в реестр, а слияния за ним не идёт.
  workflow_dispatch:

permissions:
  contents: read
  # План — задача, и тело её ведёт механизм.
  issues: write
  pull-requests: read
  checks: read

concurrency:
  # Один заход на репозиторий: план — общий ресурс с одним владельцем (149).
  # Два слияния подряд переписали бы тело друг друга, и последний обязан быть
  # последним словом.
  group: work-plan
  cancel-in-progress: false

jobs:
  work-plan:
    name: work-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # РАЗБОР YAML НУЖЕН, ХОТЯ САМ СБОРЩИК YAML НЕ ЧИТАЕТ. Цепочка импортов,
      # проверенная прогоном: work_plan → debt → main_red → pipeline_checks →
      # yaml. Последнее звено разбирает состав проверок, и без установки шаг
      # упал бы на импорте, ДО входа в механизм. Держит это гейт
      # test_workflow_installs_what_its_scripts_import — он обходит импорты
      # транзитивно и покраснел бы, убери установку.
      #
      # Здесь стояло «сборщик читает источники теми же механизмами, что и шаг
      # долга» — верно, но проверить по этому было нечем, и внешний взгляд на
      # #656 прошёл цепочку до main_red и дальше не пошёл. Звенья названы
      # поимённо, чтобы следующий читатель не останавливался там же.
      - run: python -m pip install --quiet "pyyaml>=6,<7" ./packages/transport
      - name: пересобрать план работ
        # Отказ сборки не роняет ничего: план — совещательный канал, и его
        # молчание не должно держать конвейер (084).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          rc=0
          python scripts/work_plan.py --apply || rc=$?
          case "$rc" in
            0) echo "план собран" ;;
            3) echo "::warning::часть источников не прочитана — разделы названы молчащими, а не пустыми" ;;
            *) echo "::warning::сборка плана не отработала (код $rc) — план остался прежним" ;;
          esac
