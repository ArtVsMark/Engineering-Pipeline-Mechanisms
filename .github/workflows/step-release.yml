# ПЕРЕИСПОЛЬЗУЕМЫЙ ПРОГОН: общий шаг, который зовут, а не запускают.
#
# Тело переехало из прогона, который его исполнял, ЦЕЛИКОМ — у шагов конвейера
# из `ci.yml`, у управляющих механизмов из их собственного прогона, — и при
# переезде менялся адрес, а не поведение: иначе перевод и починку нельзя было
# бы отличить друг от друга. Код конвейера шаг с тех пор берёт своим checkout
# (#990) — это сказано в его блоке кода, а не здесь.
#
# ОТДАЁТСЯ НАРУЖУ: потребитель зовёт этот файл адресом с версией, к которой он
# прибит (157), а не копией у себя. Почему копия — беда, с замером копий по
# проектам семьи, — в договоре, docs/use/pipeline.md (022).
#
# ИМЯ ЗАПИСИ ПРОВЕРКИ У ВЫЗВАННОГО ДЖОБА СОСТАВНОЕ — «<имя вызывающего> / <имя
# вызванного>». Замер прогоном на живой площадке (изменение #549), а не по
# документации: из окна она недоступна (139).
#
# ДУБЛЬ ЭТОЙ ШАПКИ НАМЕРЕННЫЙ, И ЭТО СКАЗАНО, А НЕ УМОЛЧАНО (071). Площадка
# требует от переиспользуемого прогона ОТДЕЛЬНОГО ФАЙЛА: вынести пояснение в
# общее место нечем — комментарий не подключается, а сам прогон зовут по адресу
# файла. Цена названа: правка пояснения идёт по всем файлам разом, и расходятся
# они молча. Держит их от расхождения не внимание, а прогон
# `tests/test_reusable_steps.py`.
name: step-release

on:
  workflow_call:
    inputs:
      # ВХОД ТОЛЬКО ДЛЯ ПРОБЫ ПЕРЕНОСА (#990): стереть `scripts/`, `packages/`
      # и `tests/` из дерева вызывающего после того, как код конвейера взят
      # своим checkout. Цена названа владельцем при выборе: у договора шага
      # появляется вход, которого потребитель не задаёт.
      strip-ours:
        description: проба переноса — стереть наш код из дерева вызывающего
        type: boolean
        default: false
      # ВХОДЫ КНОПКИ ВЫПУСКА — те же, что у вызывающего: входы его кнопки
      # вызванному не видны, и вызывающий передаёт их явно.
      version:
        description: "номер выпуска; пусто — следующий по правилу"
        type: string
        default: ""
      acceptance:
        description: "номер задачи-приёмки: мажор поднимает её ЗАКРЫТИЕ, а не выпуск"
        type: string
        default: ""
      apply:
        description: "сделать необратимое: собрать, пометить тегом и отправить"
        type: boolean
        default: false
      breaking:
        description: "поверхность изменена НЕСОВМЕСТИМО: поднимает мажор версии контракта"
        type: boolean
        default: false
      # ХВОСТ ВЫПУСКА ОТДЕЛЬНЫМ ЗАХОДОМ (#1448, решение владельца 17.10.2026).
      # Тег уже стоит: его поставил этот шаг, а хвост упал, или человек после
      # отказа толчка. Выпуск заново не собирается — журнал собран, фрагменты
      # перенесены. Заход выкачивает тег `v<version>` и проходит три шага
      # хвоста: страницу, подъём своих шагов и снятие метки
      # `plan/waits-release`. Нужны `version` и `apply`: номер без тега не
      # угадывается, а хвост необратим так же, как выпуск.
      tail:
        description: "довести хвост выпуска: тег v<version> уже стоит — страница, подъём своих шагов, снятие метки"
        type: boolean
        default: false
    secrets:
      # ТОКЕН ВЛАДЕЛЬЦА ПРИХОДИТ ТОЛЬКО ЯВНО. Секретов вызывающего вызванный
      # прогон не видит, и вызывающий передаёт ровно этот, по имени (#993).
      # НЕОБЯЗАТЕЛЕН НАМЕРЕННО, и это прежнее поведение, а не новое: без
      # секрета механизм отвечает своим исходом «не настроено» — шаг не
      # краснеет, а говорит (084). Обязательным он не объявлен, чтобы «не
      # настроено» оставалось ответом механизма, а не отказом самого вызова.
      MERGE_QUEUE_TOKEN:
        required: false

# Права объявляет ВЫЗЫВАЮЩИЙ: у переиспользуемого прогона своего события нет,
# и просить права ему не у кого. Здесь они названы потолком — большего шаг не
# получит, даже если вызывающий даст больше.
permissions:
  contents: read
  issues: read

jobs:
  release:
    # Выпуск: проверка условий на сухую и, по входу `apply`, тег, коммит
    # журнала и страница выпуска (scripts/release.py). Когда выпускать, решает
    # человек кнопкой ВЫЗЫВАЮЩЕГО (`.github/workflows/release.yml`); дерево
    # выпуска — его, код конвейера — своим checkout, токен владельца — по имени.
    name: release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      # ХВОСТ БЕЗ НОМЕРА ИЛИ БЕЗ `apply` — ОТКАЗ, А НЕ ВЫПУСК. Без номера
      # непонятно, чей хвост доводить, а без `apply` сухой заход шёл бы по
      # условиям выпуска, которые тег уже не пропустит.
      - name: вход хвоста назван целиком
        if: inputs.tail
        env:
          ASKED_VERSION: ${{ inputs.version }}
          ASKED_APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [ -z "${ASKED_VERSION:-}" ] || [ "${ASKED_APPLY:-false}" != "true" ]; then
            echo "::error::Хвост выпуска (tail) доводится только с номером (version) и apply: номер без тега не угадывается, а хвост необратим."
            exit 1
          fi
      - name: токен владельца не задан
        id: token
        env:
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MERGE_QUEUE_TOKEN:-}" ]; then
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "::warning::MERGE_QUEUE_TOKEN не задан — выпуск возможен только проверкой: тег и коммит несут личность человека, и токеном прогона их ставить нельзя."
          else
            echo "present=yes" >> "$GITHUB_OUTPUT"
          fi

      # ВСЯ ИСТОРИЯ И ТЕГИ: выпуск проверяет, что такого тега ещё нет, и считает
      # версию проекта. Мелкий клон тегов не видит, и проверка стала бы ложной.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.MERGE_QUEUE_TOKEN || github.token }}

      # КОД КОНВЕЙЕРА — СВОИМ CHECKOUT, А НЕ ИЗ ДЕРЕВА ВЫЗЫВАЮЩЕГО (#990). У
      # потребителя нашего `scripts/` нет: дерево вызывающего — ЕГО, и в нём
      # только данные. Репозиторий и коммит — того файла, который позвали
      # (`job.workflow_repository`, `job.workflow_sha`), поэтому прибивка
      # вызова к тегу прибивает и код, а адрес поставщика буквами не пишется.
      # Замер прогоном 01.10.2026 (#997): `github.job_workflow_sha` у
      # вызванного шага пуст, `job.workflow_sha` — коммит вызванного файла.
      # Пустой коммит не подменяется веткой по умолчанию молча (045).
      # ДУБЛЬ ЭТОГО БЛОКА НАМЕРЕННЫЙ (071): площадка не подключает шаги внутрь
      # шага, и блок стоит в каждом общем шаге, зовущем наш код. Совпадение
      # блоков держит `tests/test_reusable_steps.py::test_the_code_block_is_one_in_every_step`.
      - name: коммит и репозиторий вызова названы
        env:
          AT: ${{ job.workflow_sha }}
          FROM: ${{ job.workflow_repository }}
        run: |
          if [ -z "$AT" ]; then
            echo "::error::коммит вызова шага не назван — код конвейера не взят (045)"
            exit 1
          fi
          # Пустой репозиторий checkout молча заменил бы деревом вызывающего.
          if [ -z "$FROM" ]; then
            echo "::error::репозиторий вызова шага не назван — checkout взял бы дерево вызывающего (045)"
            exit 1
          fi
      - name: код конвейера — на коммите вызова
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-mechanisms
          persist-credentials: false
      # Из рабочего дерева код уносится: обходы по дереву потребителя видят
      # только его файлы, а не наши.
      - name: унести код конвейера из дерева потребителя
        env:
          STRIP_OURS: ${{ inputs.strip-ours }}
          FROM: ${{ job.workflow_repository }}
          CALLER: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          mv .pipeline-mechanisms "$RUNNER_TEMP/mechanisms"
          # ПРОБА ПЕРЕНОСА (#990, решение владельца 04.10.2026): со входом
          # `strip-ours` дерево вызывающего лишается нашего кода, и шаг обязан
          # завестись тем, что взял своим checkout. СТИРАЕТСЯ ПО ИМЕНАМ ПАПОК,
          # и у соседа под ними лежит его собственный код. Поэтому стирание
          # идёт, только когда вызывающий прогон — проба передачи
          # `handover-probe.yml` (ответ `ours`: у потребителя её нет) и шаг взят
          # из того же репозитория. Сверки репозиториев одной мало: копию шага
          # у потребителя (`uses: ./…`) площадка тоже считает «своей»
          # (взгляды на #1113, #1118). Форк поставщика с той же пробой — его
          # законный случай: у форка под этими папками наш же код.
          if [ "$STRIP_OURS" = "true" ]; then
            case "$CALLER" in
              */.github/workflows/handover-probe.yml@*) ;;
              *)
                echo "::error::Вход strip-ours — только для пробы передачи handover-probe.yml; здесь зовёт ${CALLER}, и стирать своё нельзя"
                exit 1
                ;;
            esac
            if [ "${GITHUB_REPOSITORY,,}" != "${FROM,,}" ]; then
              echo "::error::Вход strip-ours — только для пробы в репозитории поставщика ${FROM}; здесь ${GITHUB_REPOSITORY}, и стирать нечего своего"
              exit 1
            fi
            rm -rf scripts packages tests
          fi
          echo "MECHANISMS=$RUNNER_TEMP/mechanisms" >>"$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet "pyyaml>=6,<7" $MECHANISMS/packages/transport

      # Подпись — человека: автором выпуска в истории обязан быть он, а не
      # приложение. Проверить это потом нечем — уплотнения тега не бывает.
      - name: подпись выпуска
        run: |
          set -euo pipefail
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: проверить условия выпуска
        if: ${{ !inputs.tail }}
        env:
          GH_TOKEN: ${{ github.token }}
          # ПРАВО ОБХОДА СПРАШИВАЕТСЯ ТЕМ ТОКЕНОМ, КОТОРЫМ ТОЛКАЮТ. Площадка
          # отвечает про спросившего, и вопрос токеном прогона отвечает про
          # него же — «обход: никогда», и отвечает ВЕРНО: обход прогону не
          # положен (`.rules/protection.json`). 13.09.2026 выпуск из-за этого
          # отказывал всегда, а владелец видел, что выданный роли обход ничего
          # не меняет. Читать задачи по-прежнему может токен прогона — права
          # на это у шага есть, и токен владельца тут ничего не добавляет.
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # ВВОД ИДЁТ ОКРУЖЕНИЕМ, А НЕ ПОДСТАНОВКОЙ В ТЕКСТ КОМАНДЫ (085).
          # Кавычка или `$()` во входе кнопки исполнились бы как код.
          ASKED_VERSION: ${{ inputs.version }}
          ASKED_ACCEPTANCE: ${{ inputs.acceptance }}
          ASKED_BREAKING: ${{ inputs.breaking }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${ASKED_VERSION:-}" ]; then args+=(--version "$ASKED_VERSION"); fi
          if [ -n "${ASKED_ACCEPTANCE:-}" ]; then args+=(--acceptance "$ASKED_ACCEPTANCE"); fi
          if [ "${ASKED_BREAKING:-false}" = "true" ]; then args+=(--breaking); fi
          python $MECHANISMS/scripts/release.py ${args[@]+"${args[@]}"}

      - name: выпустить
        id: release
        if: inputs.apply && !inputs.tail && steps.token.outputs.present == 'yes'
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          # ПРАВО ОБХОДА СПРАШИВАЕТСЯ И ЗДЕСЬ — ОСОБЕННО ЗДЕСЬ. Сухой заход
          # получил этот токен, а необратимый остался без него: `push_token()`
          # читает ИМЕННО `MERGE_QUEUE_TOKEN`, и в шаге, который толкает,
          # вопрос о праве не задавался вовсе. Проверка, молчащая в заходе, где
          # она нужнее всего, — та же тишина, что и её отсутствие (045).
          # Нашёл внешний взгляд на #296.
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # То же окружение, что и у сухого захода: два разных способа читать
          # один вход разошлись бы молча (090).
          ASKED_VERSION: ${{ inputs.version }}
          ASKED_ACCEPTANCE: ${{ inputs.acceptance }}
          ASKED_BREAKING: ${{ inputs.breaking }}
        run: |
          set -euo pipefail
          args=(--apply)
          if [ -n "${ASKED_VERSION:-}" ]; then args+=(--version "$ASKED_VERSION"); fi
          if [ -n "${ASKED_ACCEPTANCE:-}" ]; then args+=(--acceptance "$ASKED_ACCEPTANCE"); fi
          if [ "${ASKED_BREAKING:-false}" = "true" ]; then args+=(--breaking); fi
          python $MECHANISMS/scripts/release.py ${args[@]+"${args[@]}"}

          # КОММИТ И ТЕГ УХОДЯТ ОДНИМ АТОМАРНЫМ ТОЛЧКОМ (#1448). Площадка
          # принимает оба ref'а или ни одного (074, 109). Прежде толчков было
          # два: `--follow-tags` не держал порядка, а раздельный тег на v1.7.0
          # получил «missing necessary objects» через полсекунды после
          # принятой ветки — тег уехал один, без своего коммита в пакете, и
          # площадка его ещё не видела. Один пакет гонки не оставляет, и отказ
          # ничего не оставляет полусделанным. Разбор — фрагменты
          # `a-tag-follows-the-commit-that-landed` и `release-atomic-push`.
          # ТЕГ ЧИТАЕТ `version.py`, А НЕ ОБОЛОЧКА (214, #1464): весь вывод
          # `git tag --points-at HEAD` увёл бы в толчок и тег другого рода.
          python $MECHANISMS/scripts/version.py --head-tag >"${RUNNER_TEMP}/head-tag.txt" 2>"${RUNNER_TEMP}/head-tag.err" || {
            echo "::error::Выпуск собран, но тег выпуска на HEAD не прочитан: $(cat "${RUNNER_TEMP}/head-tag.err"). Метить в общей ветке нечего (075)."
            exit 1
          }
          tag="$(cat "${RUNNER_TEMP}/head-tag.txt")"

          # ОТКАЗ АТОМАРНОГО ТОЛЧКА НИЧЕГО НЕ ОСТАВЛЯЕТ, поэтому повтор безопасен:
          # кратковременный отказ площадки выпуск переживает, а не отменяет.
          # Отказ по существу (нет обхода набора правил) повтор не чинит — после
          # трёх заходов он назван, и выпуск повторяется кнопкой.
          pushed=""
          for attempt in 1 2 3; do
            if git push --atomic origin HEAD "${tag}"; then
              pushed="yes"
              break
            fi
            if [ "${attempt}" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          if [ -z "${pushed}" ]; then
            echo "::error::Площадка не приняла толчок выпуска трижды: толчок атомарный, и не доехали ни коммит, ни тег ${tag}. Общая ветка и теги не тронуты, выпуск можно повторить кнопкой. Частая причина — набору правил общей ветки нужен обход для того, кто выпускает (Settings → Rules → Bypass list): коммит выпуска собирается машиной из уже слитых фрагментов, и проверки изменения у него нет."
            exit 1
          fi
          # НОМЕР УЕХАВШЕГО ВЫПУСКА — ВЫХОДОМ ШАГА, ОДИН РАЗ (взгляд на #1488).
          # Шаги хвоста берут его отсюда, а не перечитывают HEAD: подъём своих
          # шагов, не вернувший дерево, оставил бы HEAD на своей ветке, и
          # соседи за ним краснели бы за него.
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # ХВОСТ ВСТАЁТ НА ТЕГ, А НЕ НА ГОЛОВУ ОБЩЕЙ ВЕТКИ (#1448). После выпуска
      # в ветку успевают слиться изменения, и номер с головы был бы чужим.
      # Тег сверяется формой `version.py`: на его коммите должен читаться
      # ровно `v<version>`, иначе хвост довёл бы не тот выпуск.
      # И ТОЛЬКО У ПОСЛЕДНЕГО ВЫПУСКА (взгляд на #1488): хвост старого поднял бы
      # прибивку пробы до его тега, то есть опустил бы её ниже уже выпущенного.
      # Последний выпуск спрашивается до выкачки тега — с головы общей ветки.
      - name: тег выпуска на месте — для хвоста
        id: tagged
        if: inputs.apply && inputs.tail && steps.token.outputs.present == 'yes'
        env:
          ASKED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python $MECHANISMS/scripts/version.py --last-tag >"${RUNNER_TEMP}/last-tag.txt" 2>"${RUNNER_TEMP}/last-tag.err" || {
            echo "::error::Последний выпуск не прочитан: $(cat "${RUNNER_TEMP}/last-tag.err"). Чей хвост доводить, неясно (075)."
            exit 1
          }
          if [ "$(cat "${RUNNER_TEMP}/last-tag.txt")" != "v${ASKED_VERSION}" ]; then
            echo "::error::Хвост доводится только у последнего выпуска — $(cat "${RUNNER_TEMP}/last-tag.txt"), а запрошен v${ASKED_VERSION}: его хвост опустил бы прибивку пробы ниже выпущенного."
            exit 1
          fi
          git checkout --quiet "refs/tags/v${ASKED_VERSION}" 2>"${RUNNER_TEMP}/tail-tag.err" || {
            echo "::error::Хвост выпуска запрошен, а тега v${ASKED_VERSION} нет: $(cat "${RUNNER_TEMP}/tail-tag.err"). Доводить нечего — сперва выпуск (075)."
            exit 1
          }
          python $MECHANISMS/scripts/version.py --head-tag >"${RUNNER_TEMP}/head-tag.txt" 2>"${RUNNER_TEMP}/head-tag.err" || {
            echo "::error::Тег v${ASKED_VERSION} выкачан, но тег выпуска на его коммите не прочитан: $(cat "${RUNNER_TEMP}/head-tag.err") (075)."
            exit 1
          }
          if [ "$(cat "${RUNNER_TEMP}/head-tag.txt")" != "v${ASKED_VERSION}" ]; then
            echo "::error::На коммите тега v${ASKED_VERSION} тегом выпуска читается $(cat "${RUNNER_TEMP}/head-tag.txt") — хвост довёл бы не тот выпуск."
            exit 1
          fi
          # Номер — тем же выходом, что у выпуска: шагам хвоста неважно, кто
          # из двух их пустил.
          echo "version=${ASKED_VERSION}" >> "$GITHUB_OUTPUT"

      # СТРАНИЦА ВЫПУСКА — ПЯТЫЙ ШАГ, И ОН ИДЁТ ПОСЛЕ ТЕГА. Раньше её заводил
      # человек, и площадка наполняла её своим списком изменений вместо нашего
      # журнала. Шаг отдельный: тег к этому моменту уже уехал, и отказ здесь
      # не отменяет выпуска — он говорит, что довести страницу надо кнопкой
      # `--page` (104).
      - name: завести страницу выпуска
        if: inputs.apply && steps.token.outputs.present == 'yes'
        env:
          # Страницу заводит токен ВЛАДЕЛЬЦА: её автор — человек, выпустивший
          # версию, а не приложение (131). `GH_TOKEN` назван тем же секретом:
          # транспорт читает его, и без него механизм пошёл бы к площадке без
          # ключа.
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version || steps.tagged.outputs.version }}
        run: |
          set -uo pipefail
          version="${RELEASE_VERSION:-}"
          if [ -z "${version}" ]; then
            echo "::error::Номер выпуска не назван ни шагом выпуска, ни выкачкой тега — страницу заводить не для чего (075)."
            exit 1
          fi
          rc=0
          python $MECHANISMS/scripts/release.py --page "${version}" --apply || rc=$?

          # Коды разбираются СПИСКОМ РАЗРЕШЁННОГО (068): зелёным считается
          # только объявленный ноль, всё прочее — отказ. «Красным считаем
          # перечисленное» прочитало бы необработанный сбой Python как успех.
          case "$rc" in
            0) ;;
            *)
              echo "::error::Страница выпуска v${version} не заведена (код $rc). Тег и журнал на месте, выпуск повторять НЕ надо: хвост доводится кнопкой выпуска с tail, version ${version} и apply — она пройдёт весь хвост заново (#1448)"
              exit 1
              ;;
          esac

      # ВЫПУСК САМ ПОДНИМАЕТ СВОЮ ПРОБУ (#1387, решение владельца 16.10.2026).
      # Проба передачи зовёт наши шаги по тегу, как потребитель, а Dependabot
      # ссылки репозитория на самого себя не поднимает: замер — сутки после
      # `v1.6.0`, сигнала нет. Подъём идёт веткой `agent/deps-self-<тег>` и
      # обычной очередью, тем же механизмом, что перехват. У потребителя своих
      # шагов по тегу нет, и шаг отвечает «поднимать нечего» — это не отказ.
      # Отказ здесь выпуска НЕ отменяет: тег уже уехал, и он говорит, как
      # довести подъём отдельным заходом.
      #
      # ДЕРЖИТСЯ ИСХОДОМ ВЫПУСКА, А НЕ СОСЕДА: упавшая страница выпуска не
      # отменяет подъёма. Без `!cancelled()` красная страница молча снимала
      # шаг, и проба оставалась на старом теге без единого слова (`62bbf7d`).
      #
      # ТОКЕН НУЖЕН ПОДЪЁМУ, А НЕ ТОЛЬКО ТОЛЧКУ (#1387): подъём привязывается к
      # плану работ проекта, и номер плана спрашивается у площадки по маркеру, а
      # не берётся литералом — у потребителя литерал назвал бы чужую задачу.
      #
      # ПОДПИСЬ ЗДЕСЬ — ВЫПУСКА, А НЕ ВЛАДЕЛЬЦА ТОКЕНА, И ЭТО НАЗВАНО (взгляд на
      # #1492, правило 195). Коммит подъёма подписан тем, кто нажал кнопку
      # выпуска (`github.actor`, шаг «подпись выпуска»), а толкает его токен
      # владельца. У перехвата автор — сам владелец токена
      # (`deps_intercept.identity`). Сейчас это один человек; если выпуск начнёт
      # жать другой участник, подпись подъёма сводится к `identity`.
      - name: поднять свои шаги до выпуска
        if: >-
          !cancelled() &&
          inputs.apply && steps.token.outputs.present == 'yes' &&
          (steps.release.outcome == 'success' || steps.tagged.outcome == 'success')
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version || steps.tagged.outputs.version }}
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          set -uo pipefail
          version="${RELEASE_VERSION:-}"
          if [ -z "${version}" ]; then
            echo "::error::Номер выпуска не назван ни шагом выпуска, ни выкачкой тега — поднимать свои шаги не до чего (075)."
            exit 1
          fi
          rc=0
          python $MECHANISMS/scripts/deps_intercept.py --self "v${version}" --apply || rc=$?
          case "$rc" in
            0) ;;
            *)
              echo "::error::Свои шаги до v${version} не подняты (код $rc). Выпуск сделан и повторять его НЕ надо: хвост доводится кнопкой выпуска с tail, version ${version} и apply — она пройдёт весь хвост заново (#1448)"
              exit 1
              ;;
          esac

      # СМЕНА КОНТРАКТА ОПОВЕЩАЕТ ТЕХ, КОГО КАСАЕТСЯ (#1387, #1586, решения
      # владельца 16.10 и 23.10.2026): мажор вырос — каждому, кто зовёт наши
      # шаги по тегу, уходит задача «A→B, перечитай ответы»; минор вырос — тем
      # из взявших и объявленных, чьё окно `contract:` его не покрывает. Задачу
      # открывает владелец, а не приложение (131), поэтому токен — его. У
      # потребителя шаг отвечает «оповещать некого»: оповещает поставщик.
      # Повтор хвоста второй задачи не заводит — она узнаётся по метке выпуска.
      # Отказ выпуска НЕ отменяет: тег уже уехал. ЧАСТИЧНОЕ — КРАСНОЕ, а не
      # предупреждение (045): зелёный прогон с жёлтой строкой никто не читает,
      # а не оповещённый сосед узнает о мажоре по красному у себя.
      - name: оповестить потребителей о смене контракта
        if: >-
          !cancelled() &&
          inputs.apply && steps.token.outputs.present == 'yes' &&
          (steps.release.outcome == 'success' || steps.tagged.outcome == 'success')
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version || steps.tagged.outputs.version }}
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          set -uo pipefail
          version="${RELEASE_VERSION:-}"
          if [ -z "${version}" ]; then
            echo "::error::Номер выпуска не назван ни шагом выпуска, ни выкачкой тега — судить о смене контракта не по чему (075)."
            exit 1
          fi
          rc=0
          python $MECHANISMS/scripts/breaking_notice.py --tag "v${version}" --apply || rc=$?
          case "$rc" in
            0) ;;
            3)
              echo "::error::Оповещены не все, кого касается v${version} (код 3): кто не прочитан и не оповещён — названо выше. Повтор хвоста кнопкой выпуска с tail, version ${version} и apply дойдёт до остальных, а второй задачи у оповещённых не заведёт (#1448)"
              exit 1
              ;;
            *)
              echo "::error::Потребители о v${version} не оповещены (код $rc). Выпуск сделан и повторять его НЕ надо: хвост доводится кнопкой выпуска с tail, version ${version} и apply — она пройдёт весь хвост заново (#1448)"
              exit 1
              ;;
          esac

      # ГРУППА «ЖДЁТ ВЫПУСКА» РАСПУСКАЕТСЯ ВЫПУСКОМ (решение владельца
      # 16.10.2026, #1433): метка `plan/waits-release` снимается с открытых
      # задач, и они возвращаются в «Сейчас» плана — их остаток, проверка на
      # теге, берётся тем же окном. Метку снимает токен владельца: у токена
      # прогона здесь только чтение задач. Отказ выпуска НЕ отменяет — тег уже
      # уехал; шаг называет, как снять метку отдельным заходом.
      # СНИМАЮТСЯ МЕТКИ ЭТОГО ВЫПУСКА, А НЕ ВСЕ (взгляд на #1488): хвост доводят и
      # через день, а за день метку ставят задачам уже следующего выпуска.
      # Граница — время тега: поставленная позже него метка остаётся.
      # ТЕГ — ВЫХОДОМ ШАГА ВЫПУСКА, А НЕ С HEAD (взгляд на #1488). Шаг идёт после
      # подъёма своих шагов, и подъём, оставивший дерево на своей ветке,
      # делал снятие метки красным за себя — при том что шаг держится исходом
      # выпуска, а не соседа.
      - name: снять метку «ждёт выпуска» с задач плана
        if: >-
          !cancelled() &&
          inputs.apply && steps.token.outputs.present == 'yes' &&
          (steps.release.outcome == 'success' || steps.tagged.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release.outputs.version || steps.tagged.outputs.version }}
        run: |
          set -uo pipefail
          version="${RELEASE_VERSION:-}"
          if [ -z "${version}" ]; then
            echo "::error::Номер выпуска не назван ни шагом выпуска, ни выкачкой тега — граница меток неизвестна (075)."
            exit 1
          fi
          before="$(git for-each-ref --format='%(creatordate:iso-strict)' "refs/tags/v${version}")"
          if [ -z "${before}" ]; then
            echo "::error::Время тега v${version} не прочитано — граница меток неизвестна (075)."
            exit 1
          fi
          rc=0
          python $MECHANISMS/scripts/work_plan.py --released --before "${before}" --repo "${GITHUB_REPOSITORY}" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Метка plan/waits-release не снята (код $rc). Выпуск сделан и повторять его НЕ надо: хвост доводится кнопкой выпуска с tail, номером выпуска и apply — она пройдёт весь хвост заново (#1448)"
            exit 1
          fi

      - name: выпуск не сделан — сказано, а не пропущено
        if: inputs.apply && steps.token.outputs.present != 'yes'
        run: |
          echo "::error::Выпуск запрошен, но MERGE_QUEUE_TOKEN не задан: тег несёт личность человека, и токеном прогона его ставить нельзя."
          exit 1
