# Шаг 7 скелета: сводный гейт — ЕДИНСТВЕННЫЙ обязательный контекст защиты ветки.
#
# ПОЧЕМУ ОТДЕЛЬНЫМ ФАЙЛОМ, А НЕ ДЖОБОМ В `ci.yml`. У `ci` группа отмены
# `cancel-in-progress: true`, и она гасит ВЕСЬ прогон целиком — вместе со
# сводным гейтом. Отменённая запись слияния не держит, но и зелёной не
# является: на голове остаётся `cancelled` там, где защита ветки ждёт вердикт.
# Замер 10.09.2026: #105 получил красный обязательный контекст при полностью
# зелёных проверках, а #160 простоял с отменённым сводным до ручного захода.
#
# Отдельный прогон отменяется СВОЕЙ группой, по своей голове, и гаснет только
# от собственного более нового захода. Гейты при этом продолжают жить в `ci`:
# сюда переехал только тот, чьё имя стоит в защите.
#
# ИМЯ ДЖОБА И ЕСТЬ ИМЯ КОНТЕКСТА, и оно НЕ МЕНЯЕТСЯ переездом: `ci-complete`
# как было, так и осталось. Переименование сломало бы настройку защиты ветки,
# которая живёт вне дерева и которую не видит ни ревью, ни прогон (168).
# Совпадение имени с настройкой держит `scripts/check_required_context.py`.
#
# `needs` здесь нет и быть не может: агрегатор на зависимостях при падении
# соседа не краснеет, а ПРОПУСКАЕТСЯ, — а пропущенную запись защита ветки
# засчитывает за пройденную (168, 187). Гейт сам спрашивает у площадки записи
# на голове.
name: ci-complete

on:
  pull_request:
    # Те же типы, что у `ci`: разметка — вход механизма, и её правка обязана
    # менять вердикт. `edited` — потому что связь с задачей живёт в теле.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  # СВОЯ группа, а не `ci`. В этом весь переезд: гаснуть сводный гейт обязан
  # только от собственного более нового захода на той же голове, а не от того,
  # что кто-то толкнул новый коммит в соседний прогон.
  #
  # Голова названа в имени (правило 179): иначе последнее слово осталось бы за
  # заходом на устаревшем коммите.
  group: ci-complete-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  ci-complete:
    # Имя джоба совпадает с идентификатором намеренно: расхождение между ними
    # оставило бы в защите имя, которого никто не выдаёт.
    name: ci-complete
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "pyyaml>=6,<7"
      - name: опросить проверки на голове
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # СВОДИМЫЙ ПРОГОН ИЩЕТСЯ ПО ГОЛОВЕ, А НЕ БЕРЁТСЯ ИЗ ОКРУЖЕНИЯ. Пока
        # гейт был джобом внутри `ci`, `GITHUB_RUN_ID` и был номером сводимого
        # прогона. Здесь он номер ЭТОГО прогона и не принадлежит ни одному
        # соседу — а на нём держались оба различия разбора гонки: предпочтение
        # записей сводимого прогона и «джоб ждёт `needs`, а не не стартовал».
        # Имя сводимого — умолчание `--summarises`, и оно же `ci`.
        #
        # НАПОЛНЕНИЕ ОПРОСА ПРИХОДИТ ИЗ ДАННЫХ, А НЕ ИЗ ЭТОГО ФАЙЛА. Класс
        # каждой проверки объявлен в `.pipeline.yml`: обязательная держит
        # слияние, совещательная нет. Список именами здесь означал бы, что
        # класс проверки — свойство механизма, а он свойство проекта (174).
        #
        # ВЫВОД УХОДИТ В АННОТАЦИЮ И СВОДКУ, А НЕ ТОЛЬКО В ЛОГ. Лог прогона
        # читается не из всякого окна — облачному хранилище закрыто, — и от
        # красного там остаётся код возврата, по которому не разобрать ничего.
        # Аннотацию и сводку джоба отдаёт REST, и разбор гонки становится
        # возможен задним числом (#261).
        run: |
          set -uo pipefail
          rc=0
          python scripts/ci_complete.py \
            --policy .pipeline.yml \
            --self-name "ci-complete" > "${RUNNER_TEMP}/verdict.txt" 2>&1 || rc=$?
          cat "${RUNNER_TEMP}/verdict.txt"
          {
            echo "### ci-complete: вердикт ${rc}"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/verdict.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          # Аннотация одной строкой: переводы строк в ней экранируются, иначе
          # площадка обрежет сообщение первой же из них.
          said="$(sed -z 's/\n/%0A/g' "${RUNNER_TEMP}/verdict.txt")"
          # ЗЕЛЁНЫМИ СЧИТАЮТСЯ ТОЛЬКО ОБЪЯВЛЕННЫЕ КОДЫ (068): необработанный
          # сбой Python отдаёт единицу, и «красным считаем перечисленное»
          # прочитало бы её как объявленное состояние.
          case "$rc" in
            0) echo "все объявленные проверки на голове пройдены" ;;
            1) echo "::error::сводный гейт: красно%0A${said}" ;;
            2) echo "::error::сводный гейт: опрос не отработал%0A${said}" ;;
            *) echo "::error::сводный гейт: код ${rc} не объявлен — разбирать нечем%0A${said}"
               rc=2 ;;
          esac
          exit "${rc}"
