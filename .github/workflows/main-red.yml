# Шаг 9 скелета: красная общая ветка (docs/pipeline.md, контур 3 договора).
#
# Контур 3 был описан договором и не построен ничем: красноту видел человек.
# Здесь появляется его первая половина — счёт красных на голове, перезапуск
# ОДНОГО и запись того, что осталось. Разморозка (шаг 10) и дежурство по
# срокам — отдельная работа.
#
# СОБЫТИЕ, А НЕ РАСПИСАНИЕ (011). Прогон гейтов на общей ветке завершился —
# это и есть момент, когда о её здоровье известно всё. Расписание здесь
# добавило бы опрос там, где есть событие, и наблюдение — предмет службы, а не
# площадки (docs/decisions/004).
#
# ПРАВА `actions: write` НУЖНЫ ИМЕННО ЗДЕСЬ и только здесь: перезапуск упавшего
# джоба — единственное действие конвейера, которому они требуются. У окна их
# нет, и это не пробел, а граница (131).
#
# ПЕРЕЗАПУСК — РОВНО ОДИН, И ЗЕЛЁНОЕ СО ВТОРОГО РАЗА ЭТО НАХОДКА (124).
# Механизм не «чинит перезапуском»: он различает мигание и дефект и записывает
# и то, и другое.
name: main-red

on:
  workflow_run:
    # ЖДЁМ И ШАГ ЗНАЧКОВ, А НЕ ТОЛЬКО ГЕЙТЫ. Его красное на общей ветке дежурный
    # видел лишь при следующем слиянии — то есть перезапускать было уже поздно, и
    # 15.09.2026 владелец перезапустил шаг рукой. Теперь заход дежурного будит и
    # он: одиночное совещательное красное из разрешённого списка перезапускается
    # один раз (решение 025).
    workflows: [ci, badges]
    types: [completed]
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  # Перезапуск упавшего джоба — единственное, ради чего это право здесь.
  actions: write
  # Краснота получает адресата, переживающего прогон: задачу (142).
  issues: write

concurrency:
  # Предмет один на репозиторий — здоровье общей ветки, поэтому и группа одна.
  # Вытеснять заход нечем: он пишет состояние, а не гонится за свежестью.
  group: main-red
  cancel-in-progress: false

jobs:
  main-red:
    name: main-red
    # Только общая ветка: у изменения своё красное — это источник 2, и с ним
    # работает его автор, а не дежурный по общей ветке.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # ЗАКРЕПЛЕНО ПО SHA, ПОТОМУ ЧТО ВЫЗЫВАЮЩИЙ БЕРЁТСЯ С ОБЩЕЙ ВЕТКИ. На
      # `workflow_run` площадка берёт файл прогона с `main`, а не из изменения:
      # значит вызываемое обязано быть закреплено, иначе подвижная метка меняет
      # исполняемый код без нашего ведома
      # ([152](https://github.com/ArtVsMark/Engineering-Incidents-Playbook/blob/main/rules/ru/152-pinning-callee-without-caller.md)).
      # На `pull_request` рассуждение обратное — там файл прогона правит тот же,
      # кто правит изменение, и закрепление ничего не добавляет.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Шаг читает ответ по классам проверок, а тот разбирает YAML. Без этой
      # строки шаг падал бы на импорте — ДО входа в скрипт — и свой третий
      # исход выдать не мог.
      - name: поставить разбор состава
        run: python -m pip install --quiet "pyyaml>=6,<7" ./packages/transport

      - name: разобрать красноту общей ветки
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          rc=0
          # ПРИЧИНА ОТКАЗА ЕДЕТ В ЗАПИСЬ ПРОВЕРКИ, А НЕ ОСТАЁТСЯ В ЛОГЕ.
          # «Смотрите вывод выше» читается только тем, у кого есть доступ к логу
          # прогона; у части окон его нет, и разбор красного дежурного
          # превращался в угадывание (142). ЗАМЕР 16.09.2026: заход 10:42:42 упал
          # кодом 2 на ТОЙ ЖЕ голове, где заход 10:42:11 прошёл, — и причина
          # осталась неизвестной, потому что аннотация несла только номер кода.
          #
          # Приём тот же, что у шага `required-context`: один способ на проект,
          # иначе второй разошёлся бы с первым молча (090). Переводы строк в
          # аннотации заменяются пробелами — площадка держит её одной строкой.
          said="${RUNNER_TEMP}/said.txt"
          python scripts/main_red.py --apply >"$said" 2>&1 || rc=$?
          cat "$said"
          reason="$(tr '\n' ' ' <"$said")"

          # Коды разбираются списком РАЗРЕШЁННОГО (068): зелёными считаются
          # только объявленные, всё прочее — отказ.
          case "$rc" in
            0) echo "общая ветка зелена — записывать нечего" ;;
            3) echo "краснота записана: держащее слияние в источник 0, прочее в источник 3" ;;
            *)
              echo "::error::Шаг разбора красноты не отработал (код $rc): ${reason}"
              exit 1
              ;;
          esac
          exit 0
