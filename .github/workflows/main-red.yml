# Шаг 9 скелета: красная общая ветка (docs/use/pipeline.md, контур 3 договора).
#
# Контур 3 был описан договором и не построен ничем: красноту видел человек.
# Здесь появляется его первая половина — счёт красных на голове, перезапуск
# ОДНОГО и запись того, что осталось. Разморозка (шаг 10) и дежурство по
# срокам — отдельная работа.
#
# СОБЫТИЕ, А НЕ РАСПИСАНИЕ (011). Прогон гейтов на общей ветке завершился —
# это и есть момент, когда о её здоровье известно всё. Расписание здесь
# добавило бы опрос там, где есть событие, и наблюдение — предмет службы, а не
# площадки (docs/decisions/004).
#
# ПРАВА `actions: write` НУЖНЫ ИМЕННО ЗДЕСЬ и только здесь: перезапуск упавшего
# джоба — единственное действие конвейера, которому они требуются. У окна их
# нет, и это не пробел, а граница (131).
#
# ПЕРЕЗАПУСК — РОВНО ОДИН, И ЗЕЛЁНОЕ СО ВТОРОГО РАЗА ЭТО НАХОДКА (124).
# Механизм не «чинит перезапуском»: он различает мигание и дефект и записывает
# и то, и другое.
name: main-red

on:
  workflow_run:
    # ЖДЁМ И ШАГ ЗНАЧКОВ, А НЕ ТОЛЬКО ГЕЙТЫ. Его красное на общей ветке дежурный
    # видел лишь при следующем слиянии — то есть перезапускать было уже поздно, и
    # 15.09.2026 владелец перезапустил шаг рукой. Теперь заход дежурного будит и
    # он: одиночное совещательное красное из разрешённого списка перезапускается
    # один раз (решение 025).
    #
    # БУДИТ КАЖДЫЙ ПРОГОН, ЧЬЁ КРАСНОЕ АДРЕСОВАНО ДЕЖУРНОМУ, а не два избранных.
    # Дежурный читает записи головы в миг захода: прогон, закончившийся позже
    # и его не будящий, остаётся невидим до следующего слияния, а по
    # расписанию — вовсе. Список выводится из ответа (`addressee:
    # scripts/main_red.py` в `.pipeline.yml`), и держит его
    # `tests/test_main_red.py::test_every_run_addressed_to_the_duty_wakes_it`
    # (взгляд на #1029: предрелизная `python-next`, и давние соседи того же
    # рода — `attribution-history`, `labels-sync`).
    #
    # ЦЕНА НАБЛЮДЕНА НА ОДНОМ СЛИЯНИИ, А НЕ ВЫВЕДЕНА (058, 107). Слияние #1040
    # (голова `bcc6b5c`, 02.10.2026), заходы 12809–12825 по списку прогонов
    # `main-red`: всего 17, работу сделали 3 (`success`), 4 сняты группой, 10
    # пропущены условием джоба — он не запускался, и наш код вызовов к
    # площадке не делал. Платят вызовами API только заходы с работой, а не
    # каждое будящее событие. Сколько их на другом слиянии — зависит от того,
    # какие из пяти прогонов шли на голове и сколько заходов сняла группа;
    # «три» — число этого слияния, а не цена вообще.
    workflows: [ci, badges, python-next, attribution-history, labels-sync]
    types: [completed]
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  # Перезапуск упавшего джоба — единственное, ради чего это право здесь.
  actions: write
  # Краснота получает адресата, переживающего прогон: задачу (142).
  issues: write

concurrency:
  # Предмет один на репозиторий — здоровье общей ветки, поэтому и группа одна.
  # Вытеснять заход нечем: он пишет состояние, а не гонится за свежестью.
  group: main-red
  cancel-in-progress: false

jobs:
  # ТОНКИЙ ВЫЗОВ (#993): разбор красноты — общим шагом `step-main-red.yml`,
  # здесь только то, что решает проект, — когда заходить, по какой ветке и
  # один ли заход. Код конвейера шаг берёт своим checkout на коммите вызова
  # (#990), поэтому потребитель зовёт его адресом с тегом, а не копирует.
  main-red:
    # Только общая ветка: у изменения своё красное — это источник 2, и с ним
    # работает его автор, а не дежурный по общей ветке.
    #
    # УСЛОВИЕ СТОИТ У ВЫЗЫВАЮЩЕГО, А НЕ В ШАГЕ. Какое событие предмет — решение
    # проекта, как и сами события; и отсеянное здесь шага не зовёт вовсе:
    # заход без работы вызовов к площадке не делает, как и прежде.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == 'main'
    uses: ./.github/workflows/step-main-red.yml
