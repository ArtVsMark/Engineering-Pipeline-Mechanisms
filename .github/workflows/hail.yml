# Оклик: вердикт находит окно, которое его заработало (шаг 8c договора).
#
# ПОЧЕМУ ПО ЗАВЕРШЕНИИ `ci`, А НЕ НА СОБЫТИИ ИЗМЕНЕНИЯ. Оба рода состояния
# известны только после прогона: «своё красное» — это исход обязательных
# проверок на голове, а конфликт площадка считает лениво и к моменту открытия
# изменения ещё не знает. Заход на `pull_request` окликал бы про состояние,
# которого ещё нет.
#
# ЗАХОД ИДЁТ ПО ВСЕМ ЖИВЫМ ИЗМЕНЕНИЯМ, А НЕ ПО ОДНОМУ. Конфликт у соседа
# появляется не от его собственного прогона, а от ЧУЖОГО слияния: событие
# приходит к тому, кто слился, а состояние меняется у того, кто нет.
#
# ТОКЕН ПРОГОНА, А НЕ ВЛАДЕЛЬЦА. Оклик — комментарий-след, он ничего не сливает
# и ничьей личности не несёт: `github.token` здесь достаточно, а токен
# владельца дал бы шагу право, которого его предмет не требует.
name: hail

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  # ЗАМКНУТЫЙ КРУГ, НАЙДЕННЫЙ ПРОГОНОМ. У конфликтного изменения ссылки слияния
  # НЕТ — площадке нечего собрать, — и `ci` на нём не стартует вовсе. Значит
  # оклик про конфликт не может прийти по прогону того самого изменения, у
  # которого конфликт: сработал бы только чужой прогон, а при пустой очереди
  # чужого нет. Замер 11.09.2026, изменение #217: конфликт налицо, записей
  # проверок на голове одна — `agent-pr`, и та от толчка ветки.
  #
  # Поэтому у оклика есть ВТОРОЙ путь, не зависящий от чужой работы. События
  # теряются, и это не поломка, а свойство
  # ([104](https://github.com/ArtVsMark/Engineering-Incidents-Playbook/blob/main/rules/ru/104-event-driven-automation-needs-a-manual-button.md)).
  schedule:
    # Каждый час: конфликт — штатный источник работы, и сутки его не ждут.
    - cron: "17 * * * *"
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  # Комментарий к изменению — это комментарий к задаче у площадки.
  issues: write
  pull-requests: read
  checks: read

concurrency:
  # Один заход на репозиторий: оклики пишутся в общий ресурс — ленты изменений,
  # — и два захода подряд поставили бы два оклика про одно состояние, каждый не
  # увидев чужого (149).
  group: hail
  cancel-in-progress: false

jobs:
  hail:
    name: hail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "pyyaml>=6,<7"
      - name: вердикт находит окно
        # Отказ оклика не роняет ничего: это след, а не условие работы (084).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          rc=0
          python scripts/hail.py --apply || rc=$?
          case "$rc" in
            0) echo "заход отработал" ;;
            3) echo "::warning::оклик не настроен — нет токена" ;;
            *) echo "::warning::оклик не отработал (код $rc) — состояние осталось без адресата" ;;
          esac
