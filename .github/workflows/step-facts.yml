# ПЕРЕИСПОЛЬЗУЕМЫЙ ПРОГОН: общий шаг, который зовут, а не запускают.
#
# Тело переехало из прогона, который его исполнял, ЦЕЛИКОМ — у шагов конвейера
# из `ci.yml`, у управляющих механизмов из их собственного прогона, — и при
# переезде менялся адрес, а не поведение: иначе перевод и починку нельзя было
# бы отличить друг от друга. Код конвейера шаг с тех пор берёт своим checkout
# (#990) — это сказано в его блоке кода, а не здесь.
#
# ОТДАЁТСЯ НАРУЖУ: потребитель зовёт этот файл адресом с версией, к которой он
# прибит (157), а не копией у себя. Почему копия — беда, с замером копий по
# проектам семьи, — в договоре, docs/use/pipeline.md (022).
#
# ИМЯ ЗАПИСИ ПРОВЕРКИ У ВЫЗВАННОГО ДЖОБА СОСТАВНОЕ — «<имя вызывающего> / <имя
# вызванного>». Замер прогоном на живой площадке (изменение #549), а не по
# документации: из окна она недоступна (139).
#
# ДУБЛЬ ЭТОЙ ШАПКИ НАМЕРЕННЫЙ, И ЭТО СКАЗАНО, А НЕ УМОЛЧАНО (071). Площадка
# требует от переиспользуемого прогона ОТДЕЛЬНОГО ФАЙЛА: вынести пояснение в
# общее место нечем — комментарий не подключается, а сам прогон зовут по адресу
# файла. Цена названа: правка пояснения идёт по всем файлам разом, и расходятся
# они молча. Держит их от расхождения не внимание, а прогон
# `tests/test_reusable_steps.py`.
name: step-facts

# ОБЩИЙ ИЗДАТЕЛЬ ФАКТОВ СЕМЬИ (#1001, шаг 2; решения владельца 04.10 и
# 06.10.2026). Генератор `facts.json` был у каждого проекта свой, и они
# разъехались: 20 расхождений с договором витрины (замер 01.10.2026). Здесь
# сборка одна — `scripts/facts_common.py`: общие показатели шаг выводит из
# дерева сам, свои числа проект отдаёт файлом `extra-facts.json`, и до
# публикации файл сверяется со схемой витрины.
#
# ПУБЛИКАЦИЯ — КОММИТОМ ПОВЕРХ ВЕТКИ `badges`, А НЕ ПЕРЕЗАПИСЬЮ (вариант 1
# решения 06.10.2026). Шаг кладёт только `.github/badges/facts.json` и значок
# проекта `project.svg`, нарисованный по ним (#1282), — перечень
# `publish_facts.PUBLISHES` — и не трогает остального: свои значки и файлы потребителя на ветке живут.
# ЭТИ ДВА ИМЕНИ ЗАНЯТЫ ШАГОМ: свой файл потребителя с таким же путём шаг
# перезапишет. Других путей он не касается (взгляд на #1327). Цена
# названа: ветка копит историю производного — вреда не несёт, ценности тоже.
#
# УПРАВЛЯЮЩИЙ МЕХАНИЗМ, А НЕ ШАГ КОНВЕЙЕРА: пишет в ветку и зовётся своим
# прогоном потребителя (у нас — `badges.yml`), а не джобом `ci.yml` на
# изменении. Поэтому проба передачи его не зовёт: опубликовала бы факты
# этого репозитория (#993).

on:
  workflow_call:
    inputs:
      ci-workflow:
        description: файл прогона CI проекта — витрина спрашивает его статус по имени
        type: string
        default: ci.yml
      python-matrix:
        description: матрица версий Python — «<файл прогона>:<джоб>»; пусто — причина в none
        type: string
        default: ""
      python-next:
        description: матрица пробных версий Python — «<файл прогона>:<джоб>»
        type: string
        default: ""
      inputs-artifact:
        description: артефакт этого прогона с extra-facts.json и coverage.json; пусто — без них
        type: string
        default: ""
      publish:
        description: класть ли facts.json и project.svg на ветку badges; false — собрать, сверить и нарисовать значок, ничего не публикуя
        type: boolean
        default: true
      # АРХИВ НАХОДОК — ВХОДОМ ЭТОГО ШАГА, А НЕ ОТДЕЛЬНЫМ ШАГОМ (#1414, решение
      # владельца 16.10.2026). В ветку `badges` пишет один шаг одним коммитом:
      # второй писатель заставил бы потребителя повторять нашу связку —
      # `needs` и общую очередь, — а ошибка в ней дала бы гонку толчков. По
      # архиву ищут новые роды находок и правила, поэтому он нужен и
      # потребителю, ведущему взгляд. Без взгляда вход не нужен: по умолчанию
      # он выключен.
      archive:
        description: дописать архив находок взгляда и положить его тем же коммитом, что факты
        type: boolean
        default: false
      archive-reread:
        description: перечитать снятия учтённых изменений из истории общей ветки (#820)
        type: boolean
        default: false
      # ВХОД ТОЛЬКО ДЛЯ ПРОБЫ ПЕРЕНОСА (#990): стереть `scripts/`, `packages/`
      # и `tests/` из дерева вызывающего после того, как код конвейера взят
      # своим checkout. Цена названа владельцем при выборе: у договора шага
      # появляется вход, которого потребитель не задаёт.
      strip-ours:
        description: проба переноса — стереть наш код из дерева вызывающего
        type: boolean
        default: false

# Потолок прав: большего шаг не получит, даже если вызывающий даст больше.
# Запись — ради одной ветки `badges`; чтение действий — ради артефакта входа;
# чтение изменений и задач — ради архива находок: он читает ленты слитых
# изменений и живой реестр (#1414). Без входа `archive` шаг ими не пользуется,
# НО ВЫДАТЬ ИХ ОБЯЗАН КАЖДЫЙ ВЫЗЫВАЮЩИЙ (взгляд на #1423): площадка не даёт
# вызванному прогону прав больше, чем у вызова, и вызов без `pull-requests:
# read` и `issues: read` отвергается целиком, с входом и без. Сделать права
# условными по входу площадка не даёт; заготовка `onboard` их выдаёт.
permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: read

jobs:
  facts:
    name: facts
    runs-on: ubuntu-26.04
    # Сумма двух прежних пределов: факты и архив шли разными джобами по 10
    # минут каждый, а теперь идут одним (#1414).
    timeout-minutes: 20
    steps:
      # Теги нужны версии и выпуску: без них число головы правдоподобно и ложно.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      # КОД КОНВЕЙЕРА — СВОИМ CHECKOUT, А НЕ ИЗ ДЕРЕВА ВЫЗЫВАЮЩЕГО (#990). У
      # потребителя нашего `scripts/` нет: дерево вызывающего — ЕГО, и в нём
      # только данные. Репозиторий и коммит — того файла, который позвали
      # (`job.workflow_repository`, `job.workflow_sha`), поэтому прибивка
      # вызова к тегу прибивает и код, а адрес поставщика буквами не пишется.
      # Замер прогоном 01.10.2026 (#997): `github.job_workflow_sha` у
      # вызванного шага пуст, `job.workflow_sha` — коммит вызванного файла.
      # Пустой коммит не подменяется веткой по умолчанию молча (045).
      # ДУБЛЬ ЭТОГО БЛОКА НАМЕРЕННЫЙ (071): площадка не подключает шаги внутрь
      # шага, и блок стоит в каждом общем шаге, зовущем наш код. Совпадение
      # блоков держит `tests/test_reusable_steps.py::test_the_code_block_is_one_in_every_step`.
      - name: коммит и репозиторий вызова названы
        env:
          AT: ${{ job.workflow_sha }}
          FROM: ${{ job.workflow_repository }}
        run: |
          if [ -z "$AT" ]; then
            echo "::error::коммит вызова шага не назван — код конвейера не взят (045)"
            exit 1
          fi
          # Пустой репозиторий checkout молча заменил бы деревом вызывающего.
          if [ -z "$FROM" ]; then
            echo "::error::репозиторий вызова шага не назван — checkout взял бы дерево вызывающего (045)"
            exit 1
          fi
      - name: код конвейера — на коммите вызова
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-mechanisms
          persist-credentials: false
      # Из рабочего дерева код уносится: обходы по дереву потребителя видят
      # только его файлы, а не наши.
      - name: унести код конвейера из дерева потребителя
        env:
          STRIP_OURS: ${{ inputs.strip-ours }}
          FROM: ${{ job.workflow_repository }}
          CALLER: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          mv .pipeline-mechanisms "$RUNNER_TEMP/mechanisms"
          # ПРОБА ПЕРЕНОСА (#990, решение владельца 04.10.2026): со входом
          # `strip-ours` дерево вызывающего лишается нашего кода, и шаг обязан
          # завестись тем, что взял своим checkout. СТИРАЕТСЯ ПО ИМЕНАМ ПАПОК,
          # и у соседа под ними лежит его собственный код. Поэтому стирание
          # идёт, только когда вызывающий прогон — проба передачи
          # `handover-probe.yml` (ответ `ours`: у потребителя её нет) и шаг взят
          # из того же репозитория. Сверки репозиториев одной мало: копию шага
          # у потребителя (`uses: ./…`) площадка тоже считает «своей»
          # (взгляды на #1113, #1118). Форк поставщика с той же пробой — его
          # законный случай: у форка под этими папками наш же код.
          if [ "$STRIP_OURS" = "true" ]; then
            case "$CALLER" in
              */.github/workflows/handover-probe.yml@*) ;;
              *)
                echo "::error::Вход strip-ours — только для пробы передачи handover-probe.yml; здесь зовёт ${CALLER}, и стирать своё нельзя"
                exit 1
                ;;
            esac
            if [ "${GITHUB_REPOSITORY,,}" != "${FROM,,}" ]; then
              echo "::error::Вход strip-ours — только для пробы в репозитории поставщика ${FROM}; здесь ${GITHUB_REPOSITORY}, и стирать нечего своего"
              exit 1
            fi
            rm -rf scripts packages tests
          fi
          echo "MECHANISMS=$RUNNER_TEMP/mechanisms" >>"$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Общий низ конвейера ставится пакетом (024).
      - run: python -m pip install --quiet $MECHANISMS/packages/transport
      - run: python -m pip install --quiet "pyyaml>=6,<7"
      # Артефакта нет — не отказ, а названное: свои числа проекта не влиты, и
      # их показатели уходят причинами в `none` (заготовка потребителя зовёт
      # шаг и без своего джоба входов, #1001).
      - name: взять входы проекта
        id: given
        if: inputs.inputs-artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.inputs-artifact }}
          path: ${{ runner.temp }}/facts-in
      - name: собрать факты
        env:
          GIVEN: ${{ steps.given.outcome }}
          ARTIFACT: ${{ inputs.inputs-artifact }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          PYTHON_MATRIX: ${{ inputs.python-matrix }}
          PYTHON_NEXT: ${{ inputs.python-next }}
          # Поставщик — тот, чей код шаг выкачал: «взятыми» считаются ответы,
          # чей `origin` ведёт к нему, и имя буквами не пишется (#1282).
          SUPPLIER: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          if [ "$GIVEN" = "failure" ]; then
            echo "::warning::Артефакт входов «$ARTIFACT» не взят — свои числа проекта не влиты, их показатели уйдут причинами в none."
          fi
          given="$RUNNER_TEMP/facts-in"
          args=()
          if [ -f "$given/extra-facts.json" ]; then args+=(--extra "$given/extra-facts.json"); fi
          if [ -f "$given/coverage.json" ]; then args+=(--coverage "$given/coverage.json"); fi
          python $MECHANISMS/scripts/facts_common.py \
            --root . \
            --out "$RUNNER_TEMP/facts/facts.json" \
            --sha "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --ci-workflow "$CI_WORKFLOW" \
            --python-matrix "$PYTHON_MATRIX" \
            --python-next "$PYTHON_NEXT" \
            --supplier "$SUPPLIER" \
            "${args[@]}"
      # СВЕРКА С ДОГОВОРОМ ВИТРИНЫ ДО ПУБЛИКАЦИИ — ЕЁ ЖЕ ПРОВЕРКОЙ, ПО ТЕГУ
      # (#1337, договор фактов 1.6). Своей копии проверки нет: витрина отдаёт
      # `check_facts.py`, схему и номер договора файлами выпуска, и издатель
      # гоняет ровно то, чем витрина судит его (её «Шаг для CI издателя»).
      # Тег — `facts_common.CONTRACT_TAG`, рядом с номером формы `SCHEMA`;
      # что они сходятся, держит тест.
      #
      # ОСТАНАВЛИВАЮТ ДВА ИСХОДА: расхождения с договором и файлы выпуска не
      # те, что прибиты. Сбой самой проверки и недоступный выпуск —
      # предупреждение: это не отказ по договору, и публикация идёт без
      # сверки (039).
      #
      # ЧУЖОЙ КОД ИСПОЛНЯЕТСЯ ТОЛЬКО ПО ХЕШУ (взгляд на #1348). Файл выпуска
      # под тегом заменяем, а джоб держит право записи: файлы сверяются с
      # sha256, прибитыми здесь вместе с тегом, и несовпадение — отказ, а не
      # исполнение. Подъём договора — тег и три хеша одной правкой.
      #
      # ВЕРДИКТ — СТРОКА ПРОВЕРКИ, А НЕ ОДИН КОД (взгляд на #1348, как #1116):
      # код 1 даёт и трассировка. Останавливает публикацию код 1 вместе со
      # строкой «<repo>: расхождений N», которую `check_facts.py --file`
      # печатает на расхождениях; код 1 без неё — сбой проверки, предупреждение.
      - name: сверить факты с договором витрины
        env:
          FACTS_CONTRACT: facts-v1.6.0
          # Выпуски витрины семьи — адресом репозитория, а не именем (194).
          RELEASES: https://github.com/ArtVsMark/ArtVsMark/releases/download
          FACTS_SHA256: |
            65d5bffd86a954e825b68ab89315c420c947c31b4de609628f29930993d1924d  check_facts.py
            fbfa6564cce767aff0ab9d753e6a085af3966a5a922fa186fb839b5c8bdb7684  facts.schema.json
            cb1d9a30bc4ab8a397f39b7d786bb82aca0b816077eefc35d7c822017d75f6a5  facts.version
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/facts-contract"
          mkdir -p "$dir"
          for f in check_facts.py facts.schema.json facts.version; do
            if ! curl -fsSL --retry 2 -o "$dir/$f" \
              "$RELEASES/$FACTS_CONTRACT/$f"; then
              echo "::warning::Факты не сверены с договором витрины: $f выпуска $FACTS_CONTRACT не скачан — публикация идёт без сверки."
              exit 0
            fi
          done
          if ! (cd "$dir" && printf '%s\n' "$FACTS_SHA256" | sha256sum --check --strict --quiet -); then
            echo "::error::Файлы выпуска $FACTS_CONTRACT не сходятся с прибитыми хешами — чужой код не исполняется, публикация остановлена."
            exit 1
          fi
          rc=0
          said="$RUNNER_TEMP/facts-verdict.txt"
          python "$dir/check_facts.py" --file "$RUNNER_TEMP/facts/facts.json" --repo "$GITHUB_REPOSITORY" >"$said" 2>&1 || rc=$?
          cat "$said"
          case "$rc" in
            0) ;;
            1)
              if grep -q "^$GITHUB_REPOSITORY: расхождений " "$said"; then
                exit 1
              fi
              echo "::warning::Факты не сверены с договором витрины: проверка не отработала (код 1 без строки о расхождениях — трассировка) — публикация идёт без сверки."
              ;;
            *)
              echo "::warning::Факты не сверены с договором витрины: проверка не отработала (код $rc) — публикация идёт без сверки."
              ;;
          esac
      # ЗНАЧОК ПРОЕКТА — ПО ТЕМ ЖЕ ФАКТАМ, ЧТО УЙДУТ НА ВЕТКУ (#1282, решение
      # владельца 12.10.2026). Рисует его наша сборка в режиме «только
      # картинки»: у потребителя в фактах нет наших разделов, и значок их
      # называет «не прочитано», а не падает. Кладётся рядом с `facts.json` —
      # публикация берёт оба оттуда одним коммитом.
      #
      # ИДЁТ И ПРИ `publish: false`, И ЭТО НАЗВАНО В ОПИСАНИИ ВХОДА (взгляд на
      # #1327, `ad9afba`): сухой заход проверяет, что значок рисуется по этим
      # фактам, — иначе поломка рисования всплыла бы только на публикации.
      #
      # ОТВЕТ КАТАЛОГУ — ИЗ ДЕРЕВА, А НЕ ИЗ ФАКТОВ (договор фактов 1.6, #1337):
      # раздела `rules` в опубликованных фактах нет — доли считает каталог, —
      # и зону «механизмы» картинка считает по ответу в дереве потребителя,
      # тем же кодом, что считал его раньше (`facts_common.rules_said`).
      - name: нарисовать значок проекта по фактам
        env:
          SUPPLIER: ${{ job.workflow_repository }}
        run: >-
          python $MECHANISMS/scripts/build_facts.py
          --from-facts "$RUNNER_TEMP/facts/facts.json" --pictures-out "$RUNNER_TEMP/facts"
          --root . --supplier "$SUPPLIER"
      - name: дописать архив находок
        id: archive
        if: inputs.archive
        env:
          GH_TOKEN: ${{ github.token }}
          # Кнопка перечитки идёт окружением, а не подстановкой в текст команды (085).
          REREAD: ${{ inputs.archive-reread }}
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/facts/findings.json"
          prev="${RUNNER_TEMP}/findings-prev.json"
          args=()
          # Перечитка — только по кнопке: история читается целиком, и на каждом
          # толчке в main она не нужна (#820).
          # ОБЩАЯ ВЕТКА — `main` БУКВАМИ, И ЭТО ДОГОВОР, А НЕ НЕДОСМОТР (взгляд на
          # #1423): механизмы работают только с общей веткой `main`
          # (`paths.TRUNK`), и `onboard` дерево с другой общей веткой не
          # подключает (#1220). Потребитель с иной общей веткой сюда не доходит.
          # История для архива всегда читается у origin/main (`TRUNK_REF`), а не
          # у ветки кнопки. Страж держит СМЫСЛ кнопки: перечитка обещает историю
          # main, и нажатая с другой ветки она путала бы читателя (#849, #882).
          if [ "${REREAD:-}" = "true" ]; then
            if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
              echo "::error::перечитка читает историю main, а кнопка нажата на ${GITHUB_REF:-?} — останавливаю"
              exit 1
            fi
            args+=(--reread)
          fi
          if git fetch --quiet origin badges; then
            # «ФАЙЛА НЕТ» И «ФАЙЛ НЕ ПРОЧИТАН» — ТА ЖЕ РАЗВИЛКА, ЧТО У ВЕТКИ НИЖЕ.
            # Отказ `git show` не говорит, какой из двух: прежняя редакция
            # читала любой как «архива нет» и собирала его с нуля поверх
            # истории (взгляд на #791). Отсутствие называет `ls-tree` пустым
            # ответом, а сбой — кодом.
            listed=0
            found=$(git ls-tree -z --name-only FETCH_HEAD -- .github/badges/findings.json | tr -d "\0") || listed=$?
            if [ "$listed" -ne 0 ]; then
              echo "::error::дерево ветки badges не прочитано (ls-tree код $listed) — архив не перенести, публикацию останавливаю"
              exit 1
            elif [ -z "$found" ]; then
              echo "архива на ветке ещё нет — наполнение с начала"
            else
              shown=0
              git show FETCH_HEAD:.github/badges/findings.json > "$prev" || shown=$?
              if [ "$shown" -ne 0 ]; then
                echo "::error::архив на ветке есть, но не прочитан (show код $shown) — публикацию останавливаю"
                exit 1
              fi
              args+=(--previous "$prev")
            fi
          else
            remote=0
            git ls-remote --exit-code --heads origin badges >/dev/null || remote=$?
            case "$remote" in
              2) echo "ветки badges ещё нет — наполнение с начала" ;;
              *)
                echo "::error::ветка badges не прочитана (ls-remote код $remote) — архив не перенести, публикацию останавливаю"
                exit 1
                ;;
            esac
          fi
          rc=0
          python $MECHANISMS/scripts/findings_archive.py --repo "${GITHUB_REPOSITORY}" --out "$out" \
            "${args[@]}" || rc=$?
          case "$rc" in
            0) ;;
            *)
              echo "::warning::архив находок не дописан (код $rc) — переношу прежний как есть."
              if [ -f "$prev" ]; then cp "$prev" "$out"; fi
              echo "carried=$rc" >> "$GITHUB_OUTPUT"
              ;;
          esac
      # ПРИЁМКА СТРОЖЕ ЧИНИМОГО (193, #864): архив сверяется с историей общей
      # ветки независимым чтением, а не тем же разбором, что его собрал.
      # Расхождение — предупреждение: публикацию оно не держит, но называется
      # числом на каждой сборке.
      # Сверка идёт против ОБЩЕЙ ветки явно, а не против HEAD: запуск кнопкой с
      # другой ветки сравнил бы архив с чужой историей (взгляд на #873). Прежний
      # архив нужен, чтобы предупреждать только о новом расхождении.
      - name: сверить архив с историей
        if: inputs.archive
        env:
          ARCHIVE: ${{ runner.temp }}/facts/findings.json
          PREVIOUS: ${{ runner.temp }}/findings-prev.json
        run: |
          set -uo pipefail
          rc=0
          python $MECHANISMS/scripts/archive_against_history.py --archive "$ARCHIVE" \
            --previous "$PREVIOUS" --ref origin/main || rc=$?
          case "$rc" in
            0|3) ;;
            *) echo "::warning::архив с историей не сверен (код $rc) — приёмка перечитки не проверена" ;;
          esac
      - name: опубликовать факты коммитом поверх ветки badges
        if: inputs.publish
        # Вход идёт окружением, а не подстановкой в текст команды (085).
        env:
          ARCHIVE_FLAG: ${{ inputs.archive && '--archive' || '' }}
        # Запись — скриптом, а не сценарием оболочки (решение владельца
        # 08.10.2026, #639): что кладётся на ветку, названо константой
        # `publish_facts.PUBLISHES`, и гейт читает её, а не разбирает оболочку.
        run: >-
          python $MECHANISMS/scripts/publish_facts.py "$RUNNER_TEMP/facts/facts.json"
          --workdir "$RUNNER_TEMP/publish" --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          $ARCHIVE_FLAG
      # ПЕРЕНОС БЕЗ ДОПИСЫВАНИЯ — КРАСНОЕ, НО ПОСЛЕ ПУБЛИКАЦИИ: факты и прежний
      # архив ложатся на ветку, а замерший архив не зеленеет молча.
      - name: архив не замер
        if: inputs.archive && steps.archive.outputs.carried != ''
        env:
          CARRIED: ${{ steps.archive.outputs.carried }}
        run: |
          echo "::error::архив находок перенесён без дописывания (код $CARRIED) — факты опубликованы, архив стоит на месте"
          exit 1
