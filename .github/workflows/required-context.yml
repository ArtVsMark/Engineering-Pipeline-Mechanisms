# Сверка обязательного контекста защиты ветки с тем, что выдаёт дерево.
#
# Настройка защиты живёт ВНЕ дерева: её не видит ни ревью, ни прогон гейтов.
# Расхождение между именем джоба и именем в списке обязательных не краснеет
# нигде — у соседнего проекта защита требовала контекста, которого не выдавал
# ни один прогон, и не сливалось ничего при зелёных проверках.
#
# РАСПИСАНИЯ ЗДЕСЬ НЕТ НАМЕРЕННО. Что остаётся `cron`-прогоном, а что уезжает в
# локальную службу наблюдения, решается задачей #4. Завести расписание сейчас
# значило бы зафиксировать в общем модуле то, что через месяц придётся снимать
# из пяти проектов сразу. Пока — кнопка.
name: required-context

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "pyyaml>=6,<7" ./packages/transport
      - name: сверить имя контекста с защитой ветки
        env:
          # ТОКЕН ПРОГОНА ЗДЕСЬ ДОСТАТОЧЕН, И ЭТО ЗАМЕР. Набор правил и настройки
          # слияния площадка отдаёт публично: 15.09.2026 оба адреса прочитаны
          # вообще без токена. Прежде сверка спрашивала КЛАССИЧЕСКУЮ защиту, где
          # права нужны, — из-за неё и считалась «ненастроенной без токена
          # владельца». Токен владельца по-прежнему берётся, если он задан:
          # квота у него своя.
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          rc=0
          said="${RUNNER_TEMP}/compare.txt"
          python scripts/check_required_context.py >"$said" 2>&1 || rc=$?
          cat "$said"
          # ПРИЧИНА ЕДЕТ В АННОТАЦИЮ, А НЕ ОСТАЁТСЯ В ЛОГЕ. Логи прогонов из части
          # окон не читаются вовсе, и «смотрите вывод шага» для них — тупик:
          # красное есть, причины нет (142). Переводы строк в аннотации заменяются
          # пробелами — площадка держит её одной строкой.
          reason="$(tr '\n' ' ' <"$said")"
          # Список разрешённого (068): зелёным считается только объявленное.
          case "$rc" in
            0) ;;
            3)
              echo "::warning::${reason}"
              exit 1
              ;;
            *)
              echo "::error::Сверка контекста не отработала (код $rc): ${reason}"
              exit 1
              ;;
          esac
          exit 0
