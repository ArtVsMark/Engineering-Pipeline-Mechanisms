# Сверка обязательного контекста защиты ветки с тем, что выдаёт дерево.
#
# Настройка защиты живёт ВНЕ дерева: её не видит ни ревью, ни прогон гейтов.
# Расхождение между именем джоба и именем в списке обязательных не краснеет
# нигде — у соседнего проекта защита требовала контекста, которого не выдавал
# ни один прогон, и не сливалось ничего при зелёных проверках.
#
# РАСПИСАНИЯ ЗДЕСЬ НЕТ, И ВТОРОЕ НЕ ЗАВОДИТСЯ. Обе сверки этого прогона
# поставлены в ночной дрейф (`scripts/drift.py`, #948): наблюдение принадлежит
# одному ночному заходу, а не второму расписанию (решение 004). Но идут они
# РАЗНЫМИ ТОКЕНАМИ. Обязательные контексты дрейф сверяет токеном прогона —
# источник «защита общей ветки»: набор правил площадка отдаёт любому токену.
# Способы слияния — источник «способ слияния» — дрейф читает токеном
# владельца: токену прогона полей `allow_*` площадка не отдаёт никогда, и
# решением владельца 30.09.2026 дрейфу дан MERGE_QUEUE_TOKEN (#953). Эта
# кнопка остаётся ручной сверкой обеих половин вне ночного захода.
name: required-context

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet "pyyaml>=6,<7" ./packages/transport
      # ТОКЕН ПРОГОНА ДОСТАТОЧЕН ПОЛОВИНЕ, И ЭТО ЗАМЕР. Набор правил площадка
      # отдаёт любому токену. Настройки слияния (`allow_*`) — нет: токену
      # прогона она их не отдаёт (замер 29.09.2026, #953), и без токена
      # владельца сверка способов слияния говорит «не отработало». Замер
      # 15.09.2026 «прочитано без токена» касался двух адресов НАБОРА ПРАВИЛ
      # (`scripts/protection.py`) и верен; на настройки слияния его
      # распространили без замера.
      #
      # ПОЭТОМУ СЕКРЕТ ПОЛУЧАЕТ ОДИН ЗАПРОС (#993, взгляд на #1117): этот шаг
      # читает настройки слияния и кладёт в файл только поля `allow_*`, а
      # сверка ниже идёт без секрета. Тот же приём, что у дрейфа. Файл не
      # записан — причина в аннотации, а половина «способ слияния» ниже скажет
      # «не отработало», а не «сошлось».
      - name: прочитать настройки слияния токеном владельца
        env:
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          said="${RUNNER_TEMP}/merge-ways.txt"
          rc=0
          python scripts/check_required_context.py --save-merge-ways "$RUNNER_TEMP/merge-ways.json" >"$said" 2>&1 || rc=$?
          cat "$said"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Настройки слияния не прочитаны заходом с секретом (код $rc): $(tr '\n' ' ' <"$said")"
          fi
      - name: сверить имя контекста с защитой ветки
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          rc=0
          said="${RUNNER_TEMP}/compare.txt"
          python scripts/check_required_context.py --merge-ways-from "$RUNNER_TEMP/merge-ways.json" >"$said" 2>&1 || rc=$?
          cat "$said"
          # ПРИЧИНА ЕДЕТ В АННОТАЦИЮ, А НЕ ОСТАЁТСЯ В ЛОГЕ. Логи прогонов из части
          # окон не читаются вовсе, и «смотрите вывод шага» для них — тупик:
          # красное есть, причины нет (142). Переводы строк в аннотации заменяются
          # пробелами — площадка держит её одной строкой.
          reason="$(tr '\n' ' ' <"$said")"
          # Список разрешённого (068): зелёным считается только объявленное.
          case "$rc" in
            0) ;;
            3)
              echo "::warning::${reason}"
              exit 1
              ;;
            *)
              echo "::error::Сверка контекста не отработала (код $rc): ${reason}"
              exit 1
              ;;
          esac
          exit 0
