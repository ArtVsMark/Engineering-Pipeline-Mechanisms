# Сверка обязательного контекста защиты ветки с тем, что выдаёт дерево.
#
# Настройка защиты живёт ВНЕ дерева: её не видит ни ревью, ни прогон гейтов.
# Расхождение между именем джоба и именем в списке обязательных не краснеет
# нигде — у соседнего проекта защита требовала контекста, которого не выдавал
# ни один прогон, и не сливалось ничего при зелёных проверках.
#
# РАСПИСАНИЯ ЗДЕСЬ НЕТ, И ВТОРОЕ НЕ ЗАВОДИТСЯ. Обе сверки этого прогона
# поставлены в ночной дрейф (`scripts/drift.py`, #948): наблюдение принадлежит
# одному ночному заходу, а не второму расписанию (решение 004). Но идут они
# РАЗНЫМИ ТОКЕНАМИ. Обязательные контексты дрейф сверяет токеном прогона —
# источник «защита общей ветки»: набор правил площадка отдаёт любому токену.
# Способы слияния — источник «способ слияния» — дрейф читает токеном
# владельца: токену прогона полей `allow_*` площадка не отдаёт никогда, и
# решением владельца 30.09.2026 дрейфу дан MERGE_QUEUE_TOKEN (#953). Эта
# кнопка остаётся ручной сверкой обеих половин вне ночного захода.
name: required-context

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ТОНКИЙ ВЫЗОВ (#1385): сверка — общим шагом `step-required-context.yml`,
  # кнопка — здесь. Имя записи проверки составное: `compare / compare`.
  compare:
    uses: ./.github/workflows/step-required-context.yml
    secrets:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
