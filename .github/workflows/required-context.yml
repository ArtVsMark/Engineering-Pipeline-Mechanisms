# Сверка обязательного контекста защиты ветки с тем, что выдаёт дерево.
#
# Настройка защиты живёт ВНЕ дерева: её не видит ни ревью, ни прогон гейтов.
# Расхождение между именем джоба и именем в списке обязательных не краснеет
# нигде — у соседнего проекта защита требовала контекста, которого не выдавал
# ни один прогон, и не сливалось ничего при зелёных проверках.
#
# РАСПИСАНИЯ ЗДЕСЬ НЕТ, И ОНО НЕ НУЖНО. Обе сверки этого прогона идут ночью
# в дрейфе (`scripts/drift.py`): обязательные контексты — источник «защита
# общей ветки», лишние способы слияния — источник «способ слияния» (#948).
# Наблюдение принадлежит одному ночному заходу, а не второму расписанию
# (решение 004), и у дрейфа уже есть адресат красного. Второй источник ночью
# МОЛЧИТ С ПРИЧИНОЙ: токену прогона площадка настроек слияния не отдаёт, и
# давать ли дрейфу токен владельца — решение владельца (#953). Здесь — кнопка
# для сверки сразу после правки настроек, и способы слияния она видит только
# с токеном владельца.
name: required-context

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "pyyaml>=6,<7" ./packages/transport
      - name: сверить имя контекста с защитой ветки
        env:
          # ТОКЕН ПРОГОНА ДОСТАТОЧЕН ПОЛОВИНЕ, И ЭТО ЗАМЕР. Набор правил площадка
          # отдаёт любому токену. Настройки слияния (`allow_*`) — нет: токену
          # прогона она их не отдаёт (замер 29.09.2026, #953), и без токена
          # владельца сверка способов слияния говорит «не отработало». Замер
          # 15.09.2026 «прочитано без токена» касался двух адресов НАБОРА ПРАВИЛ
          # (`scripts/protection.py`) и верен; на настройки слияния его
          # распространили без замера.
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          rc=0
          said="${RUNNER_TEMP}/compare.txt"
          python scripts/check_required_context.py >"$said" 2>&1 || rc=$?
          cat "$said"
          # ПРИЧИНА ЕДЕТ В АННОТАЦИЮ, А НЕ ОСТАЁТСЯ В ЛОГЕ. Логи прогонов из части
          # окон не читаются вовсе, и «смотрите вывод шага» для них — тупик:
          # красное есть, причины нет (142). Переводы строк в аннотации заменяются
          # пробелами — площадка держит её одной строкой.
          reason="$(tr '\n' ' ' <"$said")"
          # Список разрешённого (068): зелёным считается только объявленное.
          case "$rc" in
            0) ;;
            3)
              echo "::warning::${reason}"
              exit 1
              ;;
            *)
              echo "::error::Сверка контекста не отработала (код $rc): ${reason}"
              exit 1
              ;;
          esac
          exit 0
