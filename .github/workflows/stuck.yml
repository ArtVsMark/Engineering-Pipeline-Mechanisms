# Шаг 11 скелета: изменение готово и НЕ СЛИТО (docs/pipeline.md).
#
# ПРЕДМЕТ ЗДЕСЬ — ОТСУТСТВИЕ ЗАПИСИ, А НЕ ЕЁ ИСХОД. Обязательная проверка,
# которой не создалось вовсе, не краснеет нигде: краснеть нечему, а защита
# ветки ждёт вердикт, которого не будет. Ни один другой прогон о таком не
# скажет — все они спрашивают исходы (075, 104).
#
# СОСЕД НАЗВАН. Своё красное и конфликт берёт оклик (`hail.yml`): там есть кому
# работать. Сюда попадает ровно то, что оклик пропускает, — зелёное и стоящее
# (195). Пересечения нет по построению.
#
# ПО ЧУЖОМУ ПРОГОНУ, И ЭТО НЕ СЛУЧАЙНОСТЬ. У застрявшего собственного прогона
# как раз и нет — иначе оно бы не застряло. Заход обходит ВСЕ живые изменения
# сразу, поэтому будит его работа соседа. Расписания здесь нет: наблюдение и
# тревога — предмет службы (docs/decisions/004-schedules-stay-service-observes.md).
#
# ТОКЕН ВЛАДЕЛЬЦА. Состояние слияния площадка считает только тому, у кого есть
# доступ на запись — это выяснено прогоном у оклика, а не чтением. Без секрета
# шаг не краснеет, а говорит (084): слепой обход хуже отсутствующего.
name: stuck

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  # У события всегда есть ручная кнопка: события теряются (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  # Реестр застрявших — задача, и ведёт её механизм.
  issues: write
  pull-requests: read
  checks: read

concurrency:
  # Один заход на репозиторий: реестр — общий ресурс, и у него один владелец
  # (149). Два захода подряд переписали бы тело друг друга.
  group: stuck
  cancel-in-progress: false

jobs:
  stuck-prs:
    name: stuck-prs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "pyyaml>=6,<7"
      - name: готовое и не слитое
        # Отказ обхода не роняет ничего: это след, а не условие работы (084).
        continue-on-error: true
        env:
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          rc=0
          python scripts/stuck.py --apply || rc=$?
          case "$rc" in
            0) echo "застрявших нет" ;;
            1) echo "::warning::застрявшее найдено — причина названа в реестре" ;;
            3) echo "::warning::обход не настроен — нет MERGE_QUEUE_TOKEN, состояние слияния ему не видно" ;;
            *) echo "::warning::обход не отработал (код $rc) — застрявшее осталось без адресата" ;;
          esac
