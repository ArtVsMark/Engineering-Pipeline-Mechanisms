# ПЕРЕИСПОЛЬЗУЕМЫЙ ПРОГОН: общий шаг, который зовут, а не запускают.
#
# Тело переехало из прогона, который его исполнял, ЦЕЛИКОМ — у шагов конвейера
# из `ci.yml`, у управляющих механизмов из их собственного прогона, — и при
# переезде менялся адрес, а не поведение: иначе перевод и починку нельзя было
# бы отличить друг от друга. Код конвейера шаг с тех пор берёт своим checkout
# (#990) — это сказано в его блоке кода, а не здесь.
#
# ОТДАЁТСЯ НАРУЖУ: потребитель зовёт этот файл адресом с версией, к которой он
# прибит (157), а не копией у себя. Почему копия — беда, с замером копий по
# проектам семьи, — в договоре, docs/use/pipeline.md (022).
#
# ИМЯ ЗАПИСИ ПРОВЕРКИ У ВЫЗВАННОГО ДЖОБА СОСТАВНОЕ — «<имя вызывающего> / <имя
# вызванного>». Замер прогоном на живой площадке (изменение #549), а не по
# документации: из окна она недоступна (139).
#
# ДУБЛЬ ЭТОЙ ШАПКИ НАМЕРЕННЫЙ, И ЭТО СКАЗАНО, А НЕ УМОЛЧАНО (071). Площадка
# требует от переиспользуемого прогона ОТДЕЛЬНОГО ФАЙЛА: вынести пояснение в
# общее место нечем — комментарий не подключается, а сам прогон зовут по адресу
# файла. Цена названа: правка пояснения идёт по всем файлам разом, и расходятся
# они молча. Держит их от расхождения не внимание, а прогон
# `tests/test_reusable_steps.py`.
name: step-automerge

on:
  workflow_call:
    secrets:
      # ТОКЕН ВЛАДЕЛЬЦА ПРИХОДИТ ТОЛЬКО ЯВНО. Секретов вызывающего вызванный
      # прогон не видит, и вызывающий передаёт ровно этот, по имени (#993).
      # НЕОБЯЗАТЕЛЕН НАМЕРЕННО, и это прежнее поведение, а не новое: без
      # секрета механизм отвечает своим исходом «не настроено» — шаг не
      # краснеет, а говорит (084). Обязательным он не объявлен, чтобы «не
      # настроено» оставалось ответом механизма, а не отказом самого вызова.
      MERGE_QUEUE_TOKEN:
        required: false

# Права объявляет ВЫЗЫВАЮЩИЙ: у переиспользуемого прогона своего события нет,
# и просить права ему не у кого. Здесь они названы потолком — большего шаг не
# получит, даже если вызывающий даст больше.
permissions:
  contents: read
  checks: read
  pull-requests: read
  # Реестр слитого без внешнего взгляда — живая задача, и ведёт её этот шаг.
  issues: write

jobs:
  automerge:
    # Очередь и слияние (scripts/automerge.py). Когда двигать очередь, решает
    # ВЫЗЫВАЮЩИЙ — события и единственная группа заходов стоят у него
    # (`.github/workflows/automerge.yml`), здесь только заход.
    name: automerge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Тело уплотнения собирается из коммитов ветки — нужна вся история.
      # ЗАКРЕПЛЕНО ПО SHA, ПОТОМУ ЧТО ВЫЗЫВАЮЩИЙ БЕРЁТСЯ С ОБЩЕЙ ВЕТКИ. На
      # `workflow_run` площадка берёт файл прогона с `main`, а не из изменения:
      # значит вызываемое обязано быть закреплено, иначе подвижная метка меняет
      # исполняемый код без нашего ведома
      # ([152](https://github.com/ArtVsMark/Engineering-Incidents-Playbook/blob/main/rules/ru/152-pinning-callee-without-caller.md)).
      # На `pull_request` рассуждение обратное — там файл прогона правит тот же,
      # кто правит изменение, и закрепление ничего не добавляет.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # КОД КОНВЕЙЕРА — СВОИМ CHECKOUT, А НЕ ИЗ ДЕРЕВА ВЫЗЫВАЮЩЕГО (#990). У
      # потребителя нашего `scripts/` нет: дерево вызывающего — ЕГО, и в нём
      # только данные. Репозиторий и коммит — того файла, который позвали
      # (`job.workflow_repository`, `job.workflow_sha`), поэтому прибивка
      # вызова к тегу прибивает и код, а адрес поставщика буквами не пишется.
      # Замер прогоном 01.10.2026 (#997): `github.job_workflow_sha` у
      # вызванного шага пуст, `job.workflow_sha` — коммит вызванного файла.
      # Пустой коммит не подменяется веткой по умолчанию молча (045).
      # ДУБЛЬ ЭТОГО БЛОКА НАМЕРЕННЫЙ (071): площадка не подключает шаги внутрь
      # шага, и блок стоит в каждом общем шаге, зовущем наш код. Совпадение
      # блоков держит `tests/test_reusable_steps.py::test_the_code_block_is_one_in_every_step`.
      - name: коммит и репозиторий вызова названы
        env:
          AT: ${{ job.workflow_sha }}
          FROM: ${{ job.workflow_repository }}
        run: |
          if [ -z "$AT" ]; then
            echo "::error::коммит вызова шага не назван — код конвейера не взят (045)"
            exit 1
          fi
          # Пустой репозиторий checkout молча заменил бы деревом вызывающего.
          if [ -z "$FROM" ]; then
            echo "::error::репозиторий вызова шага не назван — checkout взял бы дерево вызывающего (045)"
            exit 1
          fi
      - name: код конвейера — на коммите вызова
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipeline-mechanisms
          persist-credentials: false
      # Из рабочего дерева код уносится: обходы по дереву потребителя видят
      # только его файлы, а не наши.
      - name: унести код конвейера из дерева потребителя
        run: |
          set -euo pipefail
          mv .pipeline-mechanisms "$RUNNER_TEMP/mechanisms"
          echo "MECHANISMS=$RUNNER_TEMP/mechanisms" >>"$GITHUB_ENV"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Шаг читает ответ по классам проверок, а тот разбирает YAML. Без этой
      # строки шаг падал бы на импорте — ДО входа в скрипт, — и свой третий
      # исход выдать не мог: прогон прочитал бы сбой как «секрет не задан».
      - name: поставить разбор состава
        run: python -m pip install --quiet "pyyaml>=6,<7" $MECHANISMS/packages/transport

      - name: двигать очередь
        env:
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # ВЫВОД УХОДИТ В АННОТАЦИЮ И СВОДКУ, А НЕ ТОЛЬКО В ЛОГ. Очередь
        # печатает РАЗБОР: почему голова пропущена, кто взведён, что признано
        # пустым. Лог прогона читается не из всякого окна — облачному хранилище
        # закрыто, — и от захода остаётся код возврата, по которому не
        # разобрать ничего. Ровно на этом 13.09.2026 не удалось подтвердить
        # починку пустой головы: механизм отработал, а показать это было нечем
        # (#287).
        #
        # ЧИТАЕМА СНАРУЖИ ИМЕННО АННОТАЦИЯ, И ЭТО ЗАМЕР, А НЕ ДОГАДКА.
        # 13.09.2026: у джоба `ci-complete` на изменении #290 REST отдаёт
        # `annotations_count: 1`, а `output.summary` — пустую строку. Сводка
        # остаётся для человека в окне площадки, наружу говорит аннотация.
        run: |
          set -uo pipefail
          # `-e` приходит из умолчания площадки и без `|| rc=$?` убил бы
          # оболочку раньше разбора кода: три исхода стали бы двумя.
          rc=0
          python $MECHANISMS/scripts/automerge.py > "${RUNNER_TEMP}/queue.txt" 2>&1 || rc=$?
          cat "${RUNNER_TEMP}/queue.txt"
          # ТЕЛО ПОДАЁТСЯ ОТСТУПОМ, А НЕ ЗАБОРОМ ИЗ КАВЫЧЕК. В выводе очереди
          # есть заголовки изменений, а их пишет человек: три кавычки подряд в
          # заголовке закрывают забор раньше времени, и остаток разбора
          # разъезжается по разметке сводки. Отступ в четыре пробела ломать
          # нечем. Нашли внешние взгляды на #292 — двумя записями.
          {
            echo "### очередь: заход ${rc}"
            echo
            sed 's/^/    /' "${RUNNER_TEMP}/queue.txt"
          } >> "${GITHUB_STEP_SUMMARY}"
          # Аннотация одной строкой: переводы строк экранируются, иначе
          # площадка обрежет сообщение первым же из них. ПОРЯДОК ЗАМЕН
          # ОБЯЗАТЕЛЕН — сперва сам знак процента, иначе подставленный `%0A`
          # превратится в `%250A`.
          said="$(sed -z 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' "${RUNNER_TEMP}/queue.txt")"
          echo "::notice::очередь: заход ${rc}%0A${said}"

          # Коды разбираются СПИСКОМ РАЗРЕШЁННОГО (068): зелёными считаются
          # только объявленные, всё прочее — отказ. Обратный порядок уже стоил
          # соседнему шагу зелёного прогона на сломанном коде.
          case "$rc" in
            0) ;;
            3)
              echo "::warning::MERGE_QUEUE_TOKEN не задан — очередь не двигается. Нужен токен владельца с правами contents:write и pull-requests:write; иначе слияние делает человек, и в общей ветке автором станет он."
              ;;
            *)
              echo "::error::Шаг очереди не отработал (код $rc): $(tr '\n' ' ' <"${RUNNER_TEMP}/queue.txt")"
              exit 1
              ;;
          esac
          exit 0

      # СЛЕД О СЛИЯНИИ БЕЗ ВЗГЛЯДА ОСТАЁТСЯ ЗДЕСЬ, ГДЕ ПРОИСХОДИТ СЛИЯНИЕ.
      # Ревью совещательное намеренно (084), и цена этого одна: «взгляд был и
      # находок нет» и «взгляда не было вовсе» снаружи одинаковы. Код возврата
      # ревью умирает вместе с прогоном, поэтому факт записывается в живую
      # задачу — она переживает слияние (142).
      #
      # ШАГ НЕ ДЕРЖИТ ОЧЕРЕДЬ И НЕ КРАСНЕЕТ: он ведёт запись, а не проверку.
      # Токен здесь прогонный, а не владельца: задача — не слияние, личность
      # человека она не несёт, и отдавать ей право слияния незачем (108).
      - name: слитое без взгляда получает след
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          rc=0
          # Причина отказа едет в аннотацию, а не остаётся в логе: логи прогонов
          # из части окон не читаются вовсе, и «смотрите вывод шага» для них —
          # тупик (142). Приём один на проект (090).
          said="${RUNNER_TEMP}/unlooked.txt"
          python $MECHANISMS/scripts/unlooked.py --apply >"$said" 2>&1 || rc=$?
          cat "$said"
          reason="$(tr '\n' ' ' <"$said")"
          case "$rc" in
            0) echo "осечек канала в окне обхода нет — у всего слитого взгляд был" ;;
            3) echo "реестр слитого без взгляда обновлён: в нём есть открытые осечки канала (новые или прежние)" ;;
            *) echo "::warning::Реестр слитого без внешнего взгляда не отработал (код $rc) — факт остался неназванным: ${reason}" ;;
          esac
