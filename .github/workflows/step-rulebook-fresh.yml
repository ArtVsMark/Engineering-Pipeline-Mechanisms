# ПЕРЕИСПОЛЬЗУЕМЫЙ ПРОГОН: шаг конвейера, который зовут, а не запускают.
#
# Тело переехало из `ci.yml` ЦЕЛИКОМ и без правок — менялся адрес, а не
# поведение: иначе перевод и починку нельзя было бы отличить друг от друга.
#
# ОТДАЁТСЯ НАРУЖУ: потребитель зовёт этот файл адресом с версией, к которой он
# прибит (157), а не копией у себя. Копия — ровно та беда, из-за которой этап 4
# и заведён: замер по пяти проектам нашёл десять повторяющихся имён прогонов, и
# ни одна пара копий не совпала.
#
# ИМЯ ЗАПИСИ ПРОВЕРКИ У ВЫЗВАННОГО ДЖОБА СОСТАВНОЕ — «<имя вызывающего> / <имя
# вызванного>». Замер прогоном на живой площадке (изменение #549), а не по
# документации: из окна она недоступна (139).
#
# ДУБЛЬ ЭТОЙ ШАПКИ НАМЕРЕННЫЙ, И ЭТО СКАЗАНО, А НЕ УМОЛЧАНО (071). Площадка
# требует от переиспользуемого прогона ОТДЕЛЬНОГО ФАЙЛА: вынести пояснение в
# общее место нечем — комментарий не подключается, а сам прогон зовут по адресу
# файла. Цена названа: правка пояснения идёт по всем файлам разом, и расходятся
# они молча. Держит их от расхождения не внимание, а прогон
# `tests/test_reusable_steps.py`.
name: step-rulebook-fresh

on:
  workflow_call:

# Потолок прав: большего шаг не получит, даже если вызывающий даст больше.
permissions:
  contents: read
  checks: read
  pull-requests: read
  issues: read

jobs:
  # СВЕЖЕСТЬ СВОДА — СВОЙ ПРЕДМЕТ И СВОЁ ИМЯ. Сосед выше мерит СРОК жизни окна
  # (правило 006), этот шаг — смену правил под уже работающим окном (правило
  # 047). Сложить их в один джоб значило бы отдать два предмета под одно имя: у
  # `window-lifetime` класс ждёт ПЕРВОГО СВОЕГО красного (решение 020), и чужое
  # красное под его именем это ожидание бы сорвало (046).
  #
  # Выкладка полная и по той же причине: начало окна лежит в истории общей
  # ветки, и в мелком клоне правки свода вышли бы неполными (045).
  #
  # На общей ветке шаг не идёт: предмет — коммиты ИЗМЕНЕНИЯ относительно базы.
  rulebook-fresh:
    name: rulebook-fresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: свод не менялся под окном изменения
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          base="${GITHUB_BASE_REF:-main}"
          # Базу приносит `fetch-depth: 0` выше — тем же приёмом, что у соседа.
          python scripts/check_rulebook_fresh.py --base "origin/$base" --history "origin/$base"
