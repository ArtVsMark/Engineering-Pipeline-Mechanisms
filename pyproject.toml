# Настройки проверок. Один источник на линтер, типы и тесты: вторая настройка
# того же расходится с первой молча (022).

[project]
name = "engineering-pipeline-mechanisms"
description = "Общие механизмы конвейера: скелет один для всех проектов"
requires-python = ">=3.12"
# Версии здесь нет намеренно: версионируется КОНТРАКТ механизмов, а не пакет,
# и его источник — файл CONTRACT_VERSION (правила 035, 164). Второе число
# разошлось бы с первым молча. Пакетом проект не публикуется.
dynamic = ["version"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 объявляют кириллицу «неоднозначной» рядом с латиницей. Проект
# русскоязычный, и на каждой строке документации это даёт находку, которой
# нечего исправить. Правило, срабатывающее всегда, перестают читать — и вместе
# с ним перестают читать соседние (051). Выключено с причиной, а не молча.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
# Скрипты — исполняемые файлы, а не пакет, и запускаются по одному. Общее у них
# всё же есть: транспорт `ghrest` и состав меток `labels` импортируются
# остальными — иначе обвязка расползается копиями. Ключ ниже нужен именно для
# такой раскладки: файлы разбираются как модули, хотя пакета не образуют.
scripts_are_modules = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml", "pytest"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Декоратор pytest.fixture приходит из модуля без типов (см. выше), и strict
# считает украшенную им функцию нетипизированной. Послабление точечное — на
# декораторы в тестах, — а не отключение проверки тестов целиком: их типы
# проверяются наравне со скриптами.
module = ["conftest", "tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Гейт, не нашедший предмета проверки, обязан падать (075). Пустой прогон
# тестов — это ошибка входа, а не «чисто», и без этого ключа он зелёный.
addopts = "-q --strict-markers"
