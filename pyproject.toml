# Настройки проверок. Один источник на линтер, типы и тесты: вторая настройка
# того же расходится с первой молча (022).

[project]
name = "engineering-pipeline-mechanisms"
description = "Общие механизмы конвейера: скелет один для всех проектов"
requires-python = ">=3.12"
# Версии здесь нет намеренно: версионируется КОНТРАКТ механизмов, а не пакет,
# и его источник — файл CONTRACT_VERSION (правила 035, 164). Второе число
# разошлось бы с первым молча. Пакетом проект не публикуется.
dynamic = ["version"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 объявляют кириллицу «неоднозначной» рядом с латиницей. Проект
# русскоязычный, и на каждой строке документации это даёт находку, которой
# нечего исправить. Правило, срабатывающее всегда, перестают читать — и вместе
# с ним перестают читать соседние (051). Выключено с причиной, а не молча.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
# Скрипты — исполняемые файлы, а не пакет, и запускаются по одному. Общее у них
# всё же есть: транспорт `ghrest` и состав меток `labels` импортируются
# остальными — иначе обвязка расползается копиями. Ключ ниже нужен именно для
# такой раскладки: файлы разбираются как модули, хотя пакета не образуют.
scripts_are_modules = true
warn_unused_ignores = true
# ОБЩИЙ НИЗ ЛЕЖИТ В ПАКЕТЕ, И ЕГО НАДО НАЙТИ. Транспорт и обрезка вывода уехали в
# `packages/transport` (решение 024), а механизмы зовут их обычным импортом:
# каталог скрипта попадает в путь первым, и в прогоне пакет установлен. Разбору
# типов установленного пакета недостаточно — он читает дерево, а не окружение,
# поэтому каталог назван здесь. Без этого весь `scripts/` разбирался бы с
# «модуль не найден», то есть проверка типов молча превратилась бы в список
# ненайденного (045).
mypy_path = "packages/transport"

[[tool.mypy.overrides]]
# `_pytest` назван рядом с `pytest` НЕ про запас: это та же библиотека, и в
# окружении шага `типы` её нет ни под одним из имён — он ставит ruff, mypy и
# pyyaml, а pytest не ставит. Послабление по списку имён видит только те формы,
# которые в списке записаны: `pytest` тут стоял, `_pytest.config` — нет, и
# первый же тест, прочитавший живую настройку через внутренний модуль, покрасил
# шаг именем, которого в списке не оказалось
# ([206](https://github.com/ArtVsMark/Engineering-Incidents-Playbook/blob/main/rules/ru/206-a-form-the-gate-cannot-see-is-a-bypass.md)).
# ОБРАЗЕЦ `X.*` ПОКРЫВАЕТ ПОТОМКОВ X, НО НЕ САМ X — и голое имя `_pytest` здесь
# стояло рядом с ним по доводу «mypy требует оба». Довод не подтвердился:
# снятие каждой записи порознь с прогоном `mypy` в окружении шага дало без
# `yaml` три ошибки, без `pytest` шесть, без `_pytest.*` две, а без голого
# `_pytest` — чисто, потому что сам `_pytest` дерево не импортирует нигде.
# Запись убрана, соответствие держит `tests/test_type_leniency.py` (139).
module = ["yaml", "pytest", "_pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Декоратор pytest.fixture приходит из модуля без типов (см. выше), и strict
# считает украшенную им функцию нетипизированной. Послабление точечное — на
# декораторы в тестах, — а не отключение проверки тестов целиком: их типы
# проверяются наравне со скриптами.
module = ["conftest", "tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Гейт, не нашедший предмета проверки, обязан падать (075). Пустой прогон
# тестов — это ошибка входа, а не «чисто», и без этого ключа он зелёный.
# `-ra` печатает причину КАЖДОГО пропуска. Без него пропуск неотличим от
# пройденного: проверки, идущие по живой истории, в мелком чекауте
# пропускаются, и молчаливый пропуск читался бы как «прогнали и сошлось» (045).
addopts = "-q -ra --strict-markers"
# ПУСТАЯ ПАРАМЕТРИЗАЦИЯ — ОТКАЗ, А НЕ «НЕЧЕГО ПРОГОНЯТЬ». Гейт, идущий по списку
# из дерева, при пустом списке собирает НОЛЬ случаев и зеленеет: снаружи он
# неотличим от прошедшего. Умолчание pytest — пометить такой набор пропуском,
# то есть тем же молчанием (045, 075).
#
# Замер 18.09.2026: комментарий выше утверждал это требование с самого начала, а
# ключа, который его держит, не было.
#
# Замер 19.09.2026: обходов дерева в наборе 88 в 51 модуле — числа получены
# `grep -roE '(^|[^.[:alnum:]_])(walk|walk_deep|found_by)[(]' tests/*.py
# --exclude=conftest.py | wc -l` (модули — тот же grep с `-rl`); голое имя
# отделяет обходчики набора от `ast.walk`, который дерева файлов не трогает.
empty_parameter_set_mark = "fail_at_collect"
