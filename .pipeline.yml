# Наполнение конвейера ЭТОГО проекта: чем он отвечает по каждой проверке.
#
# КЛАСС ПРОВЕРКИ — СВОЙСТВО ПОТРЕБИТЕЛЯ, А НЕ МЕХАНИЗМА. Одна и та же проверка
# у разных проектов принадлежит разным классам: объём документа обязателен
# там, где документ выпускается наружу, и совещателен там, где он внутренний;
# у текстового проекта проверки прозы и есть предмет, а `test` может
# отсутствовать вовсе; e2e невозможен у проекта без внешнего окружения. Общий
# конвейер видит только ИМЯ проверки и знать этого за проект не может (174).
#
# Ответ даётся по КАЖДОЙ проверке, а не по подключённым — как в
# `.rules/bindings.json` по каждому правилу каталога (129). Неотвеченная
# получает `unreviewed`: объявленную очередь разбора, а не молчание, — и
# слияния не держит. Молча обязательной новая проверка не становится.
#
# У СОВЕЩАТЕЛЬНОЙ ОБЪЯВЛЯЕТСЯ АДРЕСАТ, И ЭТО РАЗРЕШИМЫЙ АДРЕС. Красное, которому
# негде пережить слияние, делает «совещательную» вежливым «выключена» (142).
# Адрес — задача (`#23`) или путь к механизму, который ведёт запись; проза
# рядом законна, вместо адреса — нет. Требование то же, что каталог предъявил
# полю `where` в ответе потребителя, и по той же причине: канал, чей адресат
# нельзя назвать, обычно и не имеет адресата.
#
# «Записи нет» говорится СЛОВОМ `none`, а не пропуском поля: молчание
# неотличимо от «забыли ответить» (154). Приём взят у `mechanism: none` в
# `.rules/bindings.json`.
#
# Полноту ответа держит `scripts/check_pipeline.py`, читает его
# `scripts/ci_complete.py`. Файл правится руками: это данные, а не производное.
#
# Сводного гейта здесь нет намеренно. Его класс задан построением: он
# единственный обязательный контекст защиты и сам себя не опрашивает.

schema: 4

# ДИАПАЗОН СОВМЕСТИМОСТИ С КОНТРАКТОМ МЕХАНИЗМОВ, И ВЕРХНЯЯ ГРАНИЦА В НЁМ
# ОБЯЗАТЕЛЬНА (073). Без неё несовместимая версия применяется молча: проект,
# объявивший только «не старше», однажды получает поверхность, о которой не
# знает. Границу двигают ПОСЛЕ перечитывания ответов, а не вместо него (157).
contract: ">=0.1,<0.2"

checks:
  # Держат слияние.
  lint: required
  test: required

  # Матрица обязательных версий. Сама она обязательной быть не может: её имена
  # несут версию, и добавление версии меняло бы договор молча. Вердикт по ней
  # несёт агрегат `test`, который обязателен, — поэтому отдельного адресата у
  # её красного нет и не требуется.
  test-matrix:
    class: advisory
    why: её вердикт доезжает до обязательного агрегата `test` через needs
    addressee: none

  # Предрелизная версия языка. Обещания работать на невышедшей версии проект не
  # давал, поэтому слияния она не держит. Но её красное на общей ветке — долг по
  # уже сделанному, и записывает его шаг 9 в источник 3.
  test-next:
    class: advisory
    why: предрелизная версия, обещания работать на ней проект не давал
    addressee: scripts/main_red.py
  pr-meta: required
  journal: required
  attribution: required
  pipeline: required
  # Правка поверхности контракта ломает потребителя молча — значит держит
  # слияние. Это единственный настоящий гейт связи с ним (#15).
  contract: required

  # Слияния не держит: внешний взгляд — совещательный голос, а не второй гейт.
  # Красное здесь обязано оставить запись адресату, переживающему слияние:
  # находки живут в задаче #23 и снимаются строкой «Разобрано: <отпечаток>».
  debt:
    class: advisory
    why: остаток долга слияния не держит, но обязан быть виден на каждом изменении
    # Шаг ничего не находит: он читает уже записанное другими и печатает. Его
    # красное значит «источник не прочитан», и записывать по нему нечего —
    # записи ведут те, кто их делает (#23 и «входящие»).
    addressee: none

  review:
    class: advisory
    why: внешний взгляд слияния не держит, находки живут в задаче #23
    addressee: "#23"

  # Запись находок вынесена отдельным джобом с репозиторной группой: живая
  # задача — общий ресурс, и у него один владелец (149). Замер 09.09: пять
  # копий задачи-адресата за смену, потому что «найти» и «завести» — разные
  # обращения, а прогоны разных изменений шли параллельно.
  findings:
    class: advisory
    why: запись находок слияния не держит; её отказ значит, что находки остались комментарием
    addressee: "#23"

  # Поздний взгляд идёт только кнопкой, по номеру уже слитого изменения: на
  # изменении он не появляется никогда. Ответ здесь есть потому, что джоб живёт
  # в прогоне с событием изменения, — молчания о нём быть не должно (154).
  late-look:
    class: advisory
    why: идёт по расписанию и кнопкой по слитому, а не на изменении; его находки живут в #23, а сам факт взгляда — в реестре #89
    addressee: "#23"

  # Выбор очереди для позднего взгляда. Слияния не касается вовсе: он читает
  # реестр и отдаёт список — предмета на голове изменения у него нет.
  late-queue:
    class: advisory
    why: читает реестр непросмотренного и отдаёт очередь; на изменении не идёт
    addressee: "#89"

  # Разбор слитого против задачи: идёт ПОСЛЕ слияния, держать ему нечего.
  # Его отказ значит, что пункты остались отмеченными только по объявлению
  # автора, а сам разбор — в логе прогона.
  task-items:
    class: advisory
    why: идёт после слияния, слияния не держит; его разбор живёт комментарием в связанной задаче
    addressee: scripts/task_items.py

  # Шаг 8 — не проверка ПЕРЕД слиянием, а само слияние, поэтому держать ему
  # нечего: к моменту, когда он краснеет, сливать уже нечего. Его красное
  # остаётся на самом изменении и возвращает работу в контур 1, источник 2, —
  # то есть адресат у него есть, и это не «вежливо выключена».
  automerge:
    class: advisory
    why: это сам шаг слияния, а не проверка перед ним; его красное значит «не слилось» и живёт на изменении
    # Красное живёт на самом изменении: оно остаётся открытым, с меткой
    # источника, и возвращается в контур 1. Отдельного адресата у этого нет и
    # не нужно — предмет не находка, а несостоявшееся слияние.
    addressee: none

# ПРОГОНЫ ЗА ПРЕДЕЛАМИ ИЗМЕНЕНИЯ, И ОНИ СПРАШИВАЮТСЯ НАРАВНЕ.
#
# Их события — толчок в общую ветку, расписание, ручная кнопка, чужой прогон.
# Записи на голове изменения они не оставляют, поэтому первый раздел их не
# видит намеренно. До этого раздела это значило, что класса у них нет НИГДЕ:
# `main_red` считал совещательным всё, чего нет среди обязательных, — то есть
# выводил ответ из молчания (154). Замер 10.09.2026: таких джобов десять из
# двадцати четырёх, и красное каждого попадало в «не держит слияние» не
# потому, что так решили, а потому, что не спросили.
#
# `required` здесь запрещён ПОСТРОЕНИЕМ, а не выбором: держать слияние нечем.
beyond_the_change:
  # Открывает изменение по толчку ветки. Красное значит, что изменения нет
  # вовсе, — и видно это сразу: ветка стоит без него. Замер 10.09.2026: три
  # ветки подряд простояли по десять минут, пока это заметил человек.
  agent-pr:
    class: advisory
    why: открывает изменение; красное значит «изменение не открыто», и предмета для слияния ещё нет
    addressee: scripts/agent_pr.py

  # Атрибуция в итоговой истории общей ветки. Долг по УЖЕ слитому: правкой
  # изменения он не чинится, и слияния держать ему нечего.
  attribution-history:
    class: advisory
    why: долг по уже слитому — правкой изменения не чинится; это источник 3, а не стоп
    addressee: scripts/main_red.py

  # Публикация фактов и значков. Её красное не мешает работе, но молча
  # оставляет витрину со вчерашними числами — а число, поданное как сегодняшнее,
  # это утверждение на все времена (005).
  badges:
    class: advisory
    why: собирает факты и значки после слияния; красное оставляет витрину со вчерашними числами
    addressee: scripts/main_red.py

  # Дежурный по общей ветке. САМ СЕБЯ НЕ СТОРОЖИТ, и это названо, а не
  # умолчано: его красное некому записать — записывает он. Разорвать круг
  # можно только вторым дежурным, а второй счёт того же расходится с первым
  # молча (022), поэтому здесь честнее сказать «записи нет».
  main-red:
    class: advisory
    why: сам ведёт запись о красноте общей ветки и потому не может записать собственное падение
    addressee: none

  # Синхронизация меток: состав объявлен файлом, прогон доставляет его на
  # площадку. Красное значит, что метки разъехались с файлом, — а метка здесь
  # вход механизма, и её правка меняет вердикт гейта.
  apply:
    class: advisory
    why: доставляет объявленный состав меток; красное значит, что площадка разошлась с файлом
    addressee: scripts/main_red.py

  # Внешний дрейф: снимок семьи, версии языка, закреплённые теги, ответы
  # каталога. Ведёт свою живую задачу и в неё же пишет.
  drift:
    class: advisory
    why: идёт по расписанию и ведёт свою живую задачу — красное живёт там, а не в прогоне
    addressee: scripts/drift.py

  # Ночной заход каталога за числами правила 177. Его молчание видит `debt`:
  # он называет возраст снимка и говорит «долг НЕИЗВЕСТЕН», а не «долга нет».
  inbox:
    class: advisory
    why: приносит числа каталога в задачу-«входящие»; пропущенный заход виден шагу debt по возрасту снимка
    addressee: scripts/debt.py

  # Выпуск по кнопке. Красное значит, что выпуска не случилось, — и это видно
  # по отсутствию тега, а не по записи.
  release:
    class: advisory
    why: идёт кнопкой; красное значит «выпуска не случилось», и видно это по отсутствию тега
    addressee: none

  # Сверка имени обязательного контекста с настройкой защиты ветки. Настройка
  # живёт ВНЕ дерева: её не видит ни ревью, ни прогон, и спросить о ней можно
  # только кнопкой.
  compare:
    class: advisory
    why: сверяет имя обязательного контекста с настройкой вне дерева; идёт кнопкой, по требованию
    addressee: none

  # Ответ на упоминание в обсуждении. Красное значит, что окно не ответило, —
  # и это видно тому, кто спрашивал.
  respond:
    class: advisory
    why: отвечает на упоминание в обсуждении; красное видно тому, кто спрашивал, прямо в нити
    addressee: none
