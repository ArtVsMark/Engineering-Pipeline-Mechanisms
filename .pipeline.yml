# Наполнение конвейера ЭТОГО проекта: чем он отвечает по каждой проверке.
#
# КЛАСС ПРОВЕРКИ — СВОЙСТВО ПОТРЕБИТЕЛЯ, А НЕ МЕХАНИЗМА. Одна и та же проверка
# у разных проектов принадлежит разным классам: объём документа обязателен
# там, где документ выпускается наружу, и совещателен там, где он внутренний;
# у текстового проекта проверки прозы и есть предмет, а `test` может
# отсутствовать вовсе; e2e невозможен у проекта без внешнего окружения. Общий
# конвейер видит только ИМЯ проверки и знать этого за проект не может (174).
#
# Ответ даётся по КАЖДОЙ проверке, а не по подключённым — как в
# `.rules/bindings.json` по каждому правилу каталога (129). Неотвеченная
# получает `unreviewed`: объявленную очередь разбора, а не молчание, — и
# слияния не держит. Молча обязательной новая проверка не становится.
#
# У СОВЕЩАТЕЛЬНОЙ ОБЪЯВЛЯЕТСЯ АДРЕСАТ, И ЭТО РАЗРЕШИМЫЙ АДРЕС. Красное, которому
# негде пережить слияние, делает «совещательную» вежливым «выключена» (142).
# Адрес — задача (`#23`) или путь к механизму, который ведёт запись; проза
# рядом законна, вместо адреса — нет. Требование то же, что каталог предъявил
# полю `where` в ответе потребителя, и по той же причине: канал, чей адресат
# нельзя назвать, обычно и не имеет адресата.
#
# «Записи нет» говорится СЛОВОМ `none`, а не пропуском поля: молчание
# неотличимо от «забыли ответить» (154). Приём взят у `mechanism: none` в
# `.rules/bindings.json`.
#
# Полноту ответа держит `scripts/check_pipeline.py`, читает его
# `scripts/ci_complete.py`. Файл правится руками: это данные, а не производное.
#
# Сводного гейта здесь нет намеренно. Его класс задан построением: он
# единственный обязательный контекст защиты и сам себя не опрашивает.

schema: 2

checks:
  # Держат слияние.
  lint: required
  test: required
  pr-meta: required
  journal: required
  attribution: required
  pipeline: required

  # Слияния не держит: внешний взгляд — совещательный голос, а не второй гейт.
  # Красное здесь обязано оставить запись адресату, переживающему слияние:
  # находки живут в задаче #23 и снимаются строкой «Разобрано: <отпечаток>».
  debt:
    class: advisory
    why: остаток долга слияния не держит, но обязан быть виден на каждом изменении
    # Шаг ничего не находит: он читает уже записанное другими и печатает. Его
    # красное значит «источник не прочитан», и записывать по нему нечего —
    # записи ведут те, кто их делает (#23 и «входящие»).
    addressee: none

  review:
    class: advisory
    why: внешний взгляд слияния не держит, находки живут в задаче #23
    addressee: "#23"

  # Шаг 8 — не проверка ПЕРЕД слиянием, а само слияние, поэтому держать ему
  # нечего: к моменту, когда он краснеет, сливать уже нечего. Его красное
  # остаётся на самом изменении и возвращает работу в контур 1, источник 2, —
  # то есть адресат у него есть, и это не «вежливо выключена».
  automerge:
    class: advisory
    why: это сам шаг слияния, а не проверка перед ним; его красное значит «не слилось» и живёт на изменении
    # Красное живёт на самом изменении: оно остаётся открытым, с меткой
    # источника, и возвращается в контур 1. Отдельного адресата у этого нет и
    # не нужно — предмет не находка, а несостоявшееся слияние.
    addressee: none
