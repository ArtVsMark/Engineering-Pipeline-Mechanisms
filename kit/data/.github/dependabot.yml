# Заготовка механизмов (#1386): Dependabot сообщает, что вышла новая версия
# действия или зовомого шага, изменением с подъёмом строки `uses:`.
#
# Группы не заводятся: заголовок «Bump <действие> from … to …» называет и
# действие, и версию, а групповой — ни того, ни другого.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    # ВЫДЕРЖКА ПОСЛЕ ВЫПУСКА — ТОЛЬКО ДЛЯ ЧУЖИХ (решение владельца 22.10.2026).
    # Умолчание площадки — три дня: свежий чужой выпуск мог оказаться сломанным
    # или вредным, и выдержка даёт ему проявиться. Из неё изъят владелец
    # механизмов, которые проект зовёт: его выпуск выходит через тот же
    # конвейер, и три дня ожидания только задерживали бы подъём, который
    # перехват и так проводит изменением через весь конвейер. Действие
    # другого владельца — даже из семьи — ждёт выдержку, как чужое. Замер 22.10.2026: v2.1.0
    # каталога вышла в 08:08Z, заход Dependabot в 08:19Z написал «Days since
    # release : 0 (cooldown days 3)» и подъёма не предложил.
    cooldown:
      default-days: 3
      exclude:
        # Слот: заход подключения ставит сюда владельца механизмов из `--repo`.
        - "OWNER/*"
