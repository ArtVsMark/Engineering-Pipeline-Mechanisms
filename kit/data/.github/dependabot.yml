# Заготовка механизмов (#1386): Dependabot сообщает, что вышла новая версия
# действия или зовомого шага, изменением с подъёмом строки `uses:`.
#
# Группы не заводятся: заголовок «Bump <действие> from … to …» называет и
# действие, и версию, а групповой — ни того, ни другого.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
